<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Файл не найден | RawerGit</title>
<style>
  :root {
    --color-canvas-default: #ffffff;
    --color-text-primary: #1f2328;
    --color-text-secondary: #656d76;
    --accent-emphasis: #0969da;
    --accent-emphasis-hover: #0860c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-canvas-default: #0d1117;
      --color-text-primary: #e6edf3;
      --color-text-secondary: #7d8590;
      --accent-emphasis: #1f6feb;
      --accent-emphasis-hover: #388bfd;
    }
  }
  /* Переопределение, если тема сохранена в localStorage */
  [data-theme="dark"] {
    --color-canvas-default: #0d1117;
    --color-text-primary: #e6edf3;
    --color-text-secondary: #7d8590;
    --accent-emphasis: #1f6feb;
    --accent-emphasis-hover: #388bfd;
  }
  [data-theme="light"] {
    --color-canvas-default: #ffffff;
    --color-text-primary: #1f2328;
    --color-text-secondary: #656d76;
    --accent-emphasis: #0969da;
    --accent-emphasis-hover: #0860c4;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--color-canvas-default);
    color: var(--color-text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .code { font-size: 80px; font-weight: 600; margin: 0; color: var(--color-text-secondary); }
  .message { font-size: 24px; font-weight: 600; margin: 16px 0 8px; }
  .submessage { color: var(--color-text-secondary); margin-bottom: 32px; max-width: 400px; line-height: 1.5; }
  .btn {
    display: inline-block;
    padding: 8px 16px;
    background: var(--accent-emphasis);
    color: #ffffff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    font-size: 14px;
    transition: background 0.12s;
  }
  .btn:hover { background: var(--accent-emphasis-hover); text-decoration: none; }
</style>
<script>
  const savedTheme = localStorage.getItem('rg-theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : savedTheme);
  }
</script>
</head>
<body>
  <div class="code">404</div>
  <div class="message">Файл или путь не найден</div>
  <div class="submessage">Запрашиваемый ресурс в этом репозитории не существует или был удален.</div>
  <a href="/rawergit/" class="btn">Вернуться в RawerGit</a>
</body>
</html>
