<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email - Bokxz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f1efe9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border: 2px solid #16181d;
            border-radius: 10px;
            box-shadow: 6px 6px 0 rgba(22, 24, 29, 0.92);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        .brand {
            font-family: ui-monospace, monospace;
            font-weight: 800;
            font-size: 28px;
            background: #16181d;
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 24px;
        }
        
        .brand span {
            color: #ff4d00;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #16181d;
        }
        
        p {
            color: #4b5058;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .status {
            padding: 16px;
            border-radius: 6px;
            margin: 24px 0;
            font-weight: 600;
        }
        
        .status-success {
            background: #d8efe2;
            color: #0d7a4f;
            border: 2px solid #0d7a4f;
        }
        
        .status-error {
            background: #fadfdd;
            color: #c62f2f;
            border: 2px solid #c62f2f;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e6e4da;
            border-top-color: #ff4d00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button {
            display: inline-block;
            background: #ff4d00;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            border: 2px solid #16181d;
            box-shadow: 3px 3px 0 rgba(22, 24, 29, 0.92);
            transition: all 0.15s ease;
        }
        
        .button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 rgba(22, 24, 29, 0.92);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">BOKXZ<span>*</span></div>
        
        <div id="loading">
            <div class="spinner"></div>
            <h1>Подтверждение email...</h1>
            <p>Пожалуйста, подождите</p>
        </div>
        
        <div id="success" style="display: none;">
            <h1>Email подтверждён!</h1>
            <p>Теперь вы можете войти в свой аккаунт и начать создавать сайты.</p>
            <a href="/" class="button">Перейти к приложению</a>
        </div>
        
        <div id="error" style="display: none;">
            <h1>Ошибка подтверждения</h1>
            <p id="errorMessage">Не удалось подтвердить email. Попробуйте зарегистрироваться снова.</p>
            <a href="/" class="button">На главную</a>
        </div>
    </div>

    <script>
        // Получаем параметры из URL
        const params = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        
        async function confirmEmail() {
            if (!accessToken) {
                showError('Отсутствует токен подтверждения');
                return;
            }
            
            try {
                // Отправляем запрос на подтверждение
                const response = await fetch('https://lrxrbixtfxdtegvdcohu.supabase.co/auth/v1/token?grant_type=refresh_token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'ВАШ_ANON_KEY'
                    },
                    body: JSON.stringify({
                        refresh_token: refreshToken
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Не удалось подтвердить email');
                }
                
                const data = await response.json();
                
                // Сохраняем сессию
                localStorage.setItem('sb-lrxrbixtfxdtegvdcohu-auth-token', JSON.stringify({
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    expires_at: data.expires_at,
                    user: data.user
                }));
                
                // Показываем успех
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                
                // Через 3 секунды редирект на главную
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
        
        // Запускаем подтверждение
        confirmEmail();
    </script>
</body>
</html>
