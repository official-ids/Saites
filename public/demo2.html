<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undercur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Обычный режим - просто черный экран */
        #main-mode {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Режим субтитров */
        #subtitle-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 177.77vh;
            height: 100vh;
            min-width: 100vw;
            min-height: 56.25vw;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: none;
        }

        .subtitle-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 80%;
            max-width: 800px;
            overflow: hidden;
            height: 150px;
        }

        .subtitle-wrapper {
            position: absolute;
            width: 100%;
            text-align: center;
            will-change: transform;
        }

        .subtitle-text {
            font-size: 2.2em;
            color: #fff;
            text-shadow: 
                3px 3px 6px rgba(0, 0, 0, 1),
                2px 2px 4px rgba(0, 0, 0, 0.9);
            font-weight: bold;
            line-height: 1.6;
            padding: 10px 20px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s ease-out;
        }

        .subtitle-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .subtitle-text.hide {
            opacity: 0;
            transform: translateY(-50px);
        }

        @media (max-width: 768px) {
            .subtitle-text {
                font-size: 1.4em;
            }
            .subtitle-container {
                height: 100px;
                bottom: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Обычный режим - черный экран -->
    <div id="main-mode"></div>

    <!-- Режим субтитров -->
    <div id="subtitle-mode">
        <div class="video-container">
            <iframe 
                id="yt-video"
                src=""
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>
        <div class="subtitle-container">
            <div class="subtitle-wrapper">
                <div class="subtitle-text" id="subtitle-text"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pageParam = urlParams.get('p');

        const mainMode = document.getElementById('main-mode');
        const subtitleMode = document.getElementById('subtitle-mode');
        const subtitleText = document.getElementById('subtitle-text');
        const videoFrame = document.getElementById('yt-video');

        // Все субтитры по порядку
        const subtitles = [
            "Beta тестеры:",
            "greenkx",
            "",
            "Те кто поддержал проект:",
            "1. greenkx: 30 Руб.",
            "2. Влад: 11 Руб.",
            "3. София: 10 Руб.",
            "",
            "Музыка:",
            "Субтитры: Bad Apple",
            "Главное меню: C418-subwoofer-lullaby",
            "Боссы: E1M1 - At Doom's Gate",
            "",
            "Разработчик:",
            "Иван",
            "",
            "Если остались вопросы пишите нам",
            "https://t.me/undercur_bot",
            "",
            "Спасибо за игру"
        ];

        if (pageParam === 'sub') {
            mainMode.style.display = 'none';
            subtitleMode.style.display = 'block';
            
            // Загружаем видео со звуком
            setTimeout(() => {
                videoFrame.src = "https://www.youtube.com/embed/FtutLA63Cp8?autoplay=1&controls=0&showinfo=0&rel=0&modestbranding=1&loop=0&disablekb=1&fs=1&iv_load_policy=3&playsinline=0";
            }, 500);
            
            let currentIndex = 0;
            
            function showNextSubtitle() {
                if (currentIndex >= subtitles.length) {
                    // Начать сначала если дошли до конца
                    currentIndex = 0;
                }
                
                const text = subtitles[currentIndex];
                
                // Скрываем текущий
                subtitleText.classList.remove('show');
                subtitleText.classList.add('hide');
                
                setTimeout(() => {
                    // Меняем текст
                    subtitleText.textContent = text;
                    
                    // Показываем новый
                    subtitleText.classList.remove('hide');
                    subtitleText.classList.add('show');
                    
                    currentIndex++;
                    
                    // Следующий субтитр через 2.5 секунды
                    setTimeout(showNextSubtitle, 2500);
                }, 800);
            }
            
            // Начинаем показ через 3 минуты (когда видео почти закончится)
            setTimeout(() => {
                subtitleText.textContent = subtitles[0];
                setTimeout(() => {
                    subtitleText.classList.add('show');
                    currentIndex = 1;
                    setTimeout(showNextSubtitle, 2500);
                }, 100);
            }, 200000); // 200 секунд = 3:20

        } else {
            mainMode.style.display = 'block';
            subtitleMode.style.display = 'none';
        }
    </script>
</body>
</html>
