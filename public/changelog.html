<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Changelog · Oris</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --accent: #0071E3;
            --border: rgba(0, 0, 0, 0.1);
            --line: #E5E5EA;
            --success: #34C759;
            --warning: #FF9F0A;
            --danger: #FF3B30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #000000;
                --bg-card: #1C1C1E;
                --text-primary: #F5F5F7;
                --text-secondary: #86868B;
                --border: rgba(255, 255, 255, 0.1);
                --line: #38383A;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }

        header { padding: 60px 0 40px; opacity: 0; animation: fadeIn 0.6s ease forwards; }
        h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; }

        /* Timeline Styles */
        .timeline { position: relative; padding-left: 32px; margin-top: 40px; min-height: 200px; }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .release { 
            position: relative; 
            margin-bottom: 48px; 
            opacity: 0; 
            transform: translateY(10px);
            animation: slideUp 0.5s ease forwards;
        }
        .release:last-child { margin-bottom: 0; }

        .dot {
            position: absolute;
            left: -32px;
            top: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg-body);
            border: 3px solid var(--accent);
            z-index: 1;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .release:first-child .dot { 
            background: var(--accent); 
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2); 
        }

        .version-tag {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(0, 113, 227, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .date { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px; display: block; }

        .changes ul { list-style: none; }
        .changes li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .changes li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--text-secondary);
        }

        .type-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-right: 6px;
            opacity: 0.8;
        }
        .type-feat { color: var(--success); }
        .type-fix { color: var(--warning); }
        .type-sec { color: var(--danger); }
        .type-default { color: var(--text-secondary); }

        .back-link {
            display: inline-block;
            margin-top: 60px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent); }

        footer { text-align: center; margin-top: 80px; font-size: 0.8rem; color: var(--text-secondary); }

        /* Loading & Error States */
        .status-message {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .status-message.error { color: var(--danger); }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Changelog</h1>
            <p class="subtitle">История развития платформы Oris и технические обновления.</p>
        </header>

        <div id="timeline" class="timeline">
            <div class="status-message">
                <div class="spinner"></div>
                Загрузка истории изменений...
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/" class="back-link">← Вернуться к проектам</a>
        </div>

        <footer>
            &copy; <span id="year"></span> Oris Development Team
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            document.getElementById('year').textContent = new Date().getFullYear();

            const Security = {
                escapeHtml(str) {
                    if (!str) return '';
                    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                    return String(str).replace(/[&<>"']/g, m => map[m]);
                }
            };

            function getTypeBadge(type) {
                const t = (type || '').toLowerCase();
                const map = {
                    feat: '<span class="type-badge type-feat">Feature</span>',
                    feature: '<span class="type-badge type-feat">Feature</span>',
                    fix: '<span class="type-badge type-fix">Fix</span>',
                    sec: '<span class="type-badge type-sec">Security</span>',
                    security: '<span class="type-badge type-sec">Security</span>',
                    major: '<span class="type-badge type-feat">Major</span>'
                };
                return map[t] || '<span class="type-badge type-default">Update</span>';
            }

            async function loadChangelog() {
                const container = document.getElementById('timeline');
                
                try {
                    const response = await fetch('/api/changelog');
                    
                    if (!response.ok) {
                        throw new Error(`Server responded with ${response.status}`);
                    }

                    const data = await response.json();

                    if (!Array.isArray(data) || data.length === 0) {
                        container.innerHTML = '<div class="status-message">История изменений пуста</div>';
                        return;
                    }

                    let html = '';
                    data.forEach((release, index) => {
                        const safeVersion = Security.escapeHtml(release.version || 'Unknown');
                        const safeDate = Security.escapeHtml(release.date || '');
                        
                        let changesHtml = '';
                        if (Array.isArray(release.changes) && release.changes.length > 0) {
                            changesHtml = '<ul>' + release.changes.map(change => {
                                const safeText = Security.escapeHtml(change.text || '');
                                return `<li>${getTypeBadge(change.type)} ${safeText}</li>`;
                            }).join('') + '</ul>';
                        }

                        html += `
                            <div class="release" style="animation-delay: ${index * 0.08}s">
                                <div class="dot"></div>
                                <span class="version-tag">${safeVersion}</span>
                                ${safeDate ? `<span class="date">${safeDate}</span>` : ''}
                                <div class="changes">
                                    ${changesHtml}
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;

                } catch (err) {
                    console.error('Failed to load changelog:', err);
                    container.innerHTML = '<div class="status-message error">Не удалось загрузить историю изменений</div>';
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadChangelog);
            } else {
                loadChangelog();
            }
        })();
    </script>
</body>
</html>
