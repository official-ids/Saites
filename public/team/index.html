<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Команда Oris — подача заявки на сотрудничество">
<meta name="theme-color" content="#000000">
<title>Team · Oris</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-body: #000000;
    --bg-card: #1C1C1E;
    --bg-elevated: #2C2C2E;
    --bg-input: #1C1C1E;
    --text-primary: #F5F5F7;
    --text-secondary: #86868B;
    --text-tertiary: #636366;
    --accent: #0A84FF;
    --accent-hover: #409CFF;
    --danger: #FF453A;
    --success: #30D158;
    --warning: #FF9F0A;
    --gold: #D4AF37;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono-stack: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    --transition: cubic-bezier(0.25, 0.1, 0.25, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
    background: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-stack);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

/* Header */
.header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
}
.header-inner {
    max-width: 980px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); }
.logo-icon { width: 32px; height: 32px; color: var(--accent); }
.logo-text { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-link {
    padding: 8px 14px; border-radius: 99px;
    font-size: 0.9rem; font-weight: 500;
    color: var(--text-secondary); text-decoration: none;
    transition: all 0.2s ease; cursor: pointer;
    background: transparent; border: none; font-family: inherit;
}
.nav-link:hover { background: rgba(142, 142, 147, 0.12); color: var(--text-primary); }
.nav-link.active { background: var(--accent); color: white; }
.user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px 4px 4px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 99px; cursor: pointer; transition: all 0.2s ease;
}
.user-chip:hover { border-color: var(--border-strong); }
.user-name { font-size: 0.85rem; font-weight: 500; color: var(--text-primary); }

/* Main */
.main-container { max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
.page-header { margin-bottom: 32px; text-align: center; }
.page-title {
    font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.page-subtitle { color: var(--text-secondary); font-size: 1.05rem; max-width: 480px; margin: 0 auto; }

/* Tabs */
.view-tabs {
    display: flex; gap: 4px; background: var(--bg-card);
    padding: 4px; border-radius: 99px; border: 1px solid var(--border);
    margin-bottom: 32px;
}
.view-tab {
    flex: 1; padding: 8px 16px; border-radius: 99px;
    font-size: 0.85rem; font-weight: 500;
    color: var(--text-secondary); background: transparent;
    border: none; cursor: pointer; transition: all 0.2s ease; font-family: inherit;
}
.view-tab.active { background: var(--accent); color: white; }
.view-tab:not(.active):hover { color: var(--text-primary); }

/* Card */
.card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px;
}

/* Forms */
.form-group { margin-bottom: 20px; }
.form-label {
    display: block; font-size: 0.8rem; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.05em;
}
.form-label .required { color: var(--danger); margin-left: 2px; }
.form-input, .form-select {
    width: 100%; padding: 12px 14px;
    font-family: inherit; font-size: 0.95rem;
    background: var(--bg-input); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    transition: all 0.2s ease;
}
.form-input:focus, .form-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
}
.form-input.error { border-color: var(--danger); }
.form-help { font-size: 0.8rem; color: var(--text-tertiary); margin-top: 6px; }
.form-error { font-size: 0.8rem; color: var(--danger); margin-top: 6px; display: none; }
.form-error.visible { display: block; }

/* Checkbox */
.checkbox-wrap {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-md); cursor: pointer;
    transition: all 0.2s ease;
}
.checkbox-wrap:hover { border-color: var(--border-strong); }
.checkbox-wrap input[type="checkbox"] {
    width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer;
}
.checkbox-wrap label { font-size: 0.9rem; cursor: pointer; user-select: none; }

/* Buttons */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 24px; border-radius: 99px;
    font-family: inherit; font-size: 0.9rem; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.2s ease;
    user-select: none; text-decoration: none; white-space: nowrap;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); color: white; width: 100%; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3); }
.btn-secondary { background: rgba(142, 142, 147, 0.12); color: var(--text-primary); }
.btn-secondary:hover:not(:disabled) { background: rgba(142, 142, 147, 0.2); }
.btn-ghost { background: transparent; color: var(--text-secondary); padding: 8px 12px; }
.btn-ghost:hover { color: var(--text-primary); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Status result */
.status-result {
    margin-top: 24px; padding: 20px;
    background: var(--bg-elevated); border-radius: var(--radius-md);
    border: 1px solid var(--border);
}
.status-result.success { border-color: var(--success); }
.status-result.pending { border-color: var(--warning); }
.status-result.rejected { border-color: var(--danger); }
.status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 99px;
    font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em;
}
.status-badge.approved { background: rgba(48, 209, 88, 0.15); color: var(--success); }
.status-badge.pending { background: rgba(255, 159, 10, 0.15); color: var(--warning); }
.status-badge.rejected { background: rgba(255, 69, 58, 0.15); color: var(--danger); }
.credential-box {
    margin-top: 16px; padding: 14px;
    background: var(--bg-body); border-radius: var(--radius-sm);
    border: 1px solid var(--border);
}
.credential-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0;
}
.credential-row + .credential-row { border-top: 1px solid var(--border); }
.credential-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.credential-value {
    font-family: var(--mono-stack); font-size: 0.9rem;
    color: var(--text-primary); word-break: break-all;
}
.copy-btn {
    background: transparent; border: none; color: var(--accent);
    cursor: pointer; padding: 4px; border-radius: 4px;
    transition: all 0.2s ease; display: flex;
}
.copy-btn:hover { background: rgba(10, 132, 255, 0.1); }
.copy-btn svg { width: 16px; height: 16px; }

/* Cabinet */
.cabinet-section { margin-bottom: 24px; }
.cabinet-section:last-child { margin-bottom: 0; }
.cabinet-section-title {
    font-size: 0.78rem; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 12px;
}
.info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
}
.info-row:last-child { border-bottom: none; }
.info-label { font-size: 0.88rem; color: var(--text-secondary); }
.info-value { font-size: 0.88rem; color: var(--text-primary); font-weight: 500; text-align: right; }
.token-box {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--bg-body);
    border: 1px solid var(--border); border-radius: var(--radius-md);
}
.token-value {
    flex: 1; font-family: var(--mono-stack); font-size: 0.85rem;
    color: var(--gold); word-break: break-all;
}
.warning-text {
    margin-top: 10px; font-size: 0.8rem; color: var(--warning);
    display: flex; align-items: flex-start; gap: 6px;
}
.warning-text svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

/* Views */
.view { display: none; animation: fadeIn 0.3s ease; }
.view.active { display: block; }

/* Toast */
.toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-card); padding: 12px 20px;
    border-radius: 99px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border);
    font-size: 0.9rem; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.3s var(--transition); z-index: 300;
    display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(20px); max-width: 90%;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.success { color: var(--success); }
.toast.error { color: var(--danger); }
.toast.info { color: var(--accent); }

/* Spinner */
.spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Empty state */
.empty-state {
    text-align: center; padding: 48px 24px; color: var(--text-secondary);
}
.empty-state svg { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-tertiary); }
.empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.empty-state p { font-size: 0.9rem; }

/* Success code display */
.code-display {
    margin-top: 24px; padding: 24px; text-align: center;
    background: var(--bg-elevated); border-radius: var(--radius-md);
    border: 1px solid var(--success);
}
.code-display-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.code-display-value {
    font-family: var(--mono-stack); font-size: 2rem; font-weight: 700;
    color: var(--success); letter-spacing: 0.1em;
}
.code-display-hint { font-size: 0.85rem; color: var(--text-secondary); margin-top: 12px; }

/* Responsive */
@media (max-width: 640px) {
    .main-container { padding: 32px 16px 80px; }
    .page-title { font-size: 2rem; }
    .header-inner { padding: 12px 16px; }
    .nav-link { padding: 6px 10px; font-size: 0.82rem; }
    .card { padding: 20px; }
    .view-tabs { flex-wrap: wrap; }
    .view-tab { font-size: 0.78rem; padding: 6px 10px; }
}
</style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="/" class="logo">
            <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span class="logo-text">Oris</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Projects</a>
            <a href="/news" class="nav-link">News</a>
            <a href="/changelog.html" class="nav-link">Changelog</a>
            <a href="/team" class="nav-link active">Team</a>
            <div id="authArea"></div>
        </div>
    </div>
</header>

<main class="main-container">
    <div class="page-header">
        <h1 class="page-title">Команда Oris</h1>
        <p class="page-subtitle">Присоединяйтесь к команде. Заполните анкету, и мы рассмотрим вашу заявку.</p>
    </div>

    <div class="view-tabs" id="viewTabs">
        <button class="view-tab active" data-view="apply">Заявка</button>
        <button class="view-tab" data-view="code">Статус</button>
        <button class="view-tab" data-view="login">Вход</button>
    </div>

    <!-- View: Apply -->
    <div class="view active" id="view-apply">
        <div class="card">
            <form id="applyForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">ФИО <span class="required">*</span></label>
                    <input type="text" class="form-input" id="fullName" placeholder="Иванов Иван Иванович" maxlength="100" autocomplete="name">
                    <div class="form-error" data-error-for="fullName"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Номер телефона</label>
                    <input type="tel" class="form-input" id="phone" placeholder="+7 999 123 45 67" maxlength="20" autocomplete="tel">
                    <div class="form-help">Необязательно</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="contact">Telegram или Email <span class="required">*</span></label>
                    <input type="text" class="form-input" id="contact" placeholder="@username или email@example.com" maxlength="100">
                    <div class="form-help">Основной способ связи</div>
                    <div class="form-error" data-error-for="contact"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="age">Возраст <span class="required">*</span></label>
                    <input type="number" class="form-input" id="age" placeholder="25" min="14" max="100">
                    <div class="form-error" data-error-for="age"></div>
                </div>
                <div class="form-group">
                    <div class="checkbox-wrap">
                        <input type="checkbox" id="hasMicrophone">
                        <label for="hasMicrophone">Есть микрофон или гарнитура</label>
                    </div>
                    <div class="form-help">Необязательно</div>
                </div>
                <button type="submit" class="btn btn-primary" id="applyBtn">
                    <span>Отправить заявку</span>
                </button>
            </form>
            <div id="applyResult"></div>
        </div>
    </div>

    <!-- View: Code -->
    <div class="view" id="view-code">
        <div class="card">
            <div class="form-group">
                <label class="form-label" for="statusCode">Код заявки</label>
                <input type="text" class="form-input" id="statusCode" placeholder="ABC123" maxlength="6" style="text-transform: uppercase; font-family: var(--mono-stack); letter-spacing: 0.1em; text-align: center; font-size: 1.2rem;">
                <div class="form-help">Введите код, полученный после подачи заявки</div>
            </div>
            <button class="btn btn-primary" id="checkStatusBtn">Проверить статус</button>
            <div id="statusResult"></div>
        </div>
    </div>

    <!-- View: Login -->
    <div class="view" id="view-login">
        <div class="card">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginInput">Логин</label>
                    <input type="text" class="form-input" id="loginInput" placeholder="Ваш логин" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="passwordInput">Пароль</label>
                    <input type="password" class="form-input" id="passwordInput" placeholder="Ваш пароль" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span>Войти</span>
                </button>
            </form>
        </div>
    </div>

    <!-- View: Cabinet -->
    <div class="view" id="view-cabinet">
        <div class="card" id="cabinetContent">
            <div class="spinner" style="margin: 40px auto;"></div>
        </div>
    </div>
</main>

<div class="toast" id="toast">
    <span id="toastMessage"></span>
</div>

<script>
(function() {
    'use strict';

    // ============================================
    // Конфигурация
    // ============================================
    const CONFIG = {
        API_BASE: '/api/team',
        STORAGE_KEY: 'oris_team_session',
        VIEWS: ['apply', 'code', 'login', 'cabinet']
    };

    // ============================================
    // Состояние
    // ============================================
    const State = {
        session: null,
        token: null,
        currentView: 'apply'
    };

    // ============================================
    // Утилиты
    // ============================================
    const Security = {
        escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, m => map[m]);
        }
    };

    function toast(message, type = 'info') {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = message;
        t.className = `toast ${type} visible`;
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => t.classList.remove('visible'), 3000);
    }

    function setLoading(btn, isLoading, text = 'Загрузка...') {
        if (isLoading) {
            btn.dataset.originalHtml = btn.innerHTML;
            btn.innerHTML = `<div class="spinner"></div><span>${text}</span>`;
            btn.disabled = true;
        } else {
            btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML;
            btn.disabled = false;
        }
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        }
    }

    // ============================================
    // API Client
    // ============================================
    const Api = {
        headers() {
            const h = { 'Content-Type': 'application/json' };
            if (State.token) h['Authorization'] = `Bearer ${State.token}`;
            return h;
        },
        async request(url, options = {}) {
            const res = await fetch(CONFIG.API_BASE + url, {
                ...options,
                headers: { ...this.headers(), ...(options.headers || {}) }
            });
            if (res.status === 401) {
                this.handleAuthError();
                throw new Error('Сессия истекла');
            }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
            return data;
        },
        handleAuthError() {
            State.session = null;
            State.token = null;
            localStorage.removeItem(CONFIG.STORAGE_KEY);
            switchView('login');
            updateAuthArea();
        },
        apply(data) {
            return this.request('/apply', { method: 'POST', body: JSON.stringify(data) });
        },
        checkStatus(code) {
            return this.request(`/status/${encodeURIComponent(code)}`);
        },
        login(login, password) {
            return this.request('/login', { method: 'POST', body: JSON.stringify({ login, password }) });
        },
        logout() {
            return this.request('/logout', { method: 'POST' });
        },
        getProfile() {
            return this.request('/profile');
        }
    };

    // ============================================
    // Navigation
    // ============================================
    function switchView(view) {
        State.currentView = view;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const el = document.getElementById(`view-${view}`);
        if (el) el.classList.add('active');

        document.querySelectorAll('.view-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.view === view);
        });

        // Обновление URL
        const params = new URLSearchParams(window.location.search);
        if (view === 'apply') params.delete('p');
        else params.set('p', view);
        const newUrl = params.toString() ? `/team?${params}` : '/team';
        history.replaceState({}, '', newUrl);

        if (view === 'cabinet') loadCabinet();
    }

    function getViewFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const p = params.get('p');
        return CONFIG.VIEWS.includes(p) ? p : 'apply';
    }

    // ============================================
    // Apply Form
    // ============================================
    function showError(fieldId, message) {
        const input = document.getElementById(fieldId);
        const errorEl = document.querySelector(`[data-error-for="${fieldId}"]`);
        if (input) input.classList.add('error');
        if (errorEl) {
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }
    }

    function clearErrors() {
        document.querySelectorAll('.form-input.error').forEach(el => el.classList.remove('error'));
        document.querySelectorAll('.form-error.visible').forEach(el => el.classList.remove('visible'));
    }

    function initApplyForm() {
        const form = document.getElementById('applyForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const age = document.getElementById('age').value;
            const hasMicrophone = document.getElementById('hasMicrophone').checked;

            let valid = true;
            if (!fullName || fullName.length < 2) {
                showError('fullName', fullName ? 'Минимум 2 символа' : 'Укажите ФИО');
                valid = false;
            }
            if (!contact) {
                showError('contact', 'Укажите Telegram или email');
                valid = false;
            } else {
                const isTelegram = contact.startsWith('@') && /^@[a-zA-Z0-9_]{3,32}$/.test(contact);
                const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);
                if (!isTelegram && !isEmail) {
                    showError('contact', 'Некорректный формат. Используйте @username или email');
                    valid = false;
                }
            }
            const ageNum = parseInt(age, 10);
            if (!age || isNaN(ageNum) || ageNum < 14 || ageNum > 100) {
                showError('age', 'Возраст от 14 до 100');
                valid = false;
            }
            if (!valid) return;

            const btn = document.getElementById('applyBtn');
            setLoading(btn, true, 'Отправка...');

            try {
                const result = await Api.apply({ fullName, phone, contact, age: ageNum, hasMicrophone });
                document.getElementById('applyResult').innerHTML = `
                    <div class="code-display">
                        <div class="code-display-label">Ваш код заявки</div>
                        <div class="code-display-value">${Security.escapeHtml(result.code)}</div>
                        <div class="code-display-hint">Сохраните код для отслеживания статуса</div>
                        <button class="btn btn-secondary" style="margin-top: 16px;" onclick="navigator.clipboard.writeText('${result.code}').then(() => alert('Код скопирован'))">
                            Скопировать код
                        </button>
                    </div>
                `;
                form.reset();
                toast('Заявка отправлена', 'success');
            } catch (err) {
                toast(err.message, 'error');
            } finally {
                setLoading(btn, false);
            }
        });
    }

    // ============================================
    // Status Check
    // ============================================
    function initStatusCheck() {
        const btn = document.getElementById('checkStatusBtn');
        btn.addEventListener('click', async () => {
            const code = document.getElementById('statusCode').value.trim().toUpperCase();
            if (!code || code.length !== 6) {
                toast('Введите 6-символьный код', 'error');
                return;
            }

            setLoading(btn, true, 'Проверка...');
            const resultEl = document.getElementById('statusResult');

            try {
                const data = await Api.checkStatus(code);
                let html = '';

                if (data.status === 'approved') {
                    html = `
                        <div class="status-result success">
                            <span class="status-badge approved">Одобрено</span>
                            <p style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;">
                                Поздравляем! Ваши учётные данные:
                            </p>
                            <div class="credential-box">
                                <div class="credential-row">
                                    <span class="credential-label">Логин</span>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <span class="credential-value">${Security.escapeHtml(data.login || '')}</span>
                                        <button class="copy-btn" data-copy="${Security.escapeHtml(data.login || '')}" title="Копировать">
                                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                        </button>
                                    </div>
                                </div>
                                ${data.password ? `
                                <div class="credential-row">
                                    <span class="credential-label">Пароль</span>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <span class="credential-value">${Security.escapeHtml(data.password)}</span>
                                        <button class="copy-btn" data-copy="${Security.escapeHtml(data.password)}" title="Копировать">
                                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                        </button>
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                            <p style="margin-top: 12px; font-size: 0.85rem; color: var(--text-tertiary);">
                                Перейдите на вкладку «Вход», чтобы войти в личный кабинет
                            </p>
                        </div>
                    `;
                } else if (data.status === 'pending') {
                    html = `
                        <div class="status-result pending">
                            <span class="status-badge pending">На рассмотрении</span>
                            <p style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;">
                                Ваша заявка принята и ожидает рассмотрения. Обычно это занимает до 24 часов.
                            </p>
                        </div>
                    `;
                } else if (data.status === 'rejected') {
                    html = `
                        <div class="status-result rejected">
                            <span class="status-badge rejected">Отклонено</span>
                            <p style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;">
                                К сожалению, ваша заявка отклонена. Вы можете подать новую заявку.
                            </p>
                        </div>
                    `;
                }

                resultEl.innerHTML = html;

                // Привязка кнопок копирования
                resultEl.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const ok = await copyText(btn.dataset.copy);
                        toast(ok ? 'Скопировано' : 'Ошибка копирования', ok ? 'success' : 'error');
                    });
                });

            } catch (err) {
                resultEl.innerHTML = `<div class="status-result rejected"><p style="color: var(--danger);">${Security.escapeHtml(err.message)}</p></div>`;
            } finally {
                setLoading(btn, false);
            }
        });

        // Enter для проверки
        document.getElementById('statusCode').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    }

    // ============================================
    // Login
    // ============================================
    function initLoginForm() {
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!login || !password) {
                toast('Введите логин и пароль', 'error');
                return;
            }

            const btn = document.getElementById('loginBtn');
            setLoading(btn, true, 'Вход...');

            try {
                const data = await Api.login(login, password);
                State.session = data.session;
                State.token = data.token;
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({ session: data.session, token: data.token }));
                updateAuthArea();
                switchView('cabinet');
                toast('Добро пожаловать!', 'success');
                form.reset();
            } catch (err) {
                toast(err.message, 'error');
            } finally {
                setLoading(btn, false);
            }
        });
    }

    // ============================================
    // Cabinet
    // ============================================
    async function loadCabinet() {
        const container = document.getElementById('cabinetContent');
        container.innerHTML = '<div class="spinner" style="margin: 40px auto;"></div>';

        try {
            const profile = await Api.getProfile();
            container.innerHTML = `
                <div class="cabinet-section">
                    <div class="cabinet-section-title">Admin Token</div>
                    <div class="token-box">
                        <span class="token-value">${Security.escapeHtml(profile.adminToken)}</span>
                        <button class="copy-btn" id="copyTokenBtn" title="Копировать">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        </button>
                    </div>
                    <div class="warning-text">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        <span>Не распространяйте этот токен. Он используется для входа на страницах /news и /support.</span>
                    </div>
                </div>

                <div class="cabinet-section">
                    <div class="cabinet-section-title">Данные анкеты</div>
                    <div class="info-row">
                        <span class="info-label">ФИО</span>
                        <span class="info-value">${Security.escapeHtml(profile.fullName)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Возраст</span>
                        <span class="info-value">${profile.age}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Контакт</span>
                        <span class="info-value">${Security.escapeHtml(profile.contact)}</span>
                    </div>
                    ${profile.phone ? `
                    <div class="info-row">
                        <span class="info-label">Телефон</span>
                        <span class="info-value">${Security.escapeHtml(profile.phone)}</span>
                    </div>
                    ` : ''}
                    <div class="info-row">
                        <span class="info-label">Микрофон</span>
                        <span class="info-value">${profile.hasMicrophone ? 'Да' : 'Нет'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Логин</span>
                        <span class="info-value" style="font-family: var(--mono-stack);">${Security.escapeHtml(profile.login)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Код заявки</span>
                        <span class="info-value" style="font-family: var(--mono-stack);">${Security.escapeHtml(profile.applicationCode)}</span>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button class="btn btn-secondary" id="logoutBtn" style="width: 100%;">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        <span>Выйти</span>
                    </button>
                </div>
            `;

            // Копирование токена
            document.getElementById('copyTokenBtn').addEventListener('click', async () => {
                const ok = await copyText(profile.adminToken);
                toast(ok ? 'Токен скопирован' : 'Ошибка', ok ? 'success' : 'error');
            });

            // Выход
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                try { await Api.logout(); } catch {}
                State.session = null;
                State.token = null;
                localStorage.removeItem(CONFIG.STORAGE_KEY);
                updateAuthArea();
                switchView('login');
                toast('Вы вышли из системы', 'info');
            });

        } catch (err) {
            container.innerHTML = `<div class="empty-state"><h3>Ошибка загрузки</h3><p>${Security.escapeHtml(err.message)}</p></div>`;
        }
    }

    // ============================================
    // Auth Area
    // ============================================
    function updateAuthArea() {
        const area = document.getElementById('authArea');
        if (!area) return;

        if (State.session) {
            area.innerHTML = `
                <div class="user-chip" id="userChip" title="Личный кабинет">
                    <span class="user-name">${Security.escapeHtml(State.session.fullName || State.session.login)}</span>
                </div>
            `;
            document.getElementById('userChip').addEventListener('click', () => switchView('cabinet'));
        } else {
            area.innerHTML = '';
        }
    }

    // ============================================
    // Init
    // ============================================
    function init() {
        // Восстановление сессии
        const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
        if (saved) {
            try {
                const data = JSON.parse(saved);
                State.session = data.session;
                State.token = data.token;
            } catch {
                localStorage.removeItem(CONFIG.STORAGE_KEY);
            }
        }

        updateAuthArea();

        // Tabs
        document.querySelectorAll('.view-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const view = tab.dataset.view;
                if (view === 'cabinet' && !State.session) {
                    switchView('login');
                    return;
                }
                switchView(view);
            });
        });

        // Формы
        initApplyForm();
        initStatusCheck();
        initLoginForm();

        // Начальный view из URL
        const initialView = getViewFromUrl();
        if (initialView === 'cabinet' && !State.session) {
            switchView('login');
        } else {
            switchView(initialView);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
