<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Push</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; margin: 5px; border-radius: 8px; border: 1px solid #000; background: #fff; }
        button:hover { background: #000; color: #fff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #log { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
        .ok { color: #16a34a; }
        .err { color: #dc2626; }
        .info { color: #2563eb; }
    </style>
</head>
<body>
    <h1>Тест Push-уведомлений</h1>
    
    <div>
        <button onclick="subscribe()">1. Подписаться</button>
        <button onclick="sendTest()">2. Отправить тест</button>
        <button onclick="checkStats()">3. Статистика</button>
        <button onclick="clearLog()">Очистить</button>
    </div>

    <div id="log"></div>

    <script>
        const ADMIN_TOKEN = 'ТВОЙ_ADMIN_TOKEN'; // ← замени
        let subscription = null;

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function subscribe() {
            try {
                log('Запрашиваем разрешение...', 'info');
                
                if (Notification.permission === 'default') {
                    const perm = await Notification.requestPermission();
                    if (perm !== 'granted') {
                        log('Разрешение отклонено', 'err');
                        return;
                    }
                }

                log('Получаем VAPID ключ...', 'info');
                const keyRes = await fetch('/notifications/vapid-public-key');
                const { publicKey } = await keyRes.json();

                log('Регистрируем Service Worker...', 'info');
                const reg = await navigator.serviceWorker.register('/sw.js');
                await navigator.serviceWorker.ready;

                log('Подписываемся на push...', 'info');
                subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicKey)
                });

                log('Сохраняем подписку на сервере...', 'info');
                const res = await fetch('/notifications/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscription,
                        channels: ['news', 'updates', 'alerts']
                    })
                });

                const data = await res.json();
                if (data.success) {
                    log('Подписка создана ✅', 'ok');
                } else {
                    log('Ошибка: ' + data.error, 'err');
                }
            } catch (err) {
                log('Ошибка: ' + err.message, 'err');
            }
        }

        async function sendTest() {
            try {
                log('Отправляем тестовое уведомление...', 'info');
                
                const res = await fetch('/notifications/admin/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ADMIN_TOKEN}`
                    },
                    body: JSON.stringify({
                        channel: 'news',
                        notification: {
                            title: '🎉 Тест работает!',
                            body: 'Если ты это видишь — push настроен правильно',
                            url: window.location.pathname,
                            icon: '/favicon.ico',
                            requireInteraction: true
                        }
                    })
                });

                const data = await res.json();
                
                if (data.success) {
                    log(`Отправлено: ${data.results.success}/${data.results.total}`, 'ok');
                    if (data.results.failed > 0) {
                        log(`Ошибок: ${data.results.failed}`, 'err');
                        data.results.errors.forEach(e => log(`  - ${e.error}`, 'err'));
                    }
                } else {
                    log('Ошибка: ' + data.error, 'err');
                }
            } catch (err) {
                log('Ошибка: ' + err.message, 'err');
            }
        }

        async function checkStats() {
            try {
                const res = await fetch('/notifications/stats');
                const stats = await res.json();
                log(`Подписок: ${stats.totalSubscriptions}`, 'info');
                log(`Отправлено: ${stats.totalSent}`, 'info');
                log(`Каналы:`, 'info');
                Object.entries(stats.channels).forEach(([id, ch]) => {
                    log(`  - ${id}: ${ch.subscribers} подписчиков`, 'info');
                });
            } catch (err) {
                log('Ошибка: ' + err.message, 'err');
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
        }
    </script>
</body>
</html>
