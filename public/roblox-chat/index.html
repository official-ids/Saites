
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка - НейроЧат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(135deg, #a8d8ea 0%, #7eb8da 50%, #5a9bd5 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Конфетти анимация */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #fff;
            opacity: 0.7;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .lollipop-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            animation: spin 4s ease-in-out infinite;
        }

        @keyframes spin {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        h1 {
            color: #fff;
            font-size: 2.5em;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #fff;
            font-size: 1.2em;
            opacity: 0.9;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border: 5px solid #fff;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #5a9bd5;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 3px solid #a8d8ea;
            border-radius: 20px;
            font-size: 1em;
            font-family: inherit;
            background: #f0f8ff;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #5a9bd5;
            background: #fff;
            transform: scale(1.02);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #7eb8da 0%, #5a9bd5 100%);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(90, 155, 213, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(90, 155, 213, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .success-message {
            display: none;
            background: #d4f1d4;
            color: #2d7a2d;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
            border: 3px solid #90d990;
            font-size: 1.1em;
        }

        .error-message {
            display: none;
            background: #ffd4d4;
            color: #d9534f;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
            border: 3px solid #f9a8a8;
            font-size: 1.1em;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            border: 3px solid #fff;
        }

        .info-box h3 {
            color: #5a9bd5;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .info-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .info-box a {
            color: #5a9bd5;
            text-decoration: none;
            font-weight: bold;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .form-container {
                padding: 25px;
            }

            .lollipop-icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Конфетти контейнер -->
    <div id="confetti-container"></div>

    <div class="container">
        <div class="header">
            <svg class="lollipop-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Леденец -->
                <circle cx="50" cy="40" r="35" fill="#fff" stroke="#5a9bd5" stroke-width="3"/>
                <path d="M 50 5 A 35 35 0 0 1 85 40" fill="none" stroke="#7eb8da" stroke-width="8" stroke-linecap="round"/>
                <path d="M 50 15 A 25 25 0 0 1 75 40" fill="none" stroke="#a8d8ea" stroke-width="6" stroke-linecap="round"/>
                <path d="M 50 25 A 15 15 0 0 1 65 40" fill="none" stroke="#7eb8da" stroke-width="4" stroke-linecap="round"/>
                <!-- Палочка -->
                <rect x="47" y="75" width="6" height="20" fill="#d4a574" rx="3"/>
            </svg>
            <h1>Центр Поддержки</h1>
            <p class="subtitle">Напиши нам, и мы поможем!</p>
        </div>

        <div class="form-container">
            <form id="supportForm">
                <div class="form-group">
                    <label for="name">Как тебя зовут?</label>
                    <input type="text" id="name" name="name" required placeholder="Твоё имя">
                </div>

                <div class="form-group">
                    <label for="email">Email (необязательно)</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com">
                </div>

                <div class="form-group">
                    <label for="message">Расскажи, что случилось?</label>
                    <textarea id="message" name="message" required placeholder="Опиши свою проблему или задай вопрос..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Отправить сообщение</button>
            </form>

            <div id="successMessage" class="success-message">
                Сообщение отправлено! Мы ответим тебе скоро.
            </div>

            <div id="errorMessage" class="error-message">
                Ой, что-то пошло не так. Попробуй ещё раз!
            </div>
        </div>

        <div class="info-box">
            <h3>Как с нами связаться?</h3>
            <p>Если тебе нужна срочная помощь, напиши нам в Telegram:</p>
            <p><a href="https://t.me/mm2_acc" target="_blank">@mm2_acc</a></p>
            <p>Мы всегда рады помочь и выслушать твои идеи!</p>
        </div>
    </div>

    <script>
        // Создание конфетти
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#fff', '#a8d8ea', '#7eb8da', '#5a9bd5', '#ffd700', '#ff6b9d'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                container.appendChild(confetti);
            }
        }

        createConfetti();

        // Обработка формы
        document.getElementById('supportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            const submitBtn = document.querySelector('.submit-btn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            // Форматирование сообщения для Telegram
            let text = `Новое сообщение с сайта поддержки!\n\n`;
            text += `Имя: ${name}\n`;
            if (email) text += `Email: ${email}\n`;
            text += `\nСообщение:\n${message}`;
            
            try {
                // Отправка в Telegram бота
                const response = await fetch(`https://nameless-glitter-f4c9.dimasik47k.workers.dev/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: '8165620138', // Замени на свой chat_id
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
                
                if (response.ok) {
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    document.getElementById('supportForm').reset();
                    
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 5000);
                } else {
                    throw new Error('Failed to send');
                }
            } catch (error) {
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 5000);
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = 'Отправить сообщение';
        });
    </script>
</body>
</html>
