<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Oris Chat — защищённые групповые чаты">
<meta name="theme-color" content="#000000">
<title>Oris Chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #000000;
    --bg-secondary: #0a0a0a;
    --bg-tertiary: #141414;
    --bg-card: #1a1a1a;
    --bg-hover: #222222;
    --bg-active: #2a2a2a;
    --border-primary: rgba(255, 255, 255, 0.08);
    --border-secondary: rgba(255, 255, 255, 0.12);
    --border-active: rgba(255, 255, 255, 0.2);
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --text-tertiary: #666666;
    --accent: #0A84FF;
    --accent-hover: #409CFF;
    --accent-light: rgba(10, 132, 255, 0.1);
    --success: #30D158;
    --danger: #FF453A;
    --warning: #FF9F0A;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: var(--font-main);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.app {
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* Lobby Screen */
.lobby {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 20% 30%, rgba(10, 132, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(48, 209, 88, 0.06) 0%, transparent 50%);
}

.lobby-card {
    width: 100%;
    max-width: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-xl);
    padding: 40px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.lobby-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, var(--accent) 0%, #5E5CE6 100%);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(10, 132, 255, 0.3);
}

.lobby-icon svg {
    width: 32px;
    height: 32px;
    color: white;
}

.lobby h1 {
    font-size: 28px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
}

.lobby-subtitle {
    font-size: 15px;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.6;
}

.section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 12px;
}

.input-group {
    margin-bottom: 20px;
}

.input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-family: var(--font-main);
    font-size: 15px;
    transition: all 0.2s;
}

.input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-secondary);
}

.input::placeholder {
    color: var(--text-tertiary);
}

.input-mono {
    font-family: var(--font-mono);
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
}

.btn {
    width: 100%;
    padding: 14px 24px;
    border: none;
    border-radius: var(--radius-md);
    font-family: var(--font-main);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-primary {
    background: var(--accent);
    color: white;
}

.btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
}

.btn-primary:active:not(:disabled) {
    transform: translateY(0);
}

.btn-secondary {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border-primary);
}

.btn-secondary:hover:not(:disabled) {
    background: var(--bg-hover);
    border-color: var(--border-secondary);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: var(--text-tertiary);
    font-size: 13px;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-primary);
}

.divider span {
    padding: 0 16px;
}

.room-id-display {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    padding: 20px;
    margin-bottom: 20px;
    cursor: pointer;
    transition: all 0.2s;
}

.room-id-display:hover {
    border-color: var(--accent);
    background: var(--accent-light);
}

.room-id-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
}

.room-id-label span:last-child {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px;
}

.room-id-value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 4px;
    color: var(--text-primary);
}

.status-msg {
    padding: 12px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-sm);
    font-size: 14px;
    margin-top: 16px;
    display: none;
    align-items: center;
    gap: 10px;
}

.status-msg.visible {
    display: flex;
}

.status-msg.error {
    color: var(--danger);
    border-color: rgba(255, 69, 58, 0.3);
}

.status-msg.success {
    color: var(--success);
    border-color: rgba(48, 209, 88, 0.3);
}

/* Chat Screen */
.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

.chat-header {
    padding: 16px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.chat-header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
    min-width: 0;
}

.chat-room-info {
    flex: 1;
    min-width: 0;
}

.chat-room-id {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 4px;
}

.chat-room-meta {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-participants {
    display: flex;
    align-items: center;
    gap: 6px;
}

.chat-participants svg {
    width: 14px;
    height: 14px;
    color: var(--text-tertiary);
}

.btn-icon {
    width: 40px;
    height: 40px;
    padding: 0;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-icon:hover {
    background: var(--bg-hover);
    border-color: var(--border-secondary);
}

.btn-icon svg {
    width: 20px;
    height: 20px;
}

.chat-body {
    flex: 1;
    display: flex;
    overflow: hidden;
}

.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.message {
    display: flex;
    flex-direction: column;
    max-width: 70%;
    animation: messageIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.own {
    align-self: flex-end;
    align-items: flex-end;
}

.message.other {
    align-self: flex-start;
    align-items: flex-start;
}

.message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13px;
}

.message-author {
    font-weight: 600;
    color: var(--accent);
}

.message-time {
    color: var(--text-tertiary);
    font-size: 12px;
}

.message-content {
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.message.own .message-content {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    border-bottom-right-radius: 4px;
}

.message.other .message-content {
    border-bottom-left-radius: 4px;
}

.message-system {
    align-self: center;
    padding: 8px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: 99px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
}

.chat-input-container {
    padding: 16px 24px;
    background: var(--bg-card);
    border-top: 1px solid var(--border-primary);
    display: flex;
    gap: 12px;
    align-items: flex-end;
}

.chat-input {
    flex: 1;
    padding: 14px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-family: var(--font-main);
    font-size: 15px;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.5;
    transition: all 0.2s;
}

.chat-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-secondary);
}

.chat-input::placeholder {
    color: var(--text-tertiary);
}

.btn-send {
    width: 48px;
    height: 48px;
    padding: 0;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.btn-send:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: scale(1.05);
}

.btn-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-send svg {
    width: 20px;
    height: 20px;
}

/* Participants Sidebar */
.participants-sidebar {
    width: 280px;
    background: var(--bg-card);
    border-left: 1px solid var(--border-primary);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.participants-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-primary);
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
}

.participants-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.participant {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-sm);
    transition: all 0.2s;
}

.participant:hover {
    background: var(--bg-hover);
    border-color: var(--border-secondary);
}

.participant-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #5E5CE6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
}

.participant-info {
    flex: 1;
    min-width: 0;
}

.participant-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.participant-status {
    font-size: 12px;
    color: var(--text-tertiary);
}

.participant.you .participant-name::after {
    content: ' (вы)';
    color: var(--accent);
    font-weight: 500;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--border-secondary);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--border-active);
}

/* Responsive */
@media (max-width: 768px) {
    .lobby-card {
        padding: 24px;
    }
    
    .participants-sidebar {
        display: none;
    }
    
    .chat-messages {
        padding: 16px;
    }
    
    .chat-input-container {
        padding: 12px 16px;
    }
    
    .message {
        max-width: 85%;
    }
}

/* Loading */
.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-secondary);
}

.spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--border-primary);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Toast */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-card);
    border: 1px solid var(--border-primary);
    border-radius: var(--radius-md);
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1000;
}

.toast.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

.toast.success {
    border-color: var(--success);
    color: var(--success);
}

.toast.error {
    border-color: var(--danger);
    color: var(--danger);
}
</style>
</head>
<body>
<div class="app">
    <!-- Lobby Screen -->
    <div class="lobby" id="lobby">
        <div class="lobby-card">
            <div class="lobby-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
            </div>
            <h1>Oris Chat</h1>
            <p class="lobby-subtitle">Создайте комнату или присоединитесь к существующей</p>

            <div class="section-label">Создать комнату</div>
            <button class="btn btn-primary" id="createRoomBtn">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Создать новую комнату
            </button>

            <div class="room-id-display" id="roomIdDisplay" style="display: none;">
                <div class="room-id-label">
                    <span>ID комнаты</span>
                    <span>
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        Скопировать
                    </span>
                </div>
                <div class="room-id-value" id="roomIdValue"></div>
            </div>

            <div class="divider"><span>или</span></div>

            <div class="section-label">Присоединиться к комнате</div>
            <div class="input-group">
                <input type="text" class="input input-mono" id="joinRoomInput" placeholder="Введите код комнаты" maxlength="8" autocomplete="off">
            </div>
            <button class="btn btn-secondary" id="joinRoomBtn">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
                Войти
            </button>

            <div class="status-msg" id="statusMsg">
                <span id="statusMsgText"></span>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat" id="chat" style="display: none;">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-room-info">
                    <div class="chat-room-id" id="chatRoomId"></div>
                    <div class="chat-room-meta">
                        <div class="chat-participants">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                            <span id="participantCount">0 участников</span>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn-icon" id="leaveRoomBtn" title="Покинуть комнату">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
            </button>
        </div>

        <div class="chat-body">
            <div class="chat-main">
                <div class="chat-messages" id="chatMessages">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>Загрузка сообщений...</span>
                    </div>
                </div>

                <div class="chat-input-container">
                    <textarea class="chat-input" id="chatInput" placeholder="Напишите сообщение..." rows="1"></textarea>
                    <button class="btn-send" id="sendMessageBtn" disabled>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="participants-sidebar">
                <div class="participants-header">Участники</div>
                <div class="participants-list" id="participantsList"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// API Client
const API = {
    baseUrl: '/api/chat',
    
    async request(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        try {
            const res = await fetch(`${this.baseUrl}${endpoint}`, { ...options, headers });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        } catch (err) {
            if (err.name === 'TypeError') throw new Error('Нет соединения с сервером');
            throw err;
        }
    },
    
    createRoom: () => API.request('/room', { method: 'POST' }),
    checkRoom: (code) => API.request(`/room/${code}`),
    joinRoom: (code, username) => API.request(`/room/${code}/join`, { 
        method: 'POST', 
        body: JSON.stringify({ username }) 
    }),
    leaveRoom: (code, username) => API.request(`/room/${code}/leave`, { 
        method: 'POST', 
        body: JSON.stringify({ username }) 
    }),
    getMessages: (code) => API.request(`/room/${code}/messages`),
    sendMessage: (code, username, text) => API.request(`/room/${code}/messages`, { 
        method: 'POST', 
        body: JSON.stringify({ username, text }) 
    })
};

// State
const state = {
    roomCode: null,
    username: null,
    messages: [],
    participants: new Set(),
    pollInterval: null
};

// DOM Elements
const lobby = document.getElementById('lobby');
const chat = document.getElementById('chat');
const createRoomBtn = document.getElementById('createRoomBtn');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const joinRoomInput = document.getElementById('joinRoomInput');
const roomIdDisplay = document.getElementById('roomIdDisplay');
const roomIdValue = document.getElementById('roomIdValue');
const statusMsg = document.getElementById('statusMsg');
const statusMsgText = document.getElementById('statusMsgText');
const chatRoomId = document.getElementById('chatRoomId');
const participantCount = document.getElementById('participantCount');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendMessageBtn = document.getElementById('sendMessageBtn');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');
const participantsList = document.getElementById('participantsList');
const toast = document.getElementById('toast');

// Utils
function showToast(message, type = 'info') {
    toast.textContent = message;
    toast.className = `toast ${type} visible`;
    setTimeout(() => {
        toast.classList.remove('visible');
    }, 3000);
}

function showStatus(message, type = 'info') {
    statusMsgText.textContent = message;
    statusMsg.className = `status-msg visible ${type}`;
    setTimeout(() => {
        statusMsg.classList.remove('visible');
    }, 5000);
}

function formatTime(timestamp) {
    const date = new Date(timestamp);
    return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function getInitials(name) {
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Create Room
createRoomBtn.addEventListener('click', async () => {
    try {
        createRoomBtn.disabled = true;
        const username = prompt('Введите ваше имя:', '')?.trim();
        
        if (!username) {
            createRoomBtn.disabled = false;
            return;
        }
        
        const result = await API.createRoom();
        state.roomCode = result.code;
        state.username = username;
        
        await API.joinRoom(state.roomCode, username);
        
        roomIdValue.textContent = state.roomCode;
        roomIdDisplay.style.display = 'block';
        showStatus('Комната создана! Нажмите на код, чтобы скопировать', 'success');
        
        roomIdDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(state.roomCode);
            showToast('Код скопирован!', 'success');
        });
        
        setTimeout(() => enterChat(), 1500);
    } catch (err) {
        showStatus(err.message, 'error');
        createRoomBtn.disabled = false;
    }
});

// Join Room
joinRoomBtn.addEventListener('click', async () => {
    try {
        const code = joinRoomInput.value.trim().toUpperCase();
        
        if (!code || code.length !== 8) {
            showStatus('Код должен состоять из 8 символов', 'error');
            return;
        }
        
        const username = prompt('Введите ваше имя:', '')?.trim();
        
        if (!username) return;
        
        joinRoomBtn.disabled = true;
        
        const room = await API.checkRoom(code);
        
        if (!room.exists) {
            showStatus('Комната не найдена', 'error');
            joinRoomBtn.disabled = false;
            return;
        }
        
        await API.joinRoom(code, username);
        
        state.roomCode = code;
        state.username = username;
        
        enterChat();
    } catch (err) {
        showStatus(err.message, 'error');
        joinRoomBtn.disabled = false;
    }
});

joinRoomInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
});

joinRoomInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        joinRoomBtn.click();
    }
});

// Enter Chat
function enterChat() {
    lobby.style.display = 'none';
    chat.style.display = 'flex';
    chatRoomId.textContent = state.roomCode;
    
    loadMessages();
    startPolling();
}

// Leave Room
leaveRoomBtn.addEventListener('click', async () => {
    if (!confirm('Покинуть комнату?')) return;
    
    try {
        await API.leaveRoom(state.roomCode, state.username);
    } catch (err) {
        console.error(err);
    }
    
    stopPolling();
    chat.style.display = 'none';
    lobby.style.display = 'flex';
    state.roomCode = null;
    state.username = null;
    state.messages = [];
    state.participants.clear();
},

// Load Messages
async function loadMessages() {
    try {
        const result = await API.getMessages(state.roomCode);
        const oldLength = state.messages.length;
        state.messages = result.messages;
        
        renderMessages();
        updateParticipants();
        
        if (result.messages.length > oldLength) {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    } catch (err) {
        console.error(err);
    }
},

// Render Messages
function renderMessages() {
    if (state.messages.length === 0) {
        chatMessages.innerHTML = `
            <div class="message-system">
                Начните общение! Напишите первое сообщение.
            </div>
        `;
        return;
    }
    
    chatMessages.innerHTML = state.messages.map(msg => {
        const isOwn = msg.username === state.username;
        const isSystem = msg.type === 'system';
        
        if (isSystem) {
            return `<div class="message-system">${escapeHtml(msg.text)}</div>`;
        }
        
        return `
            <div class="message ${isOwn ? 'own' : 'other'}">
                <div class="message-header">
                    <span class="message-author">${escapeHtml(msg.username)}</span>
                    <span class="message-time">${formatTime(msg.timestamp)}</span>
                </div>
                <div class="message-content">${escapeHtml(msg.text)}</div>
            </div>
        `;
    }).join('');
},

// Update Participants
function updateParticipants() {
    const participants = new Set(state.messages.map(m => m.username).filter(u => u));
    state.participants = participants;
    
    participantCount.textContent = `${participants.size} ${getParticipantWord(participants.size)}`;
    
    participantsList.innerHTML = Array.from(participants).map(name => `
        <div class="participant ${name === state.username ? 'you' : ''}">
            <div class="participant-avatar">${getInitials(name)}</div>
            <div class="participant-info">
                <div class="participant-name">${escapeHtml(name)}</div>
                <div class="participant-status">В чате</div>
            </div>
        </div>
    `).join('');
},

function getParticipantWord(count) {
    if (count === 1) return 'участник';
    if (count >= 2 && count <= 4) return 'участника';
    return 'участников';
},

// Send Message
async function sendMessage() {
    const text = chatInput.value.trim();
    
    if (!text) return;
    
    try {
        sendMessageBtn.disabled = true;
        await API.sendMessage(state.roomCode, state.username, text);
        chatInput.value = '';
        chatInput.style.height = 'auto';
        await loadMessages();
    } catch (err) {
        showToast(err.message, 'error');
    } finally {
        sendMessageBtn.disabled = false;
    }
},

sendMessageBtn.addEventListener('click', sendMessage))

chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

chatInput.addEventListener('input', () => {
    sendMessageBtn.disabled = !chatInput.value.trim();
    
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// Polling
function startPolling() {
    state.pollInterval = setInterval(loadMessages, 2000);
}

function stopPolling() {
    if (state.pollInterval) {
        clearInterval(state.pollInterval);
        state.pollInterval = null;
    }
}

// Cleanup on page unload
window.addEventListener('beforeunload', async () => {
    if (state.roomCode && state.username) {
        try {
            await API.leaveRoom(state.roomCode, state.username);
        } catch (err) {
            console.error(err);
        }
    }
});
</script>
</body>
</html>
