<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: #d2d2d7;
            --error: #ff3b30;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .date-info {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #ffffff;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2386868b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 40px;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .swap-btn {
            display: flex;
            justify-content: center;
            margin: -8px 0 12px;
        }

        .swap-btn button {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .swap-btn button:hover {
            background: #e8e8ed;
            transform: rotate(180deg);
        }

        .swap-btn button svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-primary);
        }

        .result-container {
            margin-top: 24px;
            padding: 24px;
            background: var(--bg-color);
            border-radius: 16px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .result-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .result-amount {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .result-rate {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
            padding: 40px 0;
        }

        .error {
            text-align: center;
            color: var(--error);
            font-size: 15px;
            padding: 20px 0;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .refresh-btn:hover {
            background: var(--accent-hover);
        }

        .refresh-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Конвертер валют</h1>
    
    <div id="loading" class="loading">Загрузка курсов валют...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="converter" style="display: none;">
        <div class="date-info" id="dateInfo"></div>

        <div class="form-group">
            <label for="amount">Сумма</label>
            <input type="number" id="amount" value="100" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="fromCurrency">Из валюты</label>
            <select id="fromCurrency"></select>
        </div>

        <div class="swap-btn">
            <button id="swapBtn" title="Поменять местами">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l4-4M17 20l-4-4"/>
                </svg>
            </button>
        </div>

        <div class="form-group">
            <label for="toCurrency">В валюту</label>
            <select id="toCurrency"></select>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-amount" id="resultAmount">0.00</div>
            <div class="result-rate" id="resultRate">1 USD = 0.00 RUB</div>
        </div>

        <button class="refresh-btn" id="refreshBtn">Обновить курсы</button>
    </div>
</div>

<script>
    const API_BASE = '/api';
    let ratesData = {};
    let ratesDate = '';

    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    const swapBtn = document.getElementById('swapBtn');
    const resultContainer = document.getElementById('resultContainer');
    const resultAmount = document.getElementById('resultAmount');
    const resultRate = document.getElementById('resultRate');
    const loadingDiv = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const converterDiv = document.getElementById('converter');
    const dateInfo = document.getElementById('dateInfo');
    const refreshBtn = document.getElementById('refreshBtn');

    async function fetchRates() {
        try {
            const response = await fetch(`${API_BASE}/rates`);
            if (!response.ok) throw new Error('Ошибка загрузки данных');
            
            const data = await response.json();
            ratesData = data.rates;
            ratesDate = data.date || '';
            
            populateSelects();
            updateDateInfo();
            loadingDiv.style.display = 'none';
            converterDiv.style.display = 'block';
            calculate();
        } catch (err) {
            loadingDiv.style.display = 'none';
            errorDiv.textContent = 'Не удалось загрузить курсы валют. Попробуйте позже.';
            errorDiv.style.display = 'block';
        }
    }

    function populateSelects() {
        const currencies = Object.values(ratesData).sort((a, b) => {
            if (a.charCode === 'RUB') return -1;
            if (b.charCode === 'RUB') return 1;
            return a.name.localeCompare(b.name, 'ru');
        });

        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        currencies.forEach(currency => {
            const option1 = new Option(`${currency.charCode} — ${currency.name}`, currency.charCode);
            const option2 = new Option(`${currency.charCode} — ${currency.name}`, currency.charCode);
            fromSelect.add(option1);
            toSelect.add(option2);
        });

        fromSelect.value = 'USD';
        toSelect.value = 'RUB';
    }

    function updateDateInfo() {
        if (ratesDate) {
            dateInfo.textContent = `Курсы на ${ratesDate}`;
        }
    }

    function calculate() {
        const amount = parseFloat(amountInput.value) || 0;
        const from = fromSelect.value;
        const to = toSelect.value;

        if (!ratesData[from] || !ratesData[to]) return;

        const fromRate = ratesData[from].rate;
        const toRate = ratesData[to].rate;
        
        const result = amount * (toRate / fromRate);
        const singleUnitRate = toRate / fromRate;

        resultAmount.textContent = result.toLocaleString('ru-RU', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        }) + ` ${to}`;
        
        resultRate.textContent = `1 ${from} = ${singleUnitRate.toLocaleString('ru-RU', { 
            minimumFractionDigits: 4, 
            maximumFractionDigits: 4 
        })} ${to}`;

        resultContainer.classList.remove('visible');
        void resultContainer.offsetWidth;
        resultContainer.classList.add('visible');
    }

    function swapCurrencies() {
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        calculate();
    }

    async function refreshRates() {
        refreshBtn.disabled = true;
        refreshBtn.textContent = 'Обновление...';
        
        try {
            await fetchRates();
            refreshBtn.textContent = 'Обновить курсы';
        } catch (err) {
            refreshBtn.textContent = 'Ошибка. Повторить';
        } finally {
            setTimeout(() => {
                refreshBtn.disabled = false;
            }, 1000);
        }
    }

    amountInput.addEventListener('input', calculate);
    fromSelect.addEventListener('change', calculate);
    toSelect.addEventListener('change', calculate);
    swapBtn.addEventListener('click', swapCurrencies);
    refreshBtn.addEventListener('click', refreshRates);

    fetchRates();
</script>

</body>
</html>
