<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Redirect</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: #d2d2d7;
            --success: #34c759;
            --warning: #ff9f0a;
            --error: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 680px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 40px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 17px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        input[type="url"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .status-code {
            font-family: "SF Mono", Monaco, monospace;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            min-width: 70px;
            text-align: center;
        }

        .status-2xx { background: rgba(52, 199, 89, 0.15); color: #248a3d; }
        .status-3xx { background: rgba(255, 159, 10, 0.15); color: #9e6000; }
        .status-4xx, .status-5xx { background: rgba(255, 59, 48, 0.15); color: #c41c14; }
        .status-err { background: rgba(142, 142, 147, 0.15); color: #555555; }

        .step-info {
            flex: 1;
            min-width: 0;
        }

        .step-url {
            font-size: 15px;
            font-weight: 500;
            word-break: break-all;
            margin-bottom: 4px;
        }

        .step-meta {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: "SF Mono", Monaco, monospace;
        }

        .error-message {
            text-align: center;
            color: var(--error);
            font-size: 15px;
            margin-top: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Проверка редиректов</h1>
        <p class="subtitle">Введите URL, чтобы отследить цепочку перенаправлений и время ответа.</p>
        
        <form class="input-group" id="redirectForm">
            <input type="url" id="urlInput" placeholder="https://example.com" required>
            <button type="submit" id="submitBtn">Проверить</button>
        </form>

        <div id="results" class="results"></div>
        <div id="error" class="error-message"></div>
    </div>

    <script>
        const form = document.getElementById('redirectForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultsContainer = document.getElementById('results');
        const errorContainer = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const targetUrl = urlInput.value.trim();
            
            if (!targetUrl) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Проверка...';
            resultsContainer.innerHTML = '';
            errorContainer.textContent = '';

            try {
                const response = await fetch('/api/check-redirect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: targetUrl })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка при проверке URL');
                }

                data.chain.forEach((step, index) => {
                    const card = document.createElement('div');
                    card.className = 'step-card';
                    card.style.animationDelay = `${index * 0.1}s`;

                    let statusClass = 'status-err';
                    if (step.status >= 200 && step.status < 300) statusClass = 'status-2xx';
                    else if (step.status >= 300 && step.status < 400) statusClass = 'status-3xx';
                    else if (step.status >= 400) statusClass = 'status-4xx';

                    card.innerHTML = `
                        <div class="status-code ${statusClass}">${step.status || 'ERR'}</div>
                        <div class="step-info">
                            <div class="step-url">${escapeHtml(step.url)}</div>
                            <div class="step-meta">${step.time} ms ${step.location ? '-> ' + escapeHtml(step.location) : ''}</div>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });
            } catch (err) {
                errorContainer.textContent = err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Проверить';
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
