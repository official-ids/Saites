<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Страница проекта Oris.">
    <meta name="theme-color" content="#ffffff">
    <script>try{var t=localStorage.getItem('oris-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>

    <title>Проект · Oris</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --bg-elevated: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --text-tertiary: #AEAEB2;
            --accent: #0071E3;
            --accent-hover: #0077ED;
            --border-light: rgba(0, 0, 0, 0.06);
            --border: rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        :root[data-theme="dark"] {
            --bg-body: #000000;
            --bg-card: #1C1C1E;
            --bg-elevated: #2C2C2E;
            --text-primary: #F5F5F7;
            --text-secondary: #86868B;
            --text-tertiary: #636366;
            --accent: #0A84FF;
            --accent-hover: #409CFF;
            --border-light: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --bg-body: #000000;
                --bg-card: #1C1C1E;
                --bg-elevated: #2C2C2E;
                --text-primary: #F5F5F7;
                --text-secondary: #86868B;
                --text-tertiary: #636366;
                --accent: #0A84FF;
                --accent-hover: #409CFF;
                --border-light: rgba(255, 255, 255, 0.08);
                --border: rgba(255, 255, 255, 0.12);
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 880px; margin: 0 auto; padding: 0 24px; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .brand svg { width: 26px; height: 26px; color: var(--accent); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .back-link:hover { color: var(--accent); border-color: var(--accent); }
        .back-link svg { width: 16px; height: 16px; }

        main { padding: 16px 0 80px; }

        .preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            background: var(--bg-card);
            margin-bottom: 28px;
        }

        .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .preview-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--ph-color, #0071E3), color-mix(in srgb, var(--ph-color, #0071E3) 55%, #000));
            text-transform: uppercase;
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--cat-color, var(--accent));
            background: var(--cat-bg, rgba(0, 113, 227, 0.1));
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 16px;
        }

        .category-badge svg { width: 14px; height: 14px; }

        h1.title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            white-space: pre-line;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 32px;
        }

        .open-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.98rem;
            padding: 12px 22px;
            border-radius: 999px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .open-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .open-btn svg { width: 18px; height: 18px; }

        .domain-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .state h2 { color: var(--text-primary); font-size: 1.4rem; margin-bottom: 10px; }

        .spinner {
            width: 34px; height: 34px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            h1.title { font-size: 1.8rem; }
            .description { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a class="brand" href="/">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Oris
            </a>
            <a class="back-link" href="/">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                К проектам
            </a>
        </div>

        <main id="content">
            <div class="state">
                <div class="spinner"></div>
                <p>Загрузка проекта…</p>
            </div>
        </main>
    </div>

<script>
(function () {
    'use strict';

    const CATEGORY_META = {
        tools: { label: 'Инструменты', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z', color: '#FF9F0A' },
        dev: { label: 'Для разработчиков', icon: 'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4', color: '#0071E3' },
        design: { label: 'Дизайн', icon: 'M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01', color: '#AF52DE' },
        education: { label: 'Образование', icon: 'M12 14l9-5-9-5-9 5 9 5z M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z', color: '#34C759' },
        games: { label: 'Игры', icon: 'M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z M21 12a9 9 0 11-18 0 9 9 0 0118 0z', color: '#FF3B30' },
        media: { label: 'Медиа', icon: 'M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z', color: '#FF9F0A' },
        social: { label: 'Соцсети', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z', color: '#5E5CE6' },
        other: { label: 'Другое', icon: 'M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z', color: '#8E8E93' }
    };

    const OPEN_ICON = 'M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14';

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function sanitizeUrl(url) {
        try {
            const parsed = new URL(url, window.location.origin);
            if (!['http:', 'https:'].includes(parsed.protocol)) return '#';
            return parsed.href;
        } catch { return '#'; }
    }

    function getDomain(url) {
        try { return new URL(url, window.location.origin).hostname.replace(/^www\./, ''); } catch { return ''; }
    }

    function projectSlug(url) {
        try {
            const parsed = new URL(url, window.location.origin);
            const seg = parsed.pathname.split('/').filter(Boolean).pop();
            if (seg) return encodeURIComponent(seg.toLowerCase());
            return encodeURIComponent(parsed.hostname.replace(/^www\./, ''));
        } catch { return ''; }
    }

    function currentSlug() {
        const parts = window.location.pathname.split('/').filter(Boolean);
        const last = parts[parts.length - 1] || '';
        return decodeURIComponent(last).toLowerCase();
    }

    function render(site) {
        const meta = CATEGORY_META[site.category] || CATEGORY_META.other;
        const title = escapeHtml(site.title || 'Без названия');
        const desc = escapeHtml(site.desc || 'Описание отсутствует.');
        const url = sanitizeUrl(site.url);
        const domain = getDomain(site.url);
        const slug = projectSlug(site.url);
        const letter = (site.title || '?').trim().charAt(0) || '?';

        document.title = (site.title || 'Проект') + ' · Oris';

        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="preview">
                <img id="shot" src="/p/shots/${slug}.png" alt="Превью проекта ${title}">
            </div>
            <div class="category-badge" style="--cat-color:${meta.color};--cat-bg:${meta.color}1a">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${meta.icon}"/></svg>
                ${escapeHtml(meta.label)}
            </div>
            <h1 class="title">${title}</h1>
            <p class="description">${desc}</p>
            <div class="meta-row">
                <a class="open-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                    Открыть проект
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${OPEN_ICON}"/></svg>
                </a>
                ${domain ? `<span class="domain-chip">${escapeHtml(domain)}</span>` : ''}
            </div>
        `;

        const img = document.getElementById('shot');
        img.addEventListener('error', () => {
            const wrap = img.parentElement;
            wrap.innerHTML = `<div class="preview-fallback" style="--ph-color:${meta.color}">${escapeHtml(letter)}</div>`;
        });
    }

    function renderNotFound() {
        document.getElementById('content').innerHTML = `
            <div class="state">
                <h2>Проект не найден</h2>
                <p>Такого проекта нет в каталоге или ссылка устарела.</p>
                <p style="margin-top:18px;"><a class="back-link" href="/">Вернуться к проектам</a></p>
            </div>
        `;
    }

    function renderError() {
        document.getElementById('content').innerHTML = `
            <div class="state">
                <h2>Не удалось загрузить</h2>
                <p>Проверьте соединение и попробуйте обновить страницу.</p>
            </div>
        `;
    }

    async function init() {
        const slug = currentSlug();
        if (!slug || slug === 'p') { renderNotFound(); return; }
        try {
            const res = await fetch('/api/sites');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const sites = await res.json();
            const list = Array.isArray(sites) ? sites : (sites.sites || []);
            const found = list.find((s) => projectSlug(s.url) === encodeURIComponent(slug));
            if (found) render(found);
            else renderNotFound();
        } catch (err) {
            console.error('[project] load failed:', err);
            renderError();
        }
    }

    init();
})();
</script>
<script src="/theme.js" defer></script>
</body>
</html>
