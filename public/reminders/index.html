<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминания — Oris</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #e8e8ed;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --border: #d2d2d7;
            --border-light: #e5e5ea;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --success: #34c759;
            --warning: #ff9f0a;
            --danger: #ff3b30;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 15px;
            font-weight: 400;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .back-btn:hover { background: rgba(0, 113, 227, 0.08); }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px;
        }

        .card {
            background: var(--bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-label .required { color: var(--danger); }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--bg);
            color: var(--text-primary);
            border-color: var(--border);
        }
        .btn-secondary:hover:not(:disabled) { background: var(--bg-secondary); }

        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #d63228; }

        .btn-ghost {
            background: transparent;
            color: var(--accent);
            padding: 6px 12px;
        }
        .btn-ghost:hover:not(:disabled) { background: rgba(0, 113, 227, 0.08); }

        .btn-sm { padding: 6px 12px; font-size: 13px; }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reminder-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reminder-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            transition: all 0.2s;
            gap: 16px;
        }

        .reminder-item:hover { border-color: var(--border); }

        .reminder-item.past {
            opacity: 0.6;
            border-left: 3px solid var(--text-tertiary);
        }

        .reminder-item.soon {
            border-left: 3px solid var(--warning);
        }

        .reminder-content { flex: 1; min-width: 0; }

        .reminder-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .reminder-body {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            word-break: break-word;
        }

        .reminder-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-tertiary);
            flex-wrap: wrap;
        }

        .reminder-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .reminder-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-tertiary);
        }

        .empty-state-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .empty-state-desc { font-size: 13px; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            color: var(--text-tertiary);
            font-size: 14px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast-container {
            position: fixed;
            top: 80px;
            right: 32px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 14px 20px;
            background: var(--bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.warning { border-left: 3px solid var(--warning); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .subscribe-banner {
            background: linear-gradient(135deg, #0071e3 0%, #00c7ff 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .subscribe-banner-text h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subscribe-banner-text p {
            font-size: 14px;
            opacity: 0.9;
        }

        .subscribe-banner .btn {
            background: #fff;
            color: var(--accent);
            flex-shrink: 0;
        }

        .subscribe-banner .btn:hover { background: #f0f0f0; }

        .hidden { display: none !important; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .status-badge.active {
            background: rgba(52, 199, 89, 0.12);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(255, 159, 10, 0.12);
            color: var(--warning);
        }

        .status-badge.sent {
            background: rgba(142, 142, 147, 0.12);
            color: var(--text-tertiary);
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 24px;
        }

        .tab {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab:hover { color: var(--text-primary); }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 10px;
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="/" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Назад
            </a>
            <div>
                <h1 class="header-title">Напоминания</h1>
                <div class="header-subtitle">Push-уведомления по расписанию</div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary btn-sm" onclick="checkReminders()">Проверить сейчас</button>
        </div>
    </header>

    <div class="container">

        <!-- Banner если не подписан -->
        <div id="subscribe-banner" class="subscribe-banner hidden">
            <div class="subscribe-banner-text">
                <h3>Включите уведомления</h3>
                <p>Чтобы получать напоминания, нужно разрешить push-уведомления в браузере</p>
            </div>
            <button class="btn" onclick="subscribePush()">Включить</button>
        </div>

        <!-- Форма создания -->
        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">Новое напоминание</div>
                    <div class="card-subtitle">Мы отправим уведомление в указанное время</div>
                </div>
            </div>

            <form id="reminder-form" onsubmit="createReminder(event)">
                <div class="form-group">
                    <label class="form-label">Заголовок <span class="required">*</span></label>
                    <input type="text" class="form-input" id="r-title" maxlength="100" required placeholder="Например: Встреча с клиентом">
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-textarea" id="r-body" maxlength="300" placeholder="Детали напоминания (необязательно)"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Дата <span class="required">*</span></label>
                        <input type="date" class="form-input" id="r-date" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Время <span class="required">*</span></label>
                        <input type="time" class="form-input" id="r-time" required>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="create-btn">Создать напоминание</button>
                    <button type="button" class="btn btn-secondary" onclick="setQuickTime(15)">+15 мин</button>
                    <button type="button" class="btn btn-secondary" onclick="setQuickTime(60)">+1 час</button>
                    <button type="button" class="btn btn-secondary" onclick="setQuickTime(1440)">+1 день</button>
                </div>
            </form>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="active" onclick="switchTab('active')">
                Активные <span class="count-badge" id="count-active">0</span>
            </button>
            <button class="tab" data-tab="past" onclick="switchTab('past')">
                Прошедшие <span class="count-badge" id="count-past">0</span>
            </button>
        </div>

        <!-- Active reminders -->
        <div class="tab-content active" id="tab-active">
            <div class="card" style="padding: 0; border: none; box-shadow: none; background: transparent;">
                <div class="reminder-list" id="active-list">
                    <div class="loading"><div class="spinner"></div>Загрузка...</div>
                </div>
            </div>
        </div>

        <!-- Past reminders -->
        <div class="tab-content" id="tab-past">
            <div class="card" style="padding: 0; border: none; box-shadow: none; background: transparent;">
                <div class="reminder-list" id="past-list">
                    <div class="loading"><div class="spinner"></div>Загрузка...</div>
                </div>
            </div>
        </div>

    </div>

    <div class="toast-container" id="toast-container"></div>

<script>
    const API_BASE = '/api/notifications';
    const STORAGE_KEY = 'oris_reminders_state';
    const SYNC_CHANNEL = 'oris_reminders_sync';
    
    let userEndpoint = null;
    let reminders = [];
    let checkInterval = null;
    let isChecking = false;
    let lastCheckTime = 0;
    let nextReminderTime = null;
    
    const CHECK_DEBOUNCE = 10000; // 10 секунд минимум между проверками
    const MIN_CHECK_INTERVAL = 30000; // 30 секунд минимум
    const MAX_CHECK_INTERVAL = 300000; // 5 минут максимум
    
    // Синхронизация между вкладками
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(SYNC_CHANNEL) : null;

    // ============================================
    // СОХРАНЕНИЕ СОСТОЯНИЯ
    // ============================================
    
    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                lastCheckTime,
                endpoint: userEndpoint,
                timestamp: Date.now()
            }));
        } catch (e) {}
    }
    
    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
        } catch (e) {
            return null;
        }
    }

    // ============================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================
    
    document.addEventListener('DOMContentLoaded', async () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('r-date').min = today;

        const now = new Date();
        now.setMinutes(now.getMinutes() + 30);
        document.getElementById('r-time').value = now.toTimeString().slice(0, 5);

        setupRealTimeValidation();
        
        // Загружаем предыдущее состояние
        const savedState = loadState();
        if (savedState && savedState.lastCheckTime) {
            lastCheckTime = savedState.lastCheckTime;
        }

        await initPush();
        await loadReminders();
        
        startSmartCheck();
        
        // Проверка при возврате на вкладку
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // Проверяем только если прошло больше 15 секунд
                if (Date.now() - lastCheckTime > 15000) {
                    checkRemindersSilent();
                }
            }
        });
        
        // Синхронизация между вкладками
        if (bc) {
            bc.onmessage = (event) => {
                if (event.data.type === 'reminders_updated') {
                    loadReminders();
                } else if (event.data.type === 'reminder_sent') {
                    // Другая вкладка уже отправила — просто обновляем список
                    loadReminders();
                }
            };
        }
        
        // Очистка при закрытии
        window.addEventListener('beforeunload', () => {
            saveState();
            stopSmartCheck();
            if (bc) bc.close();
        });
    });

    // ============================================
    // PUSH NOTIFICATIONS
    // ============================================

    async function initPush() {
        try {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                showBanner('Ваш браузер не поддерживает push-уведомления');
                return;
            }

            const reg = await navigator.serviceWorker.getRegistration();
            if (!reg) {
                showBanner('Service Worker не зарегистрирован');
                return;
            }

            const sub = await reg.pushManager.getSubscription();
            if (!sub) {
                showBanner();
                return;
            }

            userEndpoint = sub.endpoint;
            document.getElementById('subscribe-banner').classList.add('hidden');
            
            if (Notification.permission === 'denied') {
                showBanner('Уведомления заблокированы в настройках браузера');
            }
        } catch (err) {
            console.error('Push init error:', err);
            showBanner('Ошибка инициализации: ' + err.message);
        }
    }

    function showBanner(message = null) {
        const banner = document.getElementById('subscribe-banner');
        banner.classList.remove('hidden');
        
        if (message) {
            const textEl = banner.querySelector('.subscribe-banner-text p');
            if (textEl) textEl.textContent = message;
        }
    }

    async function subscribePush() {
        try {
            const perm = await Notification.requestPermission();
            if (perm !== 'granted') {
                showToast('Разрешение отклонено', 'error');
                return;
            }

            const keyRes = await fetch(`${API_BASE}/vapid-public-key`);
            if (!keyRes.ok) throw new Error('Не удалось получить VAPID ключ');
            
            const { publicKey } = await keyRes.json();
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(publicKey)
            });

            const subRes = await fetch(`${API_BASE}/subscribe`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    subscription: sub,
                    channels: ['alerts']
                })
            });

            if (!subRes.ok) {
                const data = await subRes.json();
                throw new Error(data.error || 'Ошибка сохранения');
            }

            userEndpoint = sub.endpoint;
            document.getElementById('subscribe-banner').classList.add('hidden');
            showToast('Уведомления включены', 'success');
            await loadReminders();
        } catch (err) {
            showToast('Ошибка: ' + err.message, 'error');
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    // ============================================
    // СОЗДАНИЕ НАПОМИНАНИЙ
    // ============================================

    async function createReminder(event) {
        event.preventDefault();

        if (!userEndpoint) {
            showToast('Сначала включите уведомления', 'error');
            return;
        }

        const title = document.getElementById('r-title').value.trim();
        const body = document.getElementById('r-body').value.trim();
        const date = document.getElementById('r-date').value;
        const time = document.getElementById('r-time').value;

        if (!title || !date || !time) {
            showToast('Заполните обязательные поля', 'error');
            return;
        }

        const triggerAt = new Date(`${date}T${time}:00`).toISOString();
        const triggerTime = new Date(triggerAt).getTime();

        if (triggerTime <= Date.now()) {
            showToast('Время должно быть в будущем', 'error');
            return;
        }

        const btn = document.getElementById('create-btn');
        btn.disabled = true;
        btn.textContent = 'Создание...';

        try {
            const res = await fetch(`${API_BASE}/reminders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    endpoint: userEndpoint,
                    title,
                    body: body || title,
                    triggerAt
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка создания');

            showToast('Напоминание создано', 'success');
            document.getElementById('r-title').value = '';
            document.getElementById('r-body').value = '';

            await loadReminders();
            
            // Уведомляем другие вкладки
            if (bc) bc.postMessage({ type: 'reminders_updated' });
            
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Создать напоминание';
        }
    }

    // ============================================
    // ЗАГРУЗКА И РЕНДЕРИНГ
    // ============================================

    async function loadReminders() {
        if (!userEndpoint) {
            document.getElementById('active-list').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-title">Включите уведомления</div>
                    <div class="empty-state-desc">Напоминания будут привязаны к вашему браузеру</div>
                </div>
            `;
            document.getElementById('past-list').innerHTML = '';
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/reminders?endpoint=${encodeURIComponent(userEndpoint)}`);
            const data = await res.json();
            reminders = data.reminders || [];
            renderReminders();
            updateNextReminderTime();
        } catch (err) {
            console.error('Load reminders error:', err);
        }
    }

    function updateNextReminderTime() {
        const now = Date.now();
        const active = reminders
            .filter(r => new Date(r.triggerAt).getTime() > now)
            .sort((a, b) => new Date(a.triggerAt) - new Date(b.triggerAt));
        
        if (active.length > 0) {
            nextReminderTime = new Date(active[0].triggerAt).getTime();
        } else {
            nextReminderTime = null;
        }
    }

    function renderReminders() {
        const now = Date.now();
        const active = reminders.filter(r => new Date(r.triggerAt).getTime() > now);
        const past = reminders.filter(r => new Date(r.triggerAt).getTime() <= now);

        active.sort((a, b) => new Date(a.triggerAt) - new Date(b.triggerAt));
        past.sort((a, b) => new Date(b.triggerAt) - new Date(a.triggerAt));

        document.getElementById('count-active').textContent = active.length;
        document.getElementById('count-past').textContent = past.length;

        const activeList = document.getElementById('active-list');
        if (active.length === 0) {
            activeList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-title">Нет активных напоминаний</div>
                    <div class="empty-state-desc">Создайте первое напоминание выше</div>
                </div>
            `;
        } else {
            activeList.innerHTML = renderGroupedByDate(active, false);
        }

        const pastList = document.getElementById('past-list');
        if (past.length === 0) {
            pastList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-title">История пуста</div>
                    <div class="empty-state-desc">Здесь будут отображаться сработавшие напоминания</div>
                </div>
            `;
        } else {
            pastList.innerHTML = renderGroupedByDate(past, true);
        }
    }

    function renderGroupedByDate(items, isPast) {
        const groups = {};
        
        items.forEach(r => {
            const date = new Date(r.triggerAt);
            const dateKey = date.toDateString();
            if (!groups[dateKey]) groups[dateKey] = [];
            groups[dateKey].push(r);
        });

        let html = '';
        
        Object.entries(groups).forEach(([dateKey, groupReminders]) => {
            const date = new Date(dateKey);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            let dateLabel;
            if (date.toDateString() === today.toDateString()) {
                dateLabel = 'Сегодня';
            } else if (date.toDateString() === tomorrow.toDateString()) {
                dateLabel = 'Завтра';
            } else {
                dateLabel = date.toLocaleDateString('ru-RU', { 
                    day: 'numeric', 
                    month: 'long',
                    weekday: 'short'
                });
            }

            html += `
                <div class="date-group">
                    <div class="date-group-header">${dateLabel}</div>
                    ${groupReminders.map(r => renderReminderItem(r, isPast)).join('')}
                </div>
            `;
        });

        return html;
    }

    function renderReminderItem(r, isPast) {
        const triggerDate = new Date(r.triggerAt);
        const now = Date.now();
        const triggerTime = triggerDate.getTime();
        const diff = triggerTime - now;

        let statusClass = 'active';
        let statusText = 'Активно';

        if (isPast) {
            statusClass = 'sent';
            statusText = r.status === 'sent' ? 'Отправлено' : 'Просрочено';
        } else if (r.status === 'sending') {
            statusClass = 'pending';
            statusText = 'Отправка...';
        } else if (diff < 5 * 60 * 1000) {
            statusClass = 'pending';
            statusText = 'Менее 5 мин';
        } else if (diff < 30 * 60 * 1000) {
            statusClass = 'pending';
            statusText = 'Скоро';
        }

        const timeLeft = !isPast ? getTimeLeft(diff) : '';

        return `
            <div class="reminder-item ${isPast ? 'past' : (statusClass === 'pending' ? 'soon' : '')}" data-id="${r.id}">
                <div class="reminder-content">
                    <div class="reminder-title">${escapeHtml(r.title)}</div>
                    ${r.body && r.body !== r.title ? `<div class="reminder-body">${escapeHtml(r.body)}</div>` : ''}
                    <div class="reminder-meta">
                        <span>${formatDateTime(triggerDate)}</span>
                        ${timeLeft ? `<span class="time-left">${timeLeft}</span>` : ''}
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                </div>
                <div class="reminder-actions">
                    ${!isPast ? `<button class="btn btn-ghost btn-sm" onclick="deleteReminder('${r.id}')">Удалить</button>` : ''}
                </div>
            </div>
        `;
    }

    function getTimeLeft(diff) {
        if (diff <= 0) return 'Сейчас';
        if (diff <= 60000) return 'Менее минуты';
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);

        if (days > 0) return `через ${days} дн. ${hours % 24} ч.`;
        if (hours > 0) return `через ${hours} ч. ${minutes % 60} мин.`;
        return `через ${minutes} мин.`;
    }

    function formatDateTime(date) {
        return date.toLocaleString('ru-RU', {
            day: 'numeric',
            month: 'long',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // ============================================
    // УДАЛЕНИЕ
    // ============================================

    async function deleteReminder(id) {
        if (!confirm('Удалить напоминание?')) return;

        try {
            const res = await fetch(`${API_BASE}/reminders/${id}?endpoint=${encodeURIComponent(userEndpoint)}`, {
                method: 'DELETE'
            });

            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.error || 'Ошибка удаления');
            }

            showToast('Напоминание удалено', 'success');
            await loadReminders();
            
            if (bc) bc.postMessage({ type: 'reminders_updated' });
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    // ============================================
    // УМНАЯ ПРОВЕРКА НАПОМИНАНИЙ
    // ============================================

    function getSmartInterval() {
        // Если нет активных напоминаний — проверяем раз в 5 минут
        if (!nextReminderTime) return MAX_CHECK_INTERVAL;
        
        const now = Date.now();
        const timeUntilNext = nextReminderTime - now;
        
        // Если напоминание через 2 минуты или меньше — проверяем каждые 15 секунд
        if (timeUntilNext <= 2 * 60 * 1000) return 15000;
        
        // Если через 5 минут — каждые 30 секунд
        if (timeUntilNext <= 5 * 60 * 1000) return 30000;
        
        // Если через 15 минут — каждую минуту
        if (timeUntilNext <= 15 * 60 * 1000) return 60000;
        
        // Иначе — раз в 2 минуты
        return 120000;
    }

    function startSmartCheck() {
        stopSmartCheck();
        
        const interval = getSmartInterval();
        
        checkInterval = setInterval(async () => {
            await checkRemindersSilent();
            
            // Пересчитываем интервал после каждой проверки
            const newInterval = getSmartInterval();
            if (newInterval !== interval) {
                startSmartCheck(); // перезапуск с новым интервалом
            }
        }, interval);
    }

    function stopSmartCheck() {
        if (checkInterval) {
            clearInterval(checkInterval);
            checkInterval = null;
        }
    }

    async function checkRemindersSilent() {
        // Защита от параллельных вызовов
        if (isChecking) return;
        if (!userEndpoint) return;
        
        // Debounce
        const now = Date.now();
        if (now - lastCheckTime < CHECK_DEBOUNCE) return;
        
        // Проверяем, есть ли вообще смысл проверять
        // Если ближайшее напоминание через 30+ секунд — не спешим
        if (nextReminderTime && nextReminderTime - now > 30000) {
            // Но всё равно проверяем на всякий случай (вдруг время изменилось)
            // Просто реже
            if (now - lastCheckTime < MIN_CHECK_INTERVAL) return;
        }
        
        isChecking = true;
        lastCheckTime = now;
        saveState();

        try {
            const res = await fetch(`${API_BASE}/reminders/check`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ endpoint: userEndpoint })
            });

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const data = await res.json();

            if (data.sent && data.sent.length > 0) {
                // Уведомляем другие вкладки что мы уже отправили
                if (bc) bc.postMessage({ type: 'reminder_sent', count: data.sent.length });
                
                if (!document.hidden) {
                    playNotificationSound();
                    showToast(`Отправлено: ${data.sent.length}`, 'success');
                    
                    // Дублируем через Notification API если push не дойдёт
                    data.sent.forEach(r => {
                        showLocalNotification(r.title, r.body || r.title);
                    });
                }
                
                await loadReminders();
            }
        } catch (err) {
            console.error('Check reminders error:', err);
        } finally {
            isChecking = false;
        }
    }

    async function checkReminders() {
        const btn = event?.target;
        const originalText = btn ? btn.textContent : '';
        
        const now = Date.now();
        if (now - lastCheckTime < CHECK_DEBOUNCE) {
            showToast('Подождите перед следующей проверкой', 'warning');
            return;
        }
        
        if (btn) {
            btn.disabled = true;
            btn.textContent = 'Проверка...';
        }

        isChecking = true;
        lastCheckTime = now;

        try {
            const res = await fetch(`${API_BASE}/reminders/check`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ endpoint: userEndpoint })
            });

            const data = await res.json();

            if (data.sent && data.sent.length > 0) {
                playNotificationSound();
                showToast(`Отправлено: ${data.sent.length}`, 'success');
                
                data.sent.forEach(r => {
                    showLocalNotification(r.title, r.body || r.title);
                });
                
                if (bc) bc.postMessage({ type: 'reminder_sent', count: data.sent.length });
            } else {
                showToast('Нет сработавших напоминаний', 'info');
            }

            await loadReminders();
        } catch (err) {
            showToast('Ошибка проверки', 'error');
        } finally {
            isChecking = false;
            if (btn) {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    }

    // ============================================
    // ЛОКАЛЬНЫЕ УВЕДОМЛЕНИЯ (FALLBACK)
    // ============================================

    function showLocalNotification(title, body) {
        // Проверяем разрешение
        if (Notification.permission !== 'granted') return;
        
        try {
            const notification = new Notification(title, {
                body: body,
                icon: '/favicon.ico',
                badge: '/favicon.ico',
                tag: `local-${Date.now()}`,
                requireInteraction: false,
                silent: false
            });
            
            notification.onclick = () => {
                window.focus();
                notification.close();
            };
            
            // Автозакрытие через 8 секунд
            setTimeout(() => {
                try { notification.close(); } catch (e) {}
            }, 8000);
        } catch (err) {
            console.warn('Local notification failed:', err);
        }
    }

    function playNotificationSound() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Два коротких сигнала
            oscillator.frequency.value = 880;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime + 0.2);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.35);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.35);
        } catch (e) {}
    }

    // ============================================
    // УТИЛИТЫ
    // ============================================

    function setQuickTime(minutes) {
        const now = new Date();
        now.setMinutes(now.getMinutes() + minutes);

        document.getElementById('r-date').value = now.toISOString().split('T')[0];
        document.getElementById('r-time').value = now.toTimeString().slice(0, 5);
        document.getElementById('r-title').focus();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        document.getElementById(`tab-${tab}`).classList.add('active');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(20px)';
            toast.style.transition = 'all 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function setupRealTimeValidation() {
        const dateInput = document.getElementById('r-date');
        const timeInput = document.getElementById('r-time');

        function validateDateTime() {
            const date = dateInput.value;
            const time = timeInput.value;
            
            if (!date || !time) return;

            const triggerAt = new Date(`${date}T${time}:00`);
            const now = new Date();
            
            if (triggerAt <= now) {
                timeInput.setCustomValidity('Время должно быть в будущем');
            } else {
                timeInput.setCustomValidity('');
            }
        }

        dateInput.addEventListener('change', validateDateTime);
        timeInput.addEventListener('change', validateDateTime);
    }
</script>
