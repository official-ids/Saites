    <style>
        :root {
            /* Базовые цвета (будут переопределяться скриптом) */
            --primary-color: #2c3e50;
            --secondary-color: #ecf0f1;
            --accent-color: #d35400;
            --text-main: #2c3e50;
            --text-light: #ffffff;
            --bg-gradient-start: #fdfbfb;
            --bg-gradient-end: #ebedee;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
            --transition-speed: 0.4s;
            
            /* Темы праздников */
            --theme-newyear-bg: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --theme-newyear-accent: #ffd700;
            --theme-march-bg: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --theme-march-accent: #ff6b6b;
            --theme-victory-bg: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            --theme-victory-accent: #cc0000;
            --theme-birthday-bg: radial-gradient(circle at center, #fff5f5 0%, #ffebee 100%);
            --theme-birthday-accent: #ff4081;
            --theme-neutral-bg: linear-gradient(to bottom right, #fafafa, #f0f0f0);
            --theme-neutral-accent: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient-start);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background var(--transition-speed) ease;
        }

        /* Анимированный фон */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
            transition: all 1s ease-in-out;
        }

        canvas#bgCanvas {
            width: 100%;
            height: 100%;
        }

        /* Контейнер приложения */
        .app-container {
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 50px;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Заголовок */
        header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-weight: 300;
        }

        /* Левая панель: Управление */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="text"], textarea {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #fff;
            outline: none;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            background: #1a252f;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-secondary:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-download {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-download:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        /* Правая панель: Превью */
        .preview-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            border: 1px dashed #ccc;
            position: relative;
            overflow: hidden;
        }

        .preview-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #cardCanvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 4px;
            background: white;
            transition: transform 0.3s ease;
        }

        #cardCanvas:hover {
            transform: scale(1.01);
        }

        /* Модальное окно успеха */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .icon-success {
            width: 60px;
            height: 60px;
            background: #2ecc71;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 30px;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
                padding: 20px;
                margin-top: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }

        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #bbb; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999; 
        }

        /* Индикатор загрузки звука */
        .sound-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 999;
        }
        .sound-indicator.visible {
            opacity: 1;
        }
    </style>
</head>

        /**
         * АУДИО СИСТЕМА (Web Audio API)
         * Создает синтезированные звуки вместо файлов
         */
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    showSoundIndicator();
                });
            }
        }

        function showSoundIndicator() {
            soundIndicator.classList.add('visible');
            setTimeout(() => {
                soundIndicator.classList.remove('visible');
            }, 2000);
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.1) {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playSuccessChime() {
            // Арпеджио До мажор
            playTone(523.25, 0.3, 'triangle', 0.1); // C5
            setTimeout(() => playTone(659.25, 0.3, 'triangle', 0.1), 100); // E5
            setTimeout(() => playTone(783.99, 0.5, 'triangle', 0.1), 200); // G5
            setTimeout(() => playTone(1046.50, 0.8, 'triangle', 0.1), 300); // C6
        }

        function playClickSound() {
            playTone(800, 0.1, 'square', 0.05);
        }

        function playGenerateSound() {
            playTone(400, 0.1, 'sawtooth', 0.05);

        }

        /**

        function getAutoHoliday() {
            const now = new Date();
            const month = now.getMonth(); // 0-11
            const day = now.getDate();   // 1-31
            
            // Проверка основных дат
            if (month === 0 && day <= 10) return 'new_year';
            if (month === 11 && day >= 20) return 'christmas';
            if (month === 2 && day === 8) return 'womens_day';
            if (month === 4 && day === 9) return 'victory_day';
            if (month === 4 && day === 1) return 'spring_labor';
            if (month === 5 && day === 12) return 'russia_day';
            if (month === 10 && day === 4) return 'unity_day';
            if (month === 1 && day === 23) return 'defender_day';
            if (month === 1 && day === 14) return 'valentines_day';
            if (month === 9 && day === 5) return 'teachers_day'; // Упрощенно
            if (month === 9 && day === 3) return 'doctors_day';
            if (month === 10 && day === 10) return 'police_day';
            if (month === 9 && day === 22) return 'taxi_driver_day';
            if (month === 0 && day === 25) return 'students_day';
            if (month === 10 && day === 24) return 'mothers_day'; // Упрощенно
            if (month === 5 && day === 21) return 'fathers_day'; // Упрощенно
            if (month === 9 && day === 1) return 'grandparents_day';
            if (month === 8 && day === 1) return 'knowledge_day';
            if (month === 4 && day === 25) return 'last_bell'; // Упрощенно
            
            return 'custom_occasion'; // Если нет конкретного праздника
        }

        /**
         * ФОНОВАЯ АНИМАЦИЯ (ЧАСТИЦЫ)
         */
        let particlesArray = [];
        let animationId;

        class Particle {
            constructor(type, color) {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = color;
                this.type = type;
                this.opacity = Math.random() * 0.5 + 0.2;
                
                if (type === 'snow') {
                    this.speedY = Math.random() * 1 + 0.5; // Падает вниз
                    this.speedX = Math.sin(this.y * 0.01) * 0.5; // Качается
                } else if (type === 'balloons') {
                    this.speedY = -(Math.random() * 1 + 0.5); // Летит вверх
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Перемотка если вышел за экран
                if (this.y > bgCanvas.height) this.y = -10;
                if (this.y < 0) this.y = bgCanvas.height;
                if (this.x > bgCanvas.width) this.x = -10;
                if (this.x < 0) this.x = bgCanvas.width;
            }

            draw(ctx) {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                
                if (this.type === 'snow' || this.type === 'stars') {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'flowers' || this.type === 'hearts') {
                    // Простая форма лепестка/сердца
                    ctx.moveTo(this.x, this.y);
                    ctx.bezierCurveTo(this.x - this.size*2, this.y - this.size*2, this.x + this.size*2, this.y - this.size*2, this.x, this.y + this.size*2);
                    ctx.fill();
                } else if (this.type === 'balloons') {
                    ctx.ellipse(this.x, this.y, this.size, this.size * 1.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Нитка
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.size * 1.2);
                    ctx.lineTo(this.x, this.y + this.size * 3);
                    ctx.stroke();
                } else {
                    ctx.rect(this.x, this.y, this.size, this.size);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        function startBackgroundAnimation(particleType, accentColor) {
            cancelAnimationFrame(animationId);
            particlesArray = [];
            const count = particleType === 'snow' ? 100 : 50;
            
            for (let i = 0; i < count; i++) {
                particlesArray.push(new Particle(particleType, accentColor));
            }

            function animate() {
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                particlesArray.forEach(p => {
                    p.update();
                    p.draw(bgCtx);
                });
                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        /**
         * РЕНДЕРИНГ ОТКРЫТКИ НА CANVAS
         */
        function renderCard() {
            playClickSound();
            const width = 800;
            const height = 1000;
            cardCanvas.width = width;
            cardCanvas.height = height;

            const occasion = occasionSelect.value;
            const config = holidaysConfig[occasion] || holidaysConfig.custom_occasion;
            const text = messageTextArea.value;
            const title = config.title;

            // 1. Фон
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, config.colors[0]);
            gradient.addColorStop(1, config.colors[1] || '#ffffff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 2. Декоративные элементы (рамка)
            ctx.strokeStyle = config.accent;
            ctx.lineWidth = 10;
            ctx.strokeRect(20, 20, width - 40, height - 40);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 30, width - 60, height - 60);

            // 3. Заголовок
            ctx.font = "bold 60px 'Cormorant Garamond', serif";
            ctx.fillStyle = config.accent;
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 10;
            ctx.fillText(title, width / 2, 150);

            // 4. Основной текст
            ctx.font = "30px 'Montserrat', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 5;
            ctx.textAlign = "left";
            
            // Разбивка текста на строки
            const words = text.split(' ');
            let line = '';
            let y = 250;
            const lineHeight = 45;
            const maxWidth = width - 100;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                const testWidth = metrics.width;
                
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, 50, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, 50, y);

            // 5. Подпись внизу справа
            ctx.font = "italic 24px 'Cormorant Garamond', serif";
            ctx.fillStyle = config.accent;
            ctx.textAlign = "right";
            ctx.fillText("— Generated by Elegance Cards", width - 50, height - 50);
            
            // 6. Тематические декорации (Елки, Цветы, Шары и т.д.)
            // Передаем тип частиц из конфига как ключ для выбора стиля рисования
            drawThematicDecorations(ctx, config.particles, config.accent, width, height);

            enableDownload();
            showModal();
        }

        function drawStaticParticles(ctx, type, color, w, h) {
            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = color;
            for(let i=0; i<20; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const size = Math.random() * 20 + 5;
                ctx.beginPath();
                if(type === 'snow' || type === 'stars') {
                    ctx.arc(x, y, size, 0, Math.PI*2);
                } else {
                    ctx.rect(x, y, size, size);
                }
                ctx.fill();
            }
            ctx.restore();
        }

            successModal.classList.add('active');
        }

        function closeModal() {
            successModal.classList.remove('active');
        }

                /**
         * РИСОВАНИЕ ТЕМАТИЧЕСКИХ ДЕКОРАЦИЙ НА ОТКРЫТКЕ
         */
        function drawThematicDecorations(ctx, themeType, accentColor, w, h) {
            ctx.save(); // Сохраняем состояние контекста
            
            switch(themeType) {
                case 'snow': // Новый Год, Рождество, Старый Новый Год
                    drawWinterScene(ctx, w, h);
                    break;
                    
                case 'flowers': // 8 Марта, День Матери, Именины
                    drawSpringFlowers(ctx, w, h, accentColor);
                    break;
                    
                case 'confetti_gold': // День Победы, Юбилеи, Государственные праздники
                    drawVictoryStyle(ctx, w, h);
                    break;
                    
                case 'balloons': // День Рождения, Свадьба, Помолвка
                    drawBirthdayParty(ctx, w, h, accentColor);
                    break;
                    
                case 'hearts': // День Влюбленных, Свадьба, Любовь
                    drawRomanticHearts(ctx, w, h, accentColor);
                    break;
                    
                case 'stars': // Профессиональные праздники (Учитель, Врач, Программист)
                    drawProfessionalStars(ctx, w, h, accentColor);
                    break;

                default:
                    // Для остальных случаев рисуем элегантный абстрактный узор
                    drawElegantAbstract(ctx, w, h, accentColor);
            }
            
            ctx.restore(); // Восстанавливаем состояние
        }

        // --- СПЕЦИФИЧНЫЕ ФУНКЦИИ РИСОВАНИЯ ---

        function drawWinterScene(ctx, w, h) {
            // 1. Снежные холмы внизу
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, h - 150);
            ctx.quadraticCurveTo(w / 4, h - 200, w / 2, h - 150);
            ctx.quadraticCurveTo((w * 3) / 4, h - 100, w, h - 150);
            ctx.lineTo(w, h);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // 2. Елки слева и справа
            drawTree(ctx, 100, h - 160, 60, '#2d5a27'); // Левая елка
            drawTree(ctx, w - 100, h - 160, 60, '#2d5a27'); // Правая елка
            drawTree(ctx, w / 2, h - 180, 80, '#1e3c1a'); // Центральная большая елка (за текстом, но видна сверху/снизу)

            // 3. Падающий снег (статичный эффект для картинки)
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<100; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const size = Math.random() * 3 + 1;
                
                // Рисуем шестилучевую снежинку или просто точку
                if (size > 2) {
                    drawSnowflake(ctx, x, y, size * 2);
                } else {
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 4. Гирлянда сверху
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.bezierCurveTo(w/4, 100, 3*w/4, 0, w, 50);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Лампочки на гирлянде
            const bulbPositions = [0.1, 0.3, 0.5, 0.7, 0.9];
            bulbPositions.forEach(pos => {
                const bx = pos * w;
                const by = 50 + Math.sin(pos * Math.PI) * 20; // Примерное положение по кривой
                ctx.fillStyle = ['#ff0000', '#00ff00', '#ffff00'][Math.floor(Math.random()*3)];
                ctx.beginPath();
                ctx.arc(bx, by, 4, 0, Math.PI*2);
                ctx.fill();
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(bx-1, by-1, 1.5, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function drawTree(ctx, x, baseY, height, color) {
            ctx.fillStyle = color;
            // Ствол
            ctx.fillRect(x - 5, baseY, 10, 20);
            // Крона (треугольники)
            ctx.beginPath();
            ctx.moveTo(x, baseY - height);
            ctx.lineTo(x - height/2, baseY);
            ctx.lineTo(x + height/2, baseY);
            ctx.fill();
            
            // Второй ярус
            ctx.beginPath();
            ctx.moveTo(x, baseY - height - 20);
            ctx.lineTo(x - height/3, baseY - 20);
            ctx.lineTo(x + height/3, baseY - 20);
            ctx.fill();
            
            // Звезда на верхушке
            ctx.fillStyle = '#ffd700';
            drawStar(ctx, x, baseY - height - 25, 5, 10, 5);
        }

        function drawSnowflake(ctx, x, y, radius) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i * 60) * Math.PI / 180;
                const ex = x + Math.cos(angle) * radius;
                const ey = y + Math.sin(angle) * radius;
                ctx.moveTo(x, y);
                ctx.lineTo(ex, ey);
                // Маленькие ответвления
                const midX = x + Math.cos(angle) * (radius * 0.6);
                const midY = y + Math.sin(angle) * (radius * 0.6);
                ctx.moveTo(midX, midY);
                ctx.lineTo(midX + Math.cos(angle + 0.5) * (radius * 0.3), midY + Math.sin(angle + 0.5) * (radius * 0.3));
                ctx.moveTo(midX, midY);
                ctx.lineTo(midX + Math.cos(angle - 0.5) * (radius * 0.3), midY + Math.sin(angle - 0.5) * (radius * 0.3));
            }
            ctx.stroke();
        }

        function drawSpringFlowers(ctx, w, h, color) {
            // Фон: мягкий розовый/бежевый градиент уже есть, добавим цветы по углам
            
            // Тюльпан функция
            function drawTulip(x, y, scale, hueShift) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                
                // Стебель
                ctx.strokeStyle = '#4caf50';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(10, -20, 0, -40);
                ctx.stroke();
                
                // Лепестки
                const petalColors = ['#ff6b6b', '#ffa502', '#ff4757'];
                const pColor = petalColors[Math.abs(hueShift) % petalColors.length];
                
                ctx.fillStyle = pColor;
                ctx.beginPath();
                ctx.moveTo(0, -40);
                ctx.bezierCurveTo(-15, -50, -10, -70, 0, -60);
                ctx.bezierCurveTo(10, -70, 15, -50, 0, -40);
                ctx.fill();
                
                // Центральный лепесток
                ctx.fillStyle = adjustBrightness(pColor, -20);
                ctx.beginPath();
                ctx.moveTo(0, -40);
                ctx.bezierCurveTo(-5, -55, 5, -55, 0, -40);
                ctx.fill();
                
                ctx.restore();
            }
            
            // Разбросаем тюльпаны по нижним углам и сбоку
            drawTulip(50, h - 50, 1.5, 0);
            drawTulip(120, h - 30, 1.2, 1);
            drawTulip(w - 50, h - 50, 1.5, 2);
            drawTulip(w - 120, h - 30, 1.2, 0);
            drawTulip(30, h/2, 1.0, 1); // Боковой цветок
            
            // Листики вокруг
            ctx.fillStyle = 'rgba(76, 175, 80, 0.3)';
            for(let i=0; i<15; i++) {
                const lx = Math.random() * w;
                const ly = h - Math.random() * 100;
                ctx.beginPath();
                ctx.ellipse(lx, ly, 10, 5, Math.random(), 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawVictoryStyle(ctx, w, h) {
            // Георгиевская лента стилизация (черно-оранжевые полосы)
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.strokeStyle = '#ff8c00'; // Оранжевый
            ctx.lineWidth = 20;
            
            // Диагональные линии
            for(let i = -h; i < w + h; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + h, h);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#000000'; // Черный
            ctx.lineWidth = 10;
            for(let i = -h; i < w + h; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i + 15, 0);
                ctx.lineTo(i + h + 15, h);
                ctx.stroke();
            }
            ctx.restore();

            // Звезды победы
            ctx.fillStyle = '#cc0000';
            drawStar(ctx, w/2, 100, 5, 30, 15); // Верхняя звезда
            drawStar(ctx, 50, h - 50, 5, 20, 10);
            drawStar(ctx, w - 50, h - 50, 5, 20, 10);
            
            // Вечный огонь (стилизация снизу)
            const gradFire = ctx.createRadialGradient(w/2, h, 10, w/2, h, 100);
            gradFire.addColorStop(0, 'rgba(255, 165, 0, 0.8)');
            gradFire.addColorStop(0.5, 'rgba(255, 69, 0, 0.4)');
            gradFire.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = gradFire;
            ctx.beginPath();
            ctx.arc(w/2, h, 100, Math.PI, 0);
            ctx.fill();
        }

        function drawBirthdayParty(ctx, w, h, color) {
            // Воздушные шары
            const balloonColors = ['#ff4081', '#00bcd4', '#ffeb3b', '#9c27b0', '#4caf50'];
            
            function drawBalloon(x, y, r, c) {
                ctx.fillStyle = c;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                // Блик
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(x - r/3, y - r/3, r/4, 0, Math.PI * 2);
                ctx.fill();
                // Узел
                ctx.fillStyle = c;
                ctx.beginPath();
                ctx.moveTo(x - 5, y + r);
                ctx.lineTo(x + 5, y + r);
                ctx.lineTo(x, y + r + 10);
                ctx.fill();
                // Нитка
                ctx.strokeStyle = '#ccc';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y + r + 10);
                ctx.quadraticCurveTo(x + 20, y + r + 50, x, y + r + 100);
                ctx.stroke();
            }

            drawBalloon(100, 150, 40, balloonColors[0]);
            drawBalloon(w - 100, 150, 40, balloonColors[1]);
            drawBalloon(200, 100, 30, balloonColors[2]);
            drawBalloon(w - 200, 100, 30, balloonColors[3]);
            
            // Торт снизу
            ctx.fillStyle = '#fff';
            ctx.fillRect(w/2 - 100, h - 80, 200, 60); // Основа торта
            ctx.fillStyle = '#ff69b4'; // Глазурь
            ctx.fillRect(w/2 - 100, h - 80, 200, 10);
            
            // Свечи
            for(let i=0; i<5; i++) {
                const cx = w/2 - 40 + i*20;
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(cx, h - 100, 4, 20);
                // Пламя
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.ellipse(cx + 2, h - 105, 3, 6, 0, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Конфетти
            ctx.globalAlpha = 0.6;
            for(let i=0; i<50; i++) {
                ctx.fillStyle = balloonColors[Math.floor(Math.random()*balloonColors.length)];
                const rx = Math.random() * w;
                const ry = Math.random() * h;
                ctx.save();
                ctx.translate(rx, ry);
                ctx.rotate(Math.random() * Math.PI);
                ctx.fillRect(-2, -4, 4, 8);
                ctx.restore();
            }
            ctx.globalAlpha = 1.0;
        }

        function drawRomanticHearts(ctx, w, h, color) {
            function drawHeart(x, y, size, fillCol) {
                ctx.fillStyle = fillCol;
                ctx.beginPath();
                const topCurveHeight = size * 0.3;
                ctx.moveTo(x, y + topCurveHeight);
                // Левая дуга
                ctx.bezierCurveTo(
                  x, y, 
                  x - size / 2, y, 
                  x - size / 2, y + topCurveHeight
                );
                ctx.bezierCurveTo(
                  x - size / 2, y + (size + topCurveHeight) / 2, 
                  x, y + (size + topCurveHeight) / 2, 
                  x, y + size
                );
                // Правая дуга
                ctx.bezierCurveTo(
                  x, y + (size + topCurveHeight) / 2, 
                  x + size / 2, y + (size + topCurveHeight) / 2, 
                  x + size / 2, y + topCurveHeight
                );
                ctx.bezierCurveTo(
                  x + size / 2, y, 
                  x, y, 
                  x, y + topCurveHeight
                );
                ctx.closePath();
                ctx.fill();
            }

            // Большие сердца по углам
            drawHeart(80, 80, 60, 'rgba(255, 105, 180, 0.3)');
            drawHeart(w - 80, h - 80, 60, 'rgba(255, 105, 180, 0.3)');
            
            // Маленькие летающие сердечки
            for(let i=0; i<10; i++) {
                const hx = Math.random() * w;
                const hy = Math.random() * h;
                const hs = Math.random() * 10 + 5;
                drawHeart(hx, hy, hs, color);
            }
            
            // Розы (упрощенно спиралью)
            function drawRose(x, y, r) {
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let a=0; a<Math.PI*4; a+=0.1) {
                    const rad = r * (1 - a/(Math.PI*4));
                    const px = x + Math.cos(a) * rad;
                    const py = y + Math.sin(a) * rad;
                    if(a===0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            drawRose(50, h/2, 20);
            drawRose(w-50, h/2, 20);
        }

        function drawProfessionalStars(ctx, w, h, color) {
            // Фон: сетка или книги/код (в зависимости от профессии, здесь универсально)
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            
            // Горизонтальные линии (как страницы тетради или код)
            for(let y=100; y<h; y+=40) {
                ctx.beginPath();
                ctx.moveTo(50, y);
                ctx.lineTo(w-50, y);
                ctx.stroke();
            }
            
            // Звезды успеха
            ctx.fillStyle = color;
            drawStar(ctx, w/2, 120, 5, 25, 12);
            drawStar(ctx, 100, h-100, 5, 15, 7);
            drawStar(ctx, w-100, h-100, 5, 15, 7);
            
            // Текст "Best Wishes" фоном очень бледно
            ctx.font = "bold 100px Arial";
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.textAlign = 'center';
            ctx.fillText("SUCCESS", w/2, h/2);
        }

        function drawElegantAbstract(ctx, w, h, color) {
            // Плавные волны
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.2;
            
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.moveTo(0, h/2 + i*20 - 50);
                ctx.bezierCurveTo(w/4, h/2 + i*20 - 100, 3*w/4, h/2 + i*20, w, h/2 + i*20 - 50);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
            
            // Угловые украшения
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI/2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w, h, 50, Math.PI, Math.PI*1.5);
            ctx.fill();
        }

        // Вспомогательная функция для звезды
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }
        
        // Вспомогательная для изменения яркости цвета (для тюльпанов)
        function adjustBrightness(hex, percent) {
            let num = parseInt(hex.replace("#",""), 16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }
