<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Inspector</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232997ff' rx='20'/><rect x='25' y='30' width='50' height='35' rx='4' fill='none' stroke='white' stroke-width='6'/><path d='M40 65 h20' stroke='white' stroke-width='6'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-glass: rgba(255, 255, 255, 0.03);
            --bg-glass-hover: rgba(255, 255, 255, 0.06);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #6e6e73;
            --accent: #2997ff;
            --accent-hover: #0077ed;
            --success: #30d158;
            --warning: #ffd60a;
            --error: #ff453a;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(41, 151, 255, 0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(120, 80, 255, 0.03) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -1%) rotate(1deg); }
            66% { transform: translate(-1%, 2%) rotate(-1deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px 100px;
        }

        header {
            text-align: center;
            padding: 60px 0 50px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f5f5f7 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        header p {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--text-secondary);
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 16px 24px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: scaleIn 0.6s ease;
        }

        .stat-item .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-item .stat-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .search-bar {
            max-width: 500px;
            margin: 30px auto;
            position: relative;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .search-bar svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #a1a1a6;
            opacity: 0.7;
            z-index: 2;
            pointer-events: none;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(41, 151, 255, 0.1);
        }

        .search-bar input:focus ~ svg {
            opacity: 1;
            color: var(--accent);
        }

        .search-bar input::placeholder {
            color: var(--text-tertiary);
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 30px 0;
            padding: 0 10px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .cat-btn {
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            white-space: nowrap;
        }

        .cat-btn:hover, .cat-btn.active {
            background: rgba(41, 151, 255, 0.1);
            border-color: rgba(41, 151, 255, 0.3);
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px 12px 100px;
            }
            header {
                padding: 40px 0 30px;
            }
            .stats-bar {
                gap: 12px;
            }
            .stat-item {
                padding: 12px 18px;
            }
        }

        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease both;
            overflow: hidden;
        }

        .card:hover {
            background: var(--bg-glass-hover);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glass);
        }

        .card-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(41, 151, 255, 0.1);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .card-icon svg {
            width: 16px;
            height: 16px;
            color: var(--accent);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .card-count {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 100px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            gap: 12px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 0.78rem;
            color: var(--text-tertiary);
            flex-shrink: 0;
            min-width: 0;
        }

        .info-value {
            font-size: 0.78rem;
            color: var(--text-primary);
            text-align: right;
            word-break: break-all;
            font-weight: 500;
            max-width: 60%;
        }

        .info-value.mono {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.72rem;
        }

        .info-value.truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(48, 209, 88, 0.1);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(255, 214, 10, 0.1);
            color: var(--warning);
        }

        .badge-error {
            background: rgba(255, 69, 58, 0.1);
            color: var(--error);
        }

        .badge-info {
            background: rgba(41, 151, 255, 0.1);
            color: var(--accent);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--accent), #5ac8fa);
            transition: width 1s ease;
        }

        /* Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .chat-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #5856d6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(41, 151, 255, 0.3);
            transition: all 0.3s ease;
        }

        .chat-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 32px rgba(41, 151, 255, 0.4);
        }

        .chat-toggle svg {
            width: 24px;
            height: 24px;
            color: white;
            transition: transform 0.3s ease;
        }

        .chat-toggle.open svg {
            transform: rotate(90deg);
        }

        .chat-panel {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 380px;
            max-width: calc(100vw - 48px);
            height: 520px;
            max-height: calc(100vh - 140px);
            background: rgba(28, 28, 30, 0.95);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
        }

        .chat-panel.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-header-avatar svg {
            width: 18px;
            height: 18px;
            color: white;
        }

        .chat-header-info h3 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .chat-header-info p {
            font-size: 0.72rem;
            color: var(--text-tertiary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
        }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.82rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .chat-msg.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .chat-msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-msg.loading {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            padding: 14px;
        }

        .chat-msg.loading .dots {
            display: flex;
            gap: 4px;
        }

        .chat-msg.loading .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-tertiary);
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .chat-msg.loading .dots span:nth-child(2) { animation-delay: 0.2s; }
        .chat-msg.loading .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 100px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        .chat-input-area button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .chat-input-area button:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .chat-input-area button svg {
            width: 16px;
            height: 16px;
            color: white;
        }

        .api-key-section {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.02);
        }

        .api-key-section input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-family: 'SF Mono', monospace;
            outline: none;
            transition: all 0.3s ease;
        }

        .api-key-section input:focus {
            border-color: var(--accent);
        }

        .api-key-section label {
            font-size: 0.68rem;
            color: var(--text-tertiary);
            margin-bottom: 6px;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .card.full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 480px) {
            .chat-panel {
                width: calc(100vw - 24px);
                right: -12px;
                height: calc(100vh - 120px);
            }
            .chat-widget {
                bottom: 16px;
                right: 16px;
            }
        }

        .loading-skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
            height: 14px;
            margin: 6px 0;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .export-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 18px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .export-btn:hover {
            background: rgba(41, 151, 255, 0.1);
            border-color: rgba(41, 151, 255, 0.3);
            color: var(--accent);
        }

        .export-btn svg {
            width: 14px;
            height: 14px;
        }

        .section-hidden {
            display: none;
        }

                .chat-msg.bot {
            white-space: normal;
        }

        .chat-msg.bot h1,
        .chat-msg.bot h2,
        .chat-msg.bot h3 {
            margin: 8px 0 4px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .chat-msg.bot p {
            margin: 4px 0;
        }

        .chat-msg.bot ul,
        .chat-msg.bot ol {
            margin: 4px 0;
            padding-left: 20px;
        }

        .chat-msg.bot li {
            margin: 2px 0;
        }

        .chat-msg.bot code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
        }

        .chat-msg.bot pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .chat-msg.bot pre code {
            background: none;
            padding: 0;
        }

        .chat-msg.bot strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-msg.bot em {
            font-style: italic;
        }

        .chat-msg.bot a {
            color: var(--accent);
            text-decoration: underline;
        }

        .chat-msg.bot blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 8px 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <button class="export-btn" onclick="exportData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Export JSON
    </button>

    <div class="container">
        <header>
            <h1>Device Inspector</h1>
            <p>Полная информация о вашем устройстве в реальном времени</p>
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalParams">0</div>
                    <div class="stat-label">Параметров</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCategories">0</div>
                    <div class="stat-label">Категорий</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="scanTime">0ms</div>
                    <div class="stat-label">Время скана</div>
                </div>
            </div>
        </header>

        <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Поиск по параметрам...">
        </div>

        <div class="categories-nav" id="categoriesNav"></div>

        <div class="grid" id="grid"></div>
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget">
        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <div class="chat-header-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0110 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
                </div>
                <div class="chat-header-info">
                    <h3>AI Ассистент</h3>
                    <p>Powered by Mistral AI</p>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg bot">Здравствуйте! Я могу ответить на вопросы о вашем устройстве. Введите API ключ Mistral и задайте вопрос.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Спросите о вашем устройстве...">
                <button onclick="sendMessage()">

        </button>
    </div>

    <script>
    let allData = {};
    let totalParamCount = 0;

    function getIcon(type) {
        const icons = {
            system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
            browser: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>',
            screen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
            network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>',

            gpu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>',
            storage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
            battery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><path d="M23 13v-2"/><path d="M11 10v4M9 12h4"/></svg>',
            media: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>',
            location: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
            input: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M6 16h12"/></svg>',
            security: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
            performance: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
            fingerprint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 018 4"/><path d="M5 19.5C5.5 18 6 15 6 12c0-3.5 2.5-6 6-6 1 0 2 .3 2.8.8"/><path d="M12 12v7.5"/><path d="M9.5 12C9.7 9.8 10.7 8 12 8c1.8 0 3 1.5 3 3.5 0 1.6-.6 3.5-1.5 5"/></svg>',
            connectivity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.4M16.2 7.8c2.3 2.3 2.3 6.1 0 8.4M19.1 4.9C23 8.8 23 15.2 19.1 19.1M12 12h.01"/></svg>',
            timezone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
            fonts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>',
            webgl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'
        };
        return icons[type] || icons.system;
    }

    async function collectAllData() {
        const startTime = performance.now();
        const data = {};

        // 1. System Information
        data['Система'] = {
            icon: 'system',
            items: {}
        };
        const sysItems = data['Система'].items;
        sysItems['User Agent'] = navigator.userAgent;
        sysItems['Platform'] = navigator.platform || 'N/A';
        sysItems['Vendor'] = navigator.vendor || 'N/A';
        sysItems['App Name'] = navigator.appName;
        sysItems['App Version'] = navigator.appVersion;
        sysItems['App Code Name'] = navigator.appCodeName;
        sysItems['Product'] = navigator.product || 'N/A';
        sysItems['Product Sub'] = navigator.productSub || 'N/A';
        sysItems['Language'] = navigator.language;
        sysItems['Languages'] = navigator.languages ? navigator.languages.join(', ') : 'N/A';
        sysItems['Online'] = navigator.onLine ? 'Да' : 'Нет';
        sysItems['Cookie Enabled'] = navigator.cookieEnabled ? 'Да' : 'Нет';
        sysItems['Do Not Track'] = navigator.doNotTrack || window.doNotTrack || 'Не установлено';
        sysItems['PDF Viewer'] = navigator.pdfViewerEnabled ? 'Да' : 'Нет';
        sysItems['Hardware Concurrency'] = (navigator.hardwareConcurrency || 'N/A') + ' потоков';
        sysItems['Max Touch Points'] = navigator.maxTouchPoints || 0;
        sysItems['Device Memory'] = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A';
        sysItems['Java Enabled'] = (() => { try { return navigator.javaEnabled() ? 'Да' : 'Нет'; } catch(e) { return 'N/A'; } })();
        sysItems['Pointer Count'] = navigator.maxTouchPoints || 0;
        sysItems['Webdriver'] = navigator.webdriver ? 'Да' : 'Нет';
        sysItems['Build ID'] = (() => { try { return navigator.buildID || 'N/A'; } catch(e) { return 'N/A'; } })();
        sysItems['OS CPU'] = navigator.oscpu || 'N/A';
        sysItems['Service Worker Supported'] = 'serviceWorker' in navigator ? 'Да' : 'Нет';
        sysItems['Share API Supported'] = 'share' in navigator ? 'Да' : 'Нет';
        sysItems['Clipboard API'] = 'clipboard' in navigator ? 'Да' : 'Нет';
        sysItems['Geolocation API'] = 'geolocation' in navigator ? 'Да' : 'Нет';
        sysItems['Notifications API'] = 'Notification' in window ? 'Да' : 'Нет';
        sysItems['Permissions API'] = 'permissions' in navigator ? 'Да' : 'Нет';
        sysItems['Media Devices API'] = 'mediaDevices' in navigator ? 'Да' : 'Нет';
        sysItems['Bluetooth API'] = 'bluetooth' in navigator ? 'Да' : 'Нет';
        sysItems['USB API'] = 'usb' in navigator ? 'Да' : 'Нет';
        sysItems['Gamepad API'] = 'getGamepads' in navigator ? 'Да' : 'Нет';
        sysItems['Vibration API'] = 'vibrate' in navigator ? 'Да' : 'Нет';
        sysItems['Wake Lock API'] = 'wakeLock' in navigator ? 'Да' : 'Нет';
        sysItems['Presentation API'] = 'presentation' in navigator ? 'Да' : 'Нет';
        sysItems['Web Speech API'] = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window ? 'Да' : 'Нет';
        sysItems['WebRTC'] = 'RTCPeerConnection' in window ? 'Да' : 'Нет';
        sysItems['IndexedDB'] = 'indexedDB' in window ? 'Да' : 'Нет';
        sysItems['Cache API'] = 'caches' in window ? 'Да' : 'Нет';
        sysItems['Web Workers'] = 'Worker' in window ? 'Да' : 'Нет';
        sysItems['WebAssembly'] = 'WebAssembly' in window ? 'Да' : 'Нет';
        sysItems['Intersection Observer'] = 'IntersectionObserver' in window ? 'Да' : 'Нет';
        sysItems['Resize Observer'] = 'ResizeObserver' in window ? 'Да' : 'Нет';
        sysItems['Mutation Observer'] = 'MutationObserver' in window ? 'Да' : 'Нет';
        sysItems['Performance Observer'] = 'PerformanceObserver' in window ? 'Да' : 'Нет';

        // 2. Browser Details
        data['Браузер'] = {
            icon: 'browser',
            items: {}
        };
        const brItems = data['Браузер'].items;
        brItems['Browser Name'] = detectBrowser();
        brItems['Browser Version'] = detectBrowserVersion();
        brItems['Engine'] = detectEngine();
        brItems['Is Mobile'] = /Mobi|Android/i.test(navigator.userAgent) ? 'Да' : 'Нет';
        brItems['Is Tablet'] = /Tablet|iPad/i.test(navigator.userAgent) ? 'Да' : 'Нет';
        brItems['Is Desktop'] = !/Mobi|Android|Tablet|iPad/i.test(navigator.userAgent) ? 'Да' : 'Нет';
        brItems['User Agent Length'] = navigator.userAgent.length + ' символов';
        brItems['Plural Rules'] = 'Intl' in window ? 'Да' : 'Нет';
        brItems['Intl DateTimeFormat'] = 'Intl' in window && 'DateTimeFormat' in Intl ? 'Да' : 'Нет';
        brItems['Intl NumberFormat'] = 'Intl' in window && 'NumberFormat' in Intl ? 'Да' : 'Нет';
        brItems['Intl Collator'] = 'Intl' in window && 'Collator' in Intl ? 'Да' : 'Нет';
        brItems['Fetch API'] = 'fetch' in window ? 'Да' : 'Нет';
        brItems['XMLHttpRequest'] = 'XMLHttpRequest' in window ? 'Да' : 'Нет';
        brItems['WebSocket'] = 'WebSocket' in window ? 'Да' : 'Нет';
        brItems['EventSource (SSE)'] = 'EventSource' in window ? 'Да' : 'Нет';
        brItems['BroadcastChannel'] = 'BroadcastChannel' in window ? 'Да' : 'Нет';
        brItems['History API'] = 'history' in window && 'pushState' in history ? 'Да' : 'Нет';
        brItems['Page Visibility'] = 'visibilityState' in document ? 'Да' : 'Нет';
        brItems['Fullscreen API'] = 'fullscreenEnabled' in document ? 'Да' : 'Нет';
        brItems['Picture-in-Picture'] = 'pictureInPictureEnabled' in document ? 'Да' : 'Нет';
        brItems['Picture-in-Picture (Video)'] = 'HTMLVideoElement' in window && 'pictureInPictureEnabled' in document ? 'Да' : 'Нет';
        brItems['Picture-in-Picture (Canvas)'] = 'HTMLCanvasElement' in window && typeof document.createElement('canvas').transferControlToOffscreen === 'function' ? 'Да' : 'Нет';
        brItems['Web Animations'] = 'animate' in (document.createElement('div')) ? 'Да' : 'Нет';
        brItems['CSS Custom Properties'] = CSS.supports && CSS.supports('--a', '0') ? 'Да' : 'Нет';
        brItems['CSS Grid'] = CSS.supports && CSS.supports('display', 'grid') ? 'Да' : 'Нет';
        brItems['CSS Flexbox'] = CSS.supports && CSS.supports('display', 'flex') ? 'Да' : 'Нет';
        brItems['CSS Container Queries'] = CSS.supports && CSS.supports('container-type', 'inline-size') ? 'Да' : 'Нет';
        brItems['CSS Nesting'] = CSS.supports && CSS.supports('selector(&)') ? 'Да' : 'Нет';
        brItems['CSS :has()'] = CSS.supports && CSS.supports('selector(:has(*))') ? 'Да' : 'Нет';
        brItems['CSS Subgrid'] = CSS.supports && CSS.supports('grid-template-columns', 'subgrid') ? 'Да' : 'Нет';
        brItems['Web Components'] = 'customElements' in window ? 'Да' : 'Нет';
        brItems['Shadow DOM'] = 'attachShadow' in (document.createElement('div')) ? 'Да' : 'Нет';
        brItems['Template Element'] = 'content' in document.createElement('template') ? 'Да' : 'Нет';
        brItems['Dialog Element'] = 'HTMLDialogElement' in window ? 'Да' : 'Нет';
        brItems['Popover API'] = 'popover' in (document.createElement('div')) ? 'Да' : 'Нет';
        brItems['View Transitions'] = 'startViewTransition' in document ? 'Да' : 'Нет';
        brItems['Scroll Animation'] = 'animate' in (document.createElement('div')) && CSS.supports('animation-range', '0% 100%') ? 'Да' : 'Нет';
        brItems['Declarative Shadow DOM'] = 'ShadowRoot' in window && 'DeclarativeShadowRoot' in window ? 'Да' : 'Нет';
        brItems['Compression Streams'] = 'CompressionStream' in window ? 'Да' : 'Нет';
        brItems['Web Crypto'] = 'crypto' in window && 'subtle' in crypto ? 'Да' : 'Нет';
        brItems['Structured Clone'] = typeof structuredClone === 'function' ? 'Да' : 'Нет';
        brItems['AbortController'] = 'AbortController' in window ? 'Да' : 'Нет';

        // 3. Screen
        data['Экран'] = {
            icon: 'screen',
            items: {}
        };
        const scItems = data['Экран'].items;
        scItems['Screen Width'] = screen.width + 'px';
        scItems['Screen Height'] = screen.height + 'px';
        scItems['Available Width'] = screen.availWidth + 'px';
        scItems['Available Height'] = screen.availHeight + 'px';
        scItems['Color Depth'] = screen.colorDepth + ' bit';
        scItems['Pixel Depth'] = screen.pixelDepth + ' bit';
        scItems['Device Pixel Ratio'] = window.devicePixelRatio + 'x';
        scItems['Viewport Width'] = window.innerWidth + 'px';
        scItems['Viewport Height'] = window.innerHeight + 'px';
        scItems['Outer Width'] = window.outerWidth + 'px';
        scItems['Outer Height'] = window.outerHeight + 'px';
        scItems['Screen X'] = window.screenX + 'px';
        scItems['Screen Y'] = window.screenY + 'px';
        scItems['Orientation'] = screen.orientation ? screen.orientation.type : 'N/A';
        scItems['Orientation Angle'] = screen.orientation ? screen.orientation.angle + '°' : 'N/A';
        scItems['Effective Type'] = (screen.orientation && screen.orientation.type.includes('portrait')) ? 'Портрет' : 'Ландшафт';
        scItems['Is Landscape'] = window.innerWidth > window.innerHeight ? 'Да' : 'Нет';
        scItems['Actual Screen Width (CSS)'] = window.innerWidth + 'px';
        scItems['Actual Screen Height (CSS)'] = window.innerHeight + 'px';
        scItems['Physical Width'] = Math.round(screen.width * window.devicePixelRatio) + 'px';
        scItems['Physical Height'] = Math.round(screen.height * window.devicePixelRatio) + 'px';
        scItems['Scroll X'] = window.scrollX + 'px';
        scItems['Scroll Y'] = window.scrollY + 'px';
        scItems['Page Offset X'] = window.pageXOffset + 'px';
        scItems['Page Offset Y'] = window.pageYOffset + 'px';

        // 4. Network
        data['Сеть'] = {
            icon: 'network',
            items: {}
        };
        const netItems = data['Сеть'].items;
        if (navigator.connection) {
            const conn = navigator.connection;
            netItems['Effective Type'] = conn.effectiveType || 'N/A';
            netItems['Downlink'] = conn.downlink ? conn.downlink + ' Mbps' : 'N/A';
            netItems['RTT'] = conn.rtt ? conn.rtt + ' ms' : 'N/A';
            netItems['Save Data'] = conn.saveData ? 'Да' : 'Нет';
            netItems['Type'] = conn.type || 'N/A';
        } else {
            netItems['Connection API'] = 'Не поддерживается';
        }
        netItems['Online Status'] = navigator.onLine ? 'Онлайн' : 'Оффлайн';
        netItems['Protocol'] = location.protocol;
        netItems['Host'] = location.host || 'N/A';
        netItems['Hostname'] = location.hostname || 'N/A';
        netItems['Port'] = location.port || 'Default';
        netItems['Secure Context'] = window.isSecureContext ? 'Да' : 'Нет';
        netItems['HTTPS'] = location.protocol === 'https:' ? 'Да' : 'Нет';

        // IP Address (Пуленепробиваемая версия с кэшем и двойным fallback)
        try {
            const CACHE_KEY = 'di_ip_cache_v2';
            const CACHE_TIME = 15 * 60 * 1000; // 15 минут кэша
            
            // 1. Проверяем кэш, чтобы не спамить API при обновлениях страницы
            const cached = sessionStorage.getItem(CACHE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (Date.now() - parsed.timestamp < CACHE_TIME) {
                    Object.assign(netItems, parsed.data);
                    // Прерываем выполнение, данные взяты из кэша, запросы не идут
                } else {
                    sessionStorage.removeItem(CACHE_KEY);
                }
            }

            // 2. Если кэша нет или он устарел, пробуем получить данные
            if (!netItems['City'] || netItems['City'] === 'N/A' || netItems['City'].includes('Лимит')) {
                let geoData = null;

                // Попытка 1: ipapi.co (стандартный)
                try {
                    const res1 = await fetch('https://ipapi.co/json/');
                    if (res1.ok) {
                        const data = await res1.json();
                        if (!data.error) geoData = data;
                    }
                } catch (e) { /* Игнорируем, переходим к fallback */ }

                // Попытка 2: ip-api.com (если первый заблокировал, этот почти всегда работает, у него очень высокие лимиты)
                if (!geoData) {
                    try {
                        // Используем http, так как ip-api.com бесплатно не поддерживает https, но для определения IP это безопасно
                        const res2 = await fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,isp,query,timezone,currency');
                        if (res2.ok) {
                            const data = await res2.json();
                            if (data.status === 'success') geoData = data;
                        }
                    } catch (e) { /* Игнорируем */ }
                }

                // 3. Обрабатываем результат
                if (geoData) {
                    netItems['IP Address'] = geoData.ip || geoData.query || 'N/A';
                    netItems['City'] = geoData.city || geoData.regionName || 'N/A';
                    netItems['Region'] = geoData.region || geoData.regionName || 'N/A';
                    netItems['Country'] = geoData.country || geoData.country_name || 'N/A';
                    netItems['Country Code'] = geoData.countryCode || geoData.country_code || 'N/A';
                    netItems['ISP'] = geoData.isp || geoData.org || 'N/A';
                    netItems['Timezone (IP)'] = geoData.timezone || 'N/A';
                    netItems['Currency'] = geoData.currency || 'N/A';
                    
                    // Сохраняем в кэш
                    sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                        timestamp: Date.now(),
                        data: {
                            'IP Address': netItems['IP Address'],
                            'City': netItems['City'],
                            'Region': netItems['Region'],
                            'Country': netItems['Country'],
                            'Country Code': netItems['Country Code'],
                            'ISP': netItems['ISP'],
                            'Timezone (IP)': netItems['Timezone (IP)'],
                            'Currency': netItems['Currency']
                        }
                    }));
                } else {
                    // Если оба API вернули отказ (реальный бан по IP)
                    netItems['IP Address'] = 'Определен, но геоданные скрыты';
                    netItems['City'] = 'Лимит бесплатных API исчерпан';
                    netItems['Region'] = 'Попробуйте через 15 минут';
                    netItems['Country'] = 'Или отключите блокировщики рекламы';
                }
            }
        } catch(e) {
            netItems['IP Address'] = 'Ошибка сети';
        }

        // 5. Hardware
        data['Железо'] = {
            icon: 'hardware',
            items: {}
        };
        const hwItems = data['Железо'].items;
        hwItems['CPU Cores'] = navigator.hardwareConcurrency || 'N/A';
        hwItems['Logical Processors'] = navigator.hardwareConcurrency || 'N/A';
        hwItems['Device Memory'] = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A';
        hwItems['Max Touch Points'] = navigator.maxTouchPoints || 0;
        hwItems['Touch Support'] = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ? 'Да' : 'Нет';
        hwItems['Pointer Type'] = window.matchMedia('(pointer: fine)').matches ? 'Точный (мышь)' : window.matchMedia('(pointer: coarse)').matches ? 'Грубый (тач)' : 'Нет';
        hwItems['Hover Support'] = window.matchMedia('(hover: hover)').matches ? 'Да' : 'Нет';
        hwItems['Any Hover'] = window.matchMedia('(any-hover: hover)').matches ? 'Да' : 'Нет';
        hwItems['Any Pointer'] = window.matchMedia('(any-pointer: fine)').matches ? 'Точный' : window.matchMedia('(any-pointer: coarse)').matches ? 'Грубый' : 'Нет';
        hwItems['Color Gamut'] = window.matchMedia('(color-gamut: rec2100)').matches ? 'Rec.2100' : window.matchMedia('(color-gamut: p3)').matches ? 'P3' : window.matchMedia('(color-gamut: srgb)').matches ? 'sRGB' : 'N/A';
        hwItems['HDR Support'] = window.matchMedia('(dynamic-range: high)').matches ? 'Да' : 'Нет';
        hwItems['Inverted Colors'] = window.matchMedia('(inverted-colors: inverted)').matches ? 'Да' : 'Нет';
        hwItems['Prefers Reduced Motion'] = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'Да' : 'Нет';
        hwItems['Prefers Reduced Transparency'] = window.matchMedia('(prefers-reduced-transparency: reduce)').matches ? 'Да' : 'Нет';
        hwItems['Prefers Contrast'] = window.matchMedia('(prefers-contrast: more)').matches ? 'Высокая' : window.matchMedia('(prefers-contrast: less)').matches ? 'Низкая' : 'Обычная';
        hwItems['Forced Colors'] = window.matchMedia('(forced-colors: active)').matches ? 'Да' : 'Нет';
        hwItems['Color Scheme'] = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Тёмная' : 'Светлая';

        // 6. GPU / WebGL
        data['Графика (GPU)'] = {
            icon: 'gpu',
            items: {}
        };
        const gpuItems = data['Графика (GPU)'].items;
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                // Используем стандартные свойства вместо устаревшего WEBGL_debug_renderer_info
                // Это полностью убирает предупреждение Firefox о депрекации
                gpuItems['GPU Vendor'] = gl.getParameter(gl.VENDOR) || 'N/A';
                gpuItems['GPU Renderer'] = gl.getParameter(gl.RENDERER) || 'N/A';
                
                gpuItems['WebGL Version'] = gl.getParameter(gl.VERSION);
                gpuItems['GLSL Version'] = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
                gpuItems['WebGL Vendor'] = gl.getParameter(gl.VENDOR);
                gpuItems['WebGL Renderer'] = gl.getParameter(gl.RENDERER);
                gpuItems['Max Texture Size'] = gl.getParameter(gl.MAX_TEXTURE_SIZE) + 'px';
                
                const vpDims = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
                gpuItems['Max Viewport Dims'] = (vpDims && vpDims.length >= 2) ? vpDims[0] + 'x' + vpDims[1] : 'N/A';
                
                gpuItems['Max Renderbuffer Size'] = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) + 'px';
                gpuItems['Max Vertex Attribs'] = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);
                gpuItems['Max Vertex Uniform Vectors'] = gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS);

    function detectBrowser() {
        const ua = navigator.userAgent;
        if (ua.includes('Firefox')) return 'Firefox';
        if (ua.includes('SamsungBrowser')) return 'Samsung Internet';
        if (ua.includes('Opera') || ua.includes('OPR')) return 'Opera';
        if (ua.includes('Edg')) return 'Microsoft Edge';
        if (ua.includes('Chrome')) return 'Google Chrome';
        if (ua.includes('Safari')) return 'Safari';
        if (ua.includes('MSIE') || ua.includes('Trident')) return 'Internet Explorer';
        return 'Unknown';
    }

    function detectBrowserVersion() {
        const ua = navigator.userAgent;
        let match;
        if (match = ua.match(/Firefox\/(\d+)/)) return match[1];
        if (match = ua.match(/Edg\/(\d+)/)) return match[1];
        if (match = ua.match(/Chrome\/(\d+)/)) return match[1];
        if (match = ua.match(/Version\/(\d+)/)) return match[1];
        if (match = ua.match(/OPR\/(\d+)/)) return match[1];
        if (match = ua.match(/SamsungBrowser\/(\d+)/)) return match[1];
        return 'N/A';
    }

    function detectEngine() {
        const ua = navigator.userAgent;
        if (ua.includes('Gecko/')) return 'Gecko';
        if (ua.includes('AppleWebKit/')) return 'WebKit/Blink';
        if (ua.includes('Trident/')) return 'Trident';
        return 'Unknown';
    }

    function detectOS() {
        const ua = navigator.userAgent;
        if (ua.includes('Win')) return 'Windows';
        if (ua.includes('Mac')) return 'macOS';
        if (ua.includes('Linux') && !ua.includes('Android')) return 'Linux';
        if (ua.includes('Android')) return 'Android';
        if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
        if (ua.includes('CrOS')) return 'Chrome OS';
        return 'Unknown';
    }

    function detectOSVersion() {
        const ua = navigator.userAgent;
        let match;
        if (match = ua.match(/Windows NT (\d+\.\d+)/)) {
            const versions = { '10.0': '10/11', '6.3': '8.1', '6.2': '8', '6.1': '7', '6.0': 'Vista', '5.1': 'XP' };
            return versions[match[1]] || match[1];
        }
        if (match = ua.match(/Mac OS X ([\d_]+)/)) return match[1].replace(/_/g, '.');
        if (match = ua.match(/Android ([\d.]+)/)) return match[1];
        if (match = ua.match(/OS ([\d_]+)/)) return match[1].replace(/_/g, '.');
        return 'N/A';
    }

    function detectArchitecture() {
        const ua = navigator.userAgent;
        if (ua.includes('x86_64') || ua.includes('x64') || ua.includes('Win64') || ua.includes('WOW64') || ua.includes('amd64')) return 'x86-64 (64-bit)';
        if (ua.includes('aarch64') || ua.includes('arm64')) return 'ARM64';
        if (ua.includes('arm')) return 'ARM';
        if (ua.includes('x86') || ua.includes('i386') || ua.includes('i686')) return 'x86 (32-bit)';
        return 'N/A';
    }

    function detectDeviceType() {
        const ua = navigator.userAgent;
        if (/iPad|Tablet/i.test(ua)) return 'Планшет';
        if (/Mobi|Android.*Mobile|iPhone|iPod/i.test(ua)) return 'Мобильный';
        return 'Десктоп';
    }

    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return Math.abs(hash).toString(16).padStart(8, '0');
    }

    function renderData(data) {
        const grid = document.getElementById('grid');
        const nav = document.getElementById('categoriesNav');
        grid.innerHTML = '';
        nav.innerHTML = '';

        // Category buttons
        const allBtn = document.createElement('button');
        allBtn.className = 'cat-btn active';
        allBtn.textContent = 'Все';
        allBtn.onclick = () => filterCategory('all', allBtn);
        nav.appendChild(allBtn);

        Object.entries(data).forEach(([category, catData], index) => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.textContent = category;
            btn.onclick = () => filterCategory(category, btn);
            nav.appendChild(btn);

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.category = category;
            card.style.animationDelay = `${index * 0.05}s`;

            const itemCount = Object.keys(catData.items).length;

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-icon">${getIcon(catData.icon)}</div>
                    <div class="card-title">${category}</div>
                    <div class="card-count">${itemCount}</div>
                </div>
                <div class="card-content">
                    ${Object.entries(catData.items).map(([key, value]) => `
                        <div class="info-row">
                            <span class="info-label">${key}</span>
                            <span class="info-value ${typeof value === 'string' && value.length > 50 ? 'mono' : ''}">${formatValue(key, value)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            grid.appendChild(card);
        });

        // Update stats
        document.getElementById('totalParams').textContent = totalParamCount;
        document.getElementById('totalCategories').textContent = Object.keys(data).length;
    }

    function formatValue(key, value) {
        if (typeof value === 'boolean') return value ? '<span class="badge badge-success">Да</span>' : '<span class="badge badge-error">Нет</span>';
        if (value === 'Да' || value === 'Доступно' || value === 'Поддерживается' || value === 'Включены' || value === 'Онлайн') return `<span class="badge badge-success">${value}</span>`;
        if (value === 'Нет' || value === 'Недоступно' || value === 'Не поддерживается' || value === 'Выключены' || value === 'Оффлайн') return `<span class="badge badge-error">${value}</span>`;
        if (value === 'N/A' || value === 'Не установлено') return `<span class="badge badge-warning">${value}</span>`;
        if (value === 'granted') return `<span class="badge badge-success">${value}</span>`;
        if (value === 'denied') return `<span class="badge badge-error">${value}</span>`;
        if (value === 'prompt') return `<span class="badge badge-info">${value}</span>`;
        if (typeof value === 'string' && value.length > 80) return `<span title="${value.replace(/"/g, '&quot;')}">${value.substring(0, 80)}...</span>`;
        return String(value);
    }

    function filterCategory(category, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.card').forEach(card => {
            if (category === 'all' || card.dataset.category === category) {
                card.classList.remove('section-hidden');
            } else {
                card.classList.add('section-hidden');
            }
        });
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const rows = card.querySelectorAll('.info-row');
            let hasMatch = false;
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                if (text.includes(query)) {
                    row.style.display = '';
                    hasMatch = true;
                } else {
                    row.style.display = query ? 'none' : '';
                }
            });
            if (!query) {
                card.classList.remove('section-hidden');
                rows.forEach(row => row.style.display = '');
            } else if (!hasMatch) {
                card.classList.add('section-hidden');
            } else {
                card.classList.remove('section-hidden');
            }
        });
    });

    // Export
    function exportData() {
        const json = JSON.stringify(allData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `device-inspector-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

        try {
            // Формирование контекста из собранных данных устройства
            let contextData = 'Информация об устройстве пользователя:\n\n';
            Object.entries(allData).forEach(([category, catData]) => {
                contextData += `## ${category}\n`;
                Object.entries(catData.items).forEach(([key, value]) => {
                    contextData += `- ${key}: ${value}\n`;
                });
                contextData += '\n';
            });

            const systemPrompt = `Ты — AI ассистент, который помогает пользователю разобраться в информации о его устройстве. Ты имеешь доступ к полному отчёту об устройстве пользователя. Отвечай на русском языке, кратко и по делу. Если вопрос не связан с устройством, всё равно попробуй помочь.

${contextData}`;

            const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'mistral-small-latest',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: text }
                    ],
                    temperature: 0.7,
                    max_tokens: 1024
                })
            });

            loadingDiv.remove();

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                addMessage(`Ошибка: ${err.message || 'Неверный запрос или превышен лимит'}`, 'bot');
                return;
            }

            const result = await response.json();
            const reply = result.choices[0].message.content;
            addMessage(reply, 'bot');
        } catch(e) {
            loadingDiv.remove();
            addMessage(`Ошибка подключения: ${e.message}`, 'bot');
        }
    }

    function addMessage(text, type) {
        const messages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `chat-msg ${type}`;
        
        if (type === 'bot' && typeof marked !== 'undefined') {
            // Рендерим Markdown для ответов бота
            div.innerHTML = marked.parse(text);
        } else {
            // Для пользовательских сообщений просто текст (безопасность от XSS)
            div.textContent = text;
        }
        
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // Init
    async function init() {
        const { data, elapsed } = await collectAllData();
        allData = data;
        renderData(data);
        document.getElementById('scanTime').textContent = elapsed + 'ms';
    }

    init();
    </script>
</body>
</html>
