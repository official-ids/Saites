<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.0/index.css" />
<style>
/* ============================================================
   THEME VARIABLES
   ============================================================ */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --surface-3: #f0f0f2;
  --surface-4: #e8e8ec;
  --border: #e5e5e7;
  --border-strong: #d4d4d7;
  --text: #0a0a0b;
  --text-2: #4a4a4f;
  --text-3: #8a8a90;
  --accent: #0a0a0b;
  --accent-fg: #ffffff;
  --btn-num: #ffffff;
  --btn-num-hover: #f5f5f7;
  --btn-op: #f0f0f2;
  --btn-op-hover: #e5e5e7;
  --btn-fn: #e8e8ec;
  --btn-fn-hover: #dcdce0;
  --btn-eq: #0a0a0b;
  --btn-eq-fg: #ffffff;
  --btn-eq-hover: #2a2a2e;
  --danger: #c0392b;
  --success: #1e7a46;
  --shadow-sm: 0 1px 2px rgba(10,10,11,0.04);
  --shadow: 0 2px 8px rgba(10,10,11,0.06), 0 1px 2px rgba(10,10,11,0.04);
  --shadow-lg: 0 12px 32px rgba(10,10,11,0.08), 0 4px 12px rgba(10,10,11,0.04);
  --shadow-xl: 0 24px 64px rgba(10,10,11,0.12);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 280ms cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #0a0a0b;
  --surface: #141416;
  --surface-2: #1a1a1d;
  --surface-3: #222226;
  --surface-4: #2a2a2e;
  --border: #2a2a2e;
  --border-strong: #3a3a3e;
  --text: #f5f5f7;
  --text-2: #b5b5ba;
  --text-3: #75757a;
  --accent: #f5f5f7;
  --accent-fg: #0a0a0b;
  --btn-num: #1e1e22;
  --btn-num-hover: #28282d;
  --btn-op: #222226;
  --btn-op-hover: #2a2a2e;
  --btn-fn: #28282d;
  --btn-fn-hover: #323238;
  --btn-eq: #f5f5f7;
  --btn-eq-fg: #0a0a0b;
  --btn-eq-hover: #e5e5e7;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
  --shadow-xl: 0 24px 64px rgba(0,0,0,0.6);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ============================================================
   APP LAYOUT
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: 56px 1fr;
  height: 100vh;
  width: 100vw;
}

/* ============================================================
   TOOLBAR
   ============================================================ */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  padding-right: 20px;
  border-right: 1px solid var(--border);
  margin-right: 8px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  display: grid; place-items: center;
  font-size: 13px; font-weight: 800;
  font-family: var(--mono);
}
.mode-tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-3);
  padding: 3px;
  border-radius: var(--radius);
}
.mode-tab {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  border-radius: var(--radius-sm);
  transition: all var(--transition);
}
.mode-tab:hover { color: var(--text); }
.mode-tab.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.toolbar-spacer { flex: 1; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  transition: all var(--transition);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(0.97); }
.btn-icon { padding: 7px; width: 32px; height: 32px; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main {
  display: grid;
  grid-template-columns: 1fr 340px;
  overflow: hidden;
}
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .history-panel { display: none; }
  .history-panel.open {
    display: flex;
    position: fixed;
    inset: 56px 0 0 0;
    z-index: 50;
    background: var(--surface);
  }
}

/* ============================================================
   CALCULATOR
   ============================================================ */
.calc-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
}
.calc {
  width: min(440px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Display */
.display {
  padding: 28px 24px 20px;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.display-memory {
  position: absolute;
  top: 14px;
  left: 24px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity var(--transition);
}
.display-memory.active { opacity: 1; }
.display-mode {
  position: absolute;
  top: 14px;
  right: 24px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.display-expr {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--text-3);
  text-align: right;
  min-height: 20px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 8px;
  direction: rtl;
}
.display-result {
  font-family: var(--mono);
  font-size: 48px;
  font-weight: 600;
  color: var(--text);
  text-align: right;
  letter-spacing: -0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.1;
  transition: font-size var(--transition);
}
.display-result.small { font-size: 36px; }
.display-result.tiny { font-size: 28px; }
.display-result.error { color: var(--danger); font-size: 24px; }

/* Buttons */
.buttons {
  padding: 12px;
  display: grid;
  gap: 8px;
}
.buttons.standard {
  grid-template-columns: repeat(4, 1fr);
}
.buttons.scientific {
  grid-template-columns: repeat(5, 1fr);
}
.btn-calc {
  height: 56px;
  border-radius: var(--radius);
  font-size: 17px;
  font-weight: 500;
  font-family: var(--font);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.btn-calc:hover { transform: translateY(-1px); }
.btn-calc:active { transform: translateY(0) scale(0.97); }
.btn-calc.num {
  background: var(--btn-num);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}
.btn-calc.num:hover { background: var(--btn-num-hover); }
.btn-calc.op {
  background: var(--btn-op);
  color: var(--text);
  font-weight: 600;
}
.btn-calc.op:hover { background: var(--btn-op-hover); }
.btn-calc.fn {
  background: var(--btn-fn);
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
}
.btn-calc.fn:hover { background: var(--btn-fn-hover); }
.btn-calc.eq {
  background: var(--btn-eq);
  color: var(--btn-eq-fg);
  font-weight: 600;
  font-size: 20px;
}
.btn-calc.eq:hover { background: var(--btn-eq-hover); }
.btn-calc.danger {
  color: var(--danger);
  font-weight: 600;
}
.btn-calc.pressed {
  background: var(--accent);
  color: var(--accent-fg);
}
.btn-calc sup {
  font-size: 10px;
  vertical-align: super;
  margin-left: 1px;
}

/* ============================================================
   HISTORY PANEL
   ============================================================ */
.history-panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.history-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.history-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.history-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.history-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
}
.history-item {
  padding: 12px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--transition);
  margin-bottom: 4px;
}
.history-item:hover { background: var(--surface-3); }
.history-expr {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-result {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-time {
  font-size: 10px;
  color: var(--text-3);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,11,0.5);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-slow);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  width: min(440px, 92vw);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.96);
  transition: transform var(--transition-slow);
  overflow: hidden;
}
.modal-overlay.open .modal { transform: scale(1); }
.modal-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Settings */
.settings-group {
  margin-bottom: 20px;
}
.settings-group-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}
.setting-label { font-size: 13px; color: var(--text); }
.setting-desc { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.toggle {
  position: relative;
  width: 36px; height: 20px;
  background: var(--border-strong);
  border-radius: 10px;
  cursor: pointer;
  transition: background var(--transition);
}
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: var(--surface);
  border-radius: 50%;
  transition: transform var(--transition);
  box-shadow: var(--shadow-sm);
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); }
select.setting-select {
  padding: 6px 10px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-stack {
  position: fixed;
  top: 72px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  box-shadow: var(--shadow-lg);
  min-width: 220px;
  max-width: 320px;
  display: flex;
  align-items: center;
  gap: 10px;
  transform: translateX(120%);
  opacity: 0;
  transition: all var(--transition-slow);
  pointer-events: auto;
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.toast.info .toast-dot { background: var(--text); }
.toast.success .toast-dot { background: var(--success); }
.toast.error .toast-dot { background: var(--danger); }
.toast-content { flex: 1; font-size: 12px; }
.toast-title { font-weight: 600; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 600px) {
  .toolbar { padding: 0 12px; gap: 8px; }
  .brand { padding-right: 10px; margin-right: 4px; font-size: 13px; }
  .mode-tab { padding: 6px 10px; font-size: 11px; }
  .btn-calc { height: 50px; font-size: 16px; }
  .display-result { font-size: 40px; }
  .calc-wrap { padding: 12px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- TOOLBAR -->
  <header class="toolbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <span>Calculator Studio</span>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="standard">Стандартный</button>
      <button class="mode-tab" data-mode="scientific">Научный</button>
    </div>

    <div class="toolbar-spacer"></div>

    <button class="btn btn-icon" id="btnHistory" title="История">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
    </button>
    <button class="btn btn-icon" id="btnTheme" title="Тема">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <button class="btn btn-icon" id="btnSettings" title="Настройки">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- MAIN -->
  <div class="main">
    <div class="calc-wrap">
      <div class="calc">
        <div class="display">
          <div class="display-memory" id="displayMemory">M</div>
          <div class="display-mode" id="displayMode">Стандартный</div>
          <div class="display-expr" id="displayExpr">&nbsp;</div>
          <div class="display-result" id="displayResult">0</div>
        </div>
        <div class="buttons standard" id="buttons"></div>
      </div>
    </div>

    <aside class="history-panel" id="historyPanel">
      <div class="history-head">
        <div class="history-title">История вычислений</div>
        <button class="btn btn-icon" id="btnClearHistory" title="Очистить">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
      <div class="history-body" id="historyBody">
        <div class="history-empty">История пуста</div>
      </div>
    </aside>
  </div>
</div>

<!-- Toast stack -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<!-- Modal root -->
<div id="modalRoot"></div>

<script>
/* ============================================================
   CALCULATOR STUDIO — CORE
   ============================================================ */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY = 'calculator_studio_v1';

const state = {
  theme: 'light',
  mode: 'standard',
  current: '0',
  expression: '',
  memory: 0,
  hasMemory: false,
  history: [],
  justEvaluated: false,
  settings: {
    sound: true,
    haptics: true,
    precision: 10,
    thousandsSep: true,
    angleUnit: 'deg'
  }
};

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      theme: state.theme,
      mode: state.mode,
      memory: state.memory,
      hasMemory: state.hasMemory,
      history: state.history,
      settings: state.settings
    }));
  } catch (e) { console.warn('Save failed', e); }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.theme = data.theme || 'light';
    state.mode = data.mode || 'standard';
    state.memory = data.memory || 0;
    state.hasMemory = data.hasMemory || false;
    state.history = data.history || [];
    state.settings = { ...state.settings, ...(data.settings || {}) };
    return true;
  } catch (e) { return false; }
}

/* ============================================================
   EXPRESSION PARSER (без eval)
   ============================================================ ============================================================ */
class ExpressionParser {
  constructor(input, angleUnit = 'deg') {
    this.input = input.replace(/\s+/g, '');
    this.pos = 0;
    this.angleUnit = angleUnit;
  }

  parse() {
    const result = this.parseExpression();
    if (this.pos < this.input.length) {
      throw new Error('Unexpected character: ' + this.input[this.pos]);
    }
    return result;
  }

  parseExpression() {
    let left = this.parseTerm();
    while (this.pos < this.input.length) {
      const ch = this.input[this.pos];
      if (ch === '+' || ch === '-') {
        this.pos++;
        const right = this.parseTerm();
        left = ch === '+' ? left + right : left - right;
      } else break;
    }
    return left;
  }

  parseTerm() {
    let left = this.parsePower();
    while (this.pos < this.input.length) {
      const ch = this.input[this.pos];
      if (ch === '*' || ch === '/' || ch === '×' || ch === '÷') {
        this.pos++;
        const right = this.parsePower();
        if ((ch === '/' || ch === '÷') && right === 0) throw new Error('Division by zero');
        left = (ch === '*' || ch === '×') ? left * right : left / right;
      } else break;
    }
    return left;
  }

  parsePower() {
    let base = this.parseUnary();
    if (this.pos < this.input.length && this.input[this.pos] === '^') {
      this.pos++;
      const exp = this.parseUnary();
      base = Math.pow(base, exp);
    }
    return base;
  }

  parseUnary() {
    if (this.input[this.pos] === '-') {
      this.pos++;
      return -this.parsePostfix();
    }
    if (this.input[this.pos] === '+') {
      this.pos++;
    }
    return this.parsePostfix();
  }

  parsePostfix() {
    let value = this.parsePrimary();
    while (this.pos < this.input.length) {
      const ch = this.input[this.pos];
      if (ch === '%') {
        this.pos++;
        value = value / 100;
      } else if (ch === '!') {
        this.pos++;
        value = this.factorial(value);
      } else break;
    }
    return value;
  }

  parsePrimary() {
    // Число
    if (/[0-9.]/.test(this.input[this.pos])) {
      return this.parseNumber();
    }
    // Скобки
    if (this.input[this.pos] === '(') {
      this.pos++;
      const value = this.parseExpression();
      if (this.input[this.pos] !== ')') throw new Error('Missing closing parenthesis');
      this.pos++;
      return value;
    }
    // Константы и функции
    if (this.input.substr(this.pos, 2) === 'pi' || this.input.substr(this.pos, 1) === 'π') {
      this.pos += this.input[this.pos] === 'π' ? 1 : 2;
      return Math.PI;
    }
    if (this.input.substr(this.pos, 1) === 'e' && !/[a-z]/i.test(this.input[this.pos + 1] || '')) {
      this.pos++;
      return Math.E;
    }
    // Функции
    const funcs = ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh', 'sqrt', 'cbrt', 'log', 'ln', 'exp', 'abs', 'floor', 'ceil', 'round'];
    for (const fn of funcs) {
      if (this.input.substr(this.pos, fn.length) === fn) {
        this.pos += fn.length;
        if (this.input[this.pos] !== '(') throw new Error('Expected ( after ' + fn);
        this.pos++;
        const arg = this.parseExpression();
        if (this.input[this.pos] !== ')') throw new Error('Missing closing parenthesis');
        this.pos++;
        return this.applyFunction(fn, arg);
      }
    }
    throw new Error('Unexpected token at position ' + this.pos);
  }

  parseNumber() {
    let numStr = '';
    while (this.pos < this.input.length && /[0-9.]/.test(this.input[this.pos])) {
      numStr += this.input[this.pos++];
    }
    const num = parseFloat(numStr);
    if (isNaN(num)) throw new Error('Invalid number');
    return num;
  }

  applyFunction(fn, arg) {
    const toRad = this.angleUnit === 'deg' ? Math.PI / 180 : 1;
    const fromRad = this.angleUnit === 'deg' ? 180 / Math.PI : 1;
    switch (fn) {
      case 'sin': return Math.sin(arg * toRad);
      case 'cos': return Math.cos(arg * toRad);
      case 'tan': return Math.tan(arg * toRad);
      case 'asin': return Math.asin(arg) * fromRad;
      case 'acos': return Math.acos(arg) * fromRad;
      case 'atan': return Math.atan(arg) * fromRad;
      case 'sinh': return Math.sinh(arg);
      case 'cosh': return Math.cosh(arg);
      case 'tanh': return Math.tanh(arg);
      case 'sqrt': return Math.sqrt(arg);
      case 'cbrt': return Math.cbrt(arg);
      case 'log': return Math.log10(arg);
      case 'ln': return Math.log(arg);
      case 'exp': return Math.exp(arg);
      case 'abs': return Math.abs(arg);
      case 'floor': return Math.floor(arg);
      case 'ceil': return Math.ceil(arg);
      case 'round': return Math.round(arg);
      default: throw new Error('Unknown function: ' + fn);
    }
  }

  factorial(n) {
    if (n < 0 || !Number.isInteger(n)) throw new Error('Factorial requires non-negative integer');
    if (n > 170) throw new Error('Number too large');
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    return result;
  }
}

function evaluate(expr, angleUnit = 'deg') {
  if (!expr || !expr.trim()) return 0;
  try {
    const parser = new ExpressionParser(expr, angleUnit);
    const result = parser.parse();
    if (!isFinite(result)) throw new Error('Result is not finite');
    return result;
  } catch (e) {
    throw e;
  }
}

/* ============================================================
   NUMBER FORMATTING
   ============================================================ */
function formatNumber(n, precision = 10, thousandsSep = true) {
  if (typeof n !== 'number' || !isFinite(n)) return String(n);
  
  // Округление до precision знаков
  const rounded = parseFloat(n.toPrecision(precision));
  
  // Если очень большое или очень маленькое — экспоненциальная запись
  if (Math.abs(rounded) >= 1e15 || (Math.abs(rounded) < 1e-6 && rounded !== 0)) {
    return rounded.toExponential(precision - 1);
  }
  
  let str = String(rounded);
  
  if (thousandsSep) {
    const parts = str.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    str = parts.join('.');
  }
  
  return str;
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(type, title, duration = 2500) {
  const stack = $('#toastStack');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<div class="toast-dot"></div><div class="toast-content"><div class="toast-title">${escapeHtml(title)}</div></div>`;
  stack.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ============================================================
   MODAL
   ============================================================ */
function modal({ title, body, footer }) {
  const root = $('#modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${escapeHtml(title)}</div>
        <button class="btn btn-icon" data-close>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body"></div>
      ${footer ? '<div class="modal-foot"></div>' : ''}
    </div>`;
  const bodyEl = overlay.querySelector('.modal-body');
  if (typeof body === 'string') bodyEl.innerHTML = body;
  else bodyEl.appendChild(body);
  if (footer) {
    const footEl = overlay.querySelector('.modal-foot');
    if (typeof footer === 'string') footEl.innerHTML = footer;
    else footEl.appendChild(footer);
  }
  root.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
  const close = () => {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 300);
  };
  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  return { overlay, close, body: bodyEl, foot: overlay.querySelector('.modal-foot') };
}

/* ============================================================
   CALCULATOR LOGIC
   ============================================================ */
let pendingOp = null;
let pendingValue = null;
let buildingExpression = '';

function resetState() {
  state.current = '0';
  state.expression = '';
  pendingOp = null;
  pendingValue = null;
  buildingExpression = '';
  state.justEvaluated = false;
}

function inputDigit(d) {
  if (state.justEvaluated) {
    state.current = d;
    state.expression = '';
    state.justEvaluated = false;
    pendingOp = null;
    pendingValue = null;
  } else if (state.current === '0' || state.current === 'Ошибка') {
    state.current = d;
  } else {
    state.current = state.current + d;
  }
  updateDisplay();
}

function inputDot() {
  const sep = '.';
  if (state.justEvaluated) {
    state.current = '0' + sep;
    state.expression = '';
    state.justEvaluated = false;
    pendingOp = null;
    pendingValue = null;
  } else if (!state.current.includes(sep)) {
    state.current = state.current + sep;
  }
  updateDisplay();
}

function inputOp(op) {
  const currentNum = parseFloat(state.current);
  
  if (state.justEvaluated) {
    // Продолжаем вычисления с результатом
    pendingValue = currentNum;
    pendingOp = op;
    state.expression = formatNumber(currentNum, state.settings.precision, state.settings.thousandsSep) + ' ' + opSymbol(op);
    state.justEvaluated = false;
    state.current = '0';
  } else if (pendingOp !== null && pendingValue !== null) {
    // Выполняем предыдущую операцию
    try {
      const result = compute(pendingValue, currentNum, pendingOp);
      state.current = formatNumber(result, state.settings.precision, false);
      pendingValue = result;
      state.expression = formatNumber(result, state.settings.precision, state.settings.thousandsSep) + ' ' + opSymbol(op);
    } catch (e) {
      showError(e.message);
      return;
    }
    pendingOp = op;
  } else {
    pendingValue = currentNum;
    pendingOp = op;
    state.expression = formatNumber(currentNum, state.settings.precision, state.settings.thousandsSep) + ' ' + opSymbol(op);
    state.current = '0';
  }
  updateDisplay();
}

function opSymbol(op) {
  return { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' }[op] || op;
}

function compute(a, b, op) {
  switch (op) {
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/':
      if (b === 0) throw new Error('Деление на ноль');
      return a / b;
    case '^': return Math.pow(a, b);
    default: throw new Error('Unknown op');
  }
}

function doEquals() {
  const currentNum = parseFloat(state.current);
  
  if (pendingOp !== null && pendingValue !== null) {
    try {
      const result = compute(pendingValue, currentNum, pendingOp);
      const fullExpr = formatNumber(pendingValue, state.settings.precision, state.settings.thousandsSep) + ' ' + opSymbol(pendingOp) + ' ' + formatNumber(currentNum, state.settings.precision, state.settings.thousandsSep);
      
      addToHistory(fullExpr, result);
      
      state.current = formatNumber(result, state.settings.precision, false);
      state.expression = fullExpr + ' =';
      pendingOp = null;
      pendingValue = null;
      state.justEvaluated = true;
    } catch (e) {
      showError(e.message);
      return;
    }
  } else if (state.expression && !state.justEvaluated) {
    // Парсим полное выражение
    try {
      const result = evaluate(state.expression.replace(/=$/, ''), state.settings.angleUnit);
      addToHistory(state.expression.replace(/=$/, ''), result);
      state.current = formatNumber(result, state.settings.precision, false);
      state.expression = state.expression + ' =';
      state.justEvaluated = true;
    } catch (e) {
      showError(e.message);
      return;
    }
  }
  updateDisplay();
}

function doClear() {
  resetState();
  updateDisplay();
}

function doCE() {
  state.current = '0';
  updateDisplay();
}

function doBackspace() {
  if (state.justEvaluated) return;
  if (state.current.length <= 1 || (state.current.length === 2 && state.current[0] === '-')) {
    state.current = '0';
  } else {
    state.current = state.current.slice(0, -1);
  }
  updateDisplay();
}

function doNegate() {
  if (state.current === '0' || state.current === 'Ошибка') return;
  if (state.current.startsWith('-')) {
    state.current = state.current.slice(1);
  } else {
    state.current = '-' + state.current;
  }
  updateDisplay();
}

function doPercent() {
  const currentNum = parseFloat(state.current);
  if (pendingValue !== null) {
    state.current = formatNumber(pendingValue * currentNum / 100, state.settings.precision, false);
  } else {
    state.current = formatNumber(currentNum / 100, state.settings.precision, false);
  }
  updateDisplay();
}

function doSquare() {
  const n = parseFloat(state.current);
  const result = n * n;
  state.expression = `sqr(${formatNumber(n, state.settings.precision, state.settings.thousandsSep)})`;
  state.current = formatNumber(result, state.settings.precision, false);
  state.justEvaluated = true;
  addToHistory(state.expression, result);
  updateDisplay();
}

function doSqrt() {
  const n = parseFloat(state.current);
  if (n < 0) { showError('Отрицательное число'); return; }
  const result = Math.sqrt(n);
  state.expression = `√(${formatNumber(n, state.settings.precision, state.settings.thousandsSep)})`;
  state.current = formatNumber(result, state.settings.precision, false);
  state.justEvaluated = true;
  addToHistory(state.expression, result);
  updateDisplay();
}

function doReciprocal() {
  const n = parseFloat(state.current);
  if (n === 0) { showError('Деление на ноль'); return; }
  const result = 1 / n;
  state.expression = `1/(${formatNumber(n, state.settings.precision, state.settings.thousandsSep)})`;
  state.current = formatNumber(result, state.settings.precision, false);
  state.justEvaluated = true;
  addToHistory(state.expression, result);
  updateDisplay();
}

function doFactorial() {
  const n = parseFloat(state.current);
  if (n < 0 || !Number.isInteger(n) || n > 170) { showError('Недопустимое значение'); return; }
  let result = 1;
  for (let i = 2; i <= n; i++) result *= i;
  state.expression = `${formatNumber(n, state.settings.precision, state.settings.thousandsSep)}!`;
  state.current = formatNumber(result, state.settings.precision, false);
  state.justEvaluated = true;
  addToHistory(state.expression, result);
  updateDisplay();
}

function doFunc(fn) {
  const n = parseFloat(state.current);
  try {
    const result = evaluate(`${fn}(${n})`, state.settings.angleUnit);
    state.expression = `${fn}(${formatNumber(n, state.settings.precision, state.settings.thousandsSep)})`;
    state.current = formatNumber(result, state.settings.precision, false);
    state.justEvaluated = true;
    addToHistory(state.expression, result);
  } catch (e) {
    showError(e.message);
    return;
  }
  updateDisplay();
}

function doConst(c) {
  if (state.justEvaluated || state.current === '0') {
    state.current = c === 'π' ? String(Math.PI) : String(Math.E);
    state.justEvaluated = false;
  }
  updateDisplay();
}

function doParen(p) {
  // В стандартном режиме скобки не поддерживаются напрямую
  // Просто добавляем к выражению если есть
  if (p === '(') {
    buildingExpression += '(';
    state.expression = buildingExpression;
  } else if (p === ')') {
    buildingExpression += ')';
    state.expression = buildingExpression;
  }
  updateDisplay();
}

// Memory operations
function doMC() {
  state.memory = 0;
  state.hasMemory = false;
  updateDisplay();
  toast('info', 'Память очищена');
}
function doMR() {
  state.current = formatNumber(state.memory, state.settings.precision, false);
  updateDisplay();
}
function doMPlus() {
  state.memory += parseFloat(state.current);
  state.hasMemory = true;
  updateDisplay();
  toast('success', 'M+ ' + formatNumber(state.memory, state.settings.precision, true));
}
function doMMinus() {
  state.memory -= parseFloat(state.current);
  state.hasMemory = true;
  updateDisplay();
  toast('success', 'M− ' + formatNumber(state.memory, state.settings.precision, true));
}
function doMS() {
  state.memory = parseFloat(state.current);
  state.hasMemory = true;
  updateDisplay();
  toast('success', 'MS сохранено');
}

function showError(msg) {
  state.current = 'Ошибка';
  state.expression = msg;
  state.justEvaluated = true;
  pendingOp = null;
  pendingValue = null;
  updateDisplay();
}

/* ============================================================
   HISTORY
   ============================================================ */
function addToHistory(expr, result) {
  state.history.unshift({
    expr,
    result: formatNumber(result, state.settings.precision, state.settings.thousandsSep),
    rawResult: result,
    time: Date.now()
  });
  if (state.history.length > 100) state.history.length = 100;
  renderHistory();
  saveState();
}

function renderHistory() {
  const body = $('#historyBody');
  if (state.history.length === 0) {
    body.innerHTML = '<div class="history-empty">История пуста</div>';
    return;
  }
  body.innerHTML = state.history.map((h, i) => `
    <div class="history-item" data-idx="${i}">
      <div class="history-expr">${escapeHtml(h.expr)}</div>
      <div class="history-result">= ${escapeHtml(h.result)}</div>
      <div class="history-time">${formatTime(h.time)}</div>
    </div>
  `).join('');
  
  body.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      const h = state.history[idx];
      state.current = formatNumber(h.rawResult, state.settings.precision, false);
      state.expression = h.expr + ' =';
      state.justEvaluated = true;
      pendingOp = null;
      pendingValue = null;
      updateDisplay();
      toast('info', 'Результат восстановлен');
    });
  });
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function clearHistory() {
  if (state.history.length === 0) return;
  state.history = [];
  renderHistory();
  saveState();
  toast('success', 'История очищена');
}

/* ============================================================
   DISPLAY
   ============================================================ */
function updateDisplay() {
  const exprEl = $('#displayExpr');
  const resultEl = $('#displayResult');
  const memoryEl = $('#displayMemory');
  const modeEl = $('#displayMode');
  
  exprEl.innerHTML = state.expression || '&nbsp;';
  
  if (state.current === 'Ошибка') {
    resultEl.textContent = 'Ошибка';
    resultEl.className = 'display-result error';
  } else {
    const formatted = formatNumber(
      parseFloat(state.current),
      state.settings.precision,
      state.settings.thousandsSep && !state.current.includes('.') === false
    );
    // Используем оригинальное значение если это строка с точкой
    const displayValue = state.current.includes('.') || state.current === '0' 
      ? state.current.replace('.', ',')
      : formatNumber(parseFloat(state.current), state.settings.precision, state.settings.thousandsSep).replace('.', ',');
    
    resultEl.textContent = displayValue;
    resultEl.className = 'display-result';
    
    if (displayValue.length > 14) resultEl.classList.add('small');
    if (displayValue.length > 20) resultEl.classList.add('tiny');
  }
  
  memoryEl.classList.toggle('active', state.hasMemory);
  modeEl.textContent = state.mode === 'standard' ? 'Стандартный' : 'Научный';
}

/* ============================================================
   BUTTONS RENDERING
   ============================================================ */
function renderButtons() {
  const container = $('#buttons');
  const buttons = state.mode === 'standard' ? STANDARD_BUTTONS : SCIENTIFIC_BUTTONS;
  container.className = 'buttons ' + state.mode;
  container.innerHTML = '';
  
  buttons.forEach(btn => {
    if (btn.hidden) return;
    const el = document.createElement('button');
    el.className = 'btn-calc ' + btn.type;
    el.innerHTML = btn.label;
    el.dataset.action = btn.action;
    if (btn.value !== undefined) el.dataset.value = btn.value;
    el.addEventListener('click', () => handleButton(btn));
    container.appendChild(el);
  });
}

function handleButton(btn) {
  // Визуальная обратная связь
  if (state.settings.haptics && navigator.vibrate) {
    navigator.vibrate(10);
  }
  
  switch (btn.action) {
    case 'digit': inputDigit(btn.value); break;
    case 'dot': inputDot(); break;
    case 'op': inputOp(btn.value); break;
    case 'equals': doEquals(); break;
    case 'clear': doClear(); break;
    case 'ce': doCE(); break;
    case 'backspace': doBackspace(); break;
    case 'negate': doNegate(); break;
    case 'percent': doPercent(); break;
    case 'square': doSquare(); break;
    case 'sqrt': doSqrt(); break;
    case 'reciprocal': doReciprocal(); break;
    case 'factorial': doFactorial(); break;
    case 'func': doFunc(btn.value); break;
    case 'const': doConst(btn.value); break;
    case 'paren': doParen(btn.value); break;
    case 'mc': doMC(); break;
    case 'mr': doMR(); break;
    case 'mplus': doMPlus(); break;
    case 'mminus': doMMinus(); break;
    case 'ms': doMS(); break;
  }
}

/* ============================================================
   KEYBOARD
   ============================================================ */
function handleKeyboard(e) {
  const key = e.key;
  
  if (/^[0-9]$/.test(key)) {
    e.preventDefault();
    inputDigit(key);
  } else if (key === ',' || key === '.') {
    e.preventDefault();
    inputDot();
  } else if (key === '+' || key === '-' || key === '*' || key === '/') {
    e.preventDefault();
    inputOp(key);
  } else if (key === 'Enter' || key === '=') {
    e.preventDefault();
    doEquals();
  } else if (key === 'Backspace') {
    e.preventDefault();
    doBackspace();
  } else if (key === 'Escape') {
    e.preventDefault();
    doClear();
  } else if (key === 'Delete') {
    e.preventDefault();
    doCE();
  } else if (key === '%') {
    e.preventDefault();
    doPercent();
  } else if (key === '^') {
    e.preventDefault();
    inputOp('^');
  }
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const icon = $('#themeIcon');
  if (theme === 'dark') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  }
  saveState();
}

/* ============================================================
   SETTINGS MODAL
   ============================================================ */
function showSettingsModal() {
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="settings-group">
      <div class="settings-group-title">Внешний вид</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Тема</div>
          <div class="setting-desc">Светлая или тёмная тема интерфейса</div>
        </div>
        <select class="setting-select" id="setTheme">
          <option value="light"${state.theme === 'light' ? ' selected' : ''}>Светлая</option>
          <option value="dark"${state.theme === 'dark' ? ' selected' : ''}>Тёмная</option>
        </select>
      </div>
    </div>
    
    <div class="settings-group">
      <div class="settings-group-title">Вычисления</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Точность</div>
          <div class="setting-desc">Количество значащих цифр</div>
        </div>
        <select class="setting-select" id="setPrecision">
          <option value="6"${state.settings.precision === 6 ? ' selected' : ''}>6</option>
          <option value="8"${state.settings.precision === 8 ? ' selected' : ''}>8</option>
          <option value="10"${state.settings.precision === 10 ? ' selected' : ''}>10</option>
          <option value="12"${state.settings.precision === 12 ? ' selected' : ''}>12</option>
          <option value="14"${state.settings.precision === 14 ? ' selected' : ''}>14</option>
        </select>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Единицы углов</div>
          <div class="setting-desc">Для тригонометрических функций</div>
        </div>
        <select class="setting-select" id="setAngle">
          <option value="deg"${state.settings.angleUnit === 'deg' ? ' selected' : ''}>Градусы</option>
          <option value="rad"${state.settings.angleUnit === 'rad' ? ' selected' : ''}>Радианы</option>
        </select>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Разделитель тысяч</div>
          <div class="setting-desc">Пробел между разрядами</div>
        </div>
        <div class="toggle ${state.settings.thousandsSep ? 'on' : ''}" id="setThousands"></div>
      </div>
    </div>
    
    <div class="settings-group">
      <div class="settings-group-title">Обратная связь</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Вибрация</div>
          <div class="setting-desc">Тактильный отклик на мобильных</div>
        </div>
        <div class="toggle ${state.settings.haptics ? 'on' : ''}" id="setHaptics"></div>
      </div>
    </div>
    
    <div class="settings-group">
      <div class="settings-group-title">Данные</div>
      <div style="display:flex; gap:8px; flex-direction:column">
        <button class="btn" id="btnExportHistory" style="justify-content:flex-start">Экспорт истории (JSON)</button>
        <button class="btn btn-danger" id="btnResetAll" style="justify-content:flex-start">Сбросить все данные</button>
      </div>
    </div>`;
  
  const m = modal({ title: 'Настройки', body });
  
  m.body.querySelector('#setTheme').addEventListener('change', e => {
    applyTheme(e.target.value);
  });
  m.body.querySelector('#setPrecision').addEventListener('change', e => {
    state.settings.precision = parseInt(e.target.value);
    saveState();
    updateDisplay();
  });
  m.body.querySelector('#setAngle').addEventListener('change', e => {
    state.settings.angleUnit = e.target.value;
    saveState();
  });
  m.body.querySelector('#setThousands').addEventListener('click', e => {
    state.settings.thousandsSep = !state.settings.thousandsSep;
    e.currentTarget.classList.toggle('on', state.settings.thousandsSep);
    saveState();
    updateDisplay();
  });
  m.body.querySelector('#setHaptics').addEventListener('click', e => {

    e.currentTarget.classList.toggle('on', state.settings.haptics);
    saveState();
  });
  m.body.querySelector('#btnExportHistory').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state.history, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'calculator-history.json';

}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  applyTheme(state.theme);
  renderButtons();
  renderHistory();
  updateDisplay();
  
  // Mode tabs
  $$('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.mode = tab.dataset.mode;
      resetState();
      renderButtons();
      updateDisplay();
      saveState();
    });
  });
  
  // Set initial active mode tab
  $$('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === state.mode);
  });
  
  // Toolbar buttons
  $('#btnTheme').addEventListener('click', () => {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark');
  });
  $('#btnSettings').addEventListener('click', showSettingsModal);
  $('#btnHistory').addEventListener('click', () => {
    const panel = $('#historyPanel');
    panel.classList.toggle('open');
  });
  $('#btnClearHistory').addEventListener('click', clearHistory);
  
  // Keyboard
  document.addEventListener('keydown', handleKeyboard);
  
  // Prevent zoom on double-tap for mobile
  document.addEventListener('dblclick', e => {
    if (e.target.closest('.btn-calc')) e.preventDefault();
  });
}

init();

// Autosave
setInterval(saveState, 10000);
window.addEventListener('beforeunload', saveState);
</script>
</body>
