<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доброе утро ☀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/comfortaa@latest/cyrillic-700.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/comfortaa@latest/cyrillic-400.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Comfortaa', system-ui, sans-serif;
  }

  body {
    background: linear-gradient(180deg,
      #1a1a3e 0%,
      #3d2a5e 15%,
      #7a3b6e 30%,
      #c85a6e 48%,
      #f09060 65%,
      #ffc98a 82%,
      #fff2c8 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Звёзды, которые постепенно исчезают */
  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    animation: starsFade 6s ease-out 2s forwards;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 4px #fff;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @keyframes starsFade {
    to { opacity: 0; }
  }

  /* Облака */
  .clouds {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 100px;
    filter: blur(2px);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before {
    width: 60%;
    height: 140%;
    top: -50%;
    left: 15%;
  }
  .cloud::after {
    width: 45%;
    height: 120%;
    top: -40%;
    right: 15%;
  }
  @keyframes drift {
    from { transform: translateX(-200px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* Солнце */
  .sun-wrap {
    position: absolute;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
    width: 260px;
    height: 260px;
    animation: sunRise 4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0;
  }
  @keyframes sunRise {
    0% { transform: translateX(-50%) translateY(120px) scale(0.7); opacity: 0; }
    100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  }

  .sun {
    width: 100%;
    height: 100%;
    position: relative;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { filter: drop-shadow(0 0 40px rgba(255, 200, 100, 0.7)); }
    50% { filter: drop-shadow(0 0 70px rgba(255, 220, 140, 0.95)); }
  }

  .sun-core {
    position: absolute;
    inset: 25%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      #fff8d6 0%,
      #ffe07a 30%,
      #ffb347 70%,
      #ff8a3d 100%);
    box-shadow: inset -10px -15px 30px rgba(200, 80, 40, 0.4);
  }

  .sun-rays {
    position: absolute;
    inset: 0;
    animation: rotate 30s linear infinite;
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }
  .sun-rays svg { width: 100%; height: 100%; }

  .sun-glow {
    position: absolute;
    inset: -40%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 200, 100, 0.4) 0%,
      rgba(255, 150, 80, 0.15) 40%,
      transparent 70%);
    animation: glowPulse 5s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  /* Горизонт */
  .horizon {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(80, 40, 60, 0.3) 40%,
      rgba(40, 20, 40, 0.6) 100%);
    pointer-events: none;
  }
.hills {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 25%;
  min-width: 100vw;
}

  /* Контент */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem;
    margin-bottom: 10vh;
  }

  .greeting {
    font-size: clamp(3rem, 9vw, 6.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #ffe8b8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 30px rgba(255, 180, 100, 0.3);
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
  }

  .sub {
    margin-top: 1.2rem;
    font-size: clamp(1rem, 2.2vw, 1.4rem);
    font-weight: 400;
    color: rgba(255, 240, 220, 0.9);
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
  }

  .date {
    margin-top: 2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 1.5rem;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 100px;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.95);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.4s forwards;
  }
  .date .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffd27a;
    box-shadow: 0 0 10px #ffd27a;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Птицы */
  .birds {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bird {
    position: absolute;
    font-size: 1.5rem;
    color: rgba(60, 30, 50, 0.6);
    animation: fly linear infinite;
  }
  @keyframes fly {
    0% { transform: translateX(-50px) translateY(0); }
    25% { transform: translateX(25vw) translateY(-15px); }
    50% { transform: translateX(50vw) translateY(5px); }
    75% { transform: translateX(75vw) translateY(-10px); }
    100% { transform: translateX(105vw) translateY(0); }
  }
  .bird svg { width: 28px; height: 28px; }
  .bird svg path {
    animation: flap 0.6s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes flap {
    0%, 100% { d: path("M2 10 Q 8 4, 14 10 Q 20 4, 26 10"); }
    50% { d: path("M2 10 Q 8 14, 14 10 Q 20 14, 26 10"); }
  }

  /* Частицы света */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px #fff;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
  }

  @media (max-width: 600px) {
    .sun-wrap { width: 180px; height: 180px; bottom: 18%; }
    .content { margin-bottom: 5vh; }
  }
</style>
</head>
<body>

  <!-- Звёзды -->
  <div class="stars" id="stars"></div>

  <!-- Облака -->
  <div class="clouds" id="clouds"></div>

  <!-- Птицы -->
  <div class="birds" id="birds"></div>

  <!-- Частицы -->
  <div class="particles" id="particles"></div>

  <!-- Солнце -->
  <div class="sun-wrap">
    <div class="sun">
      <div class="sun-glow"></div>
      <div class="sun-rays">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="rayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fff3a8" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g transform="translate(100,100)">
            <!-- 12 лучей -->
            <g id="rayGroup"></g>
          </g>
        </svg>
      </div>
      <div class="sun-core"></div>
    </div>
  </div>

  <!-- Горизонт -->
  <div class="horizon"></div>
  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <path fill="rgba(60, 30, 60, 0.55)" d="M0,220 C240,140 480,280 720,200 C960,120 1200,240 1440,180 L1440,320 L0,320 Z"/>
    <path fill="rgba(30, 15, 35, 0.85)" d="M0,260 C200,200 400,300 640,240 C880,180 1120,280 1440,230 L1440,320 L0,320 Z"/>
  </svg>

  <!-- Контент -->
  <div class="content">
    <h1 class="greeting">Доброе утро!</h1>
    <p class="sub">Пусть этот день будет прекрасным ✨</p>
    <div class="date">
      <span class="dot"></span>
      <span id="dateText"></span>
    </div>
  </div>

<script>
  // Генерация лучей солнца
  const rayGroup = document.getElementById('rayGroup');
  for (let i = 0; i < 12; i++) {
    const angle = i * 30;
    const ray = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ray.setAttribute('d', 'M -4 -40 L 0 -95 L 4 -40 Z');
    ray.setAttribute('fill', 'url(#rayGrad)');
    ray.setAttribute('transform', `rotate(${angle})`);
    rayGroup.appendChild(ray);
  }

  // Звёзды
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
    starsEl.appendChild(s);
  }

  // Облака
  const cloudsEl = document.getElementById('clouds');
  const cloudData = [
    { w: 140, h: 40, top: '18%', dur: 60, delay: 0 },
    { w: 100, h: 30, top: '28%', dur: 80, delay: -20 },
    { w: 180, h: 50, top: '42%', dur: 100, delay: -50 },
    { w: 90, h: 28, top: '12%', dur: 70, delay: -35 },
    { w: 120, h: 35, top: '55%', dur: 90, delay: -10 },
  ];
  cloudData.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cloud';
    el.style.width = c.w + 'px';
    el.style.height = c.h + 'px';
    el.style.top = c.top;
    el.style.animationDuration = c.dur + 's';
    el.style.animationDelay = c.delay + 's';
    el.style.opacity = 0.5 + Math.random() * 0.3;
    cloudsEl.appendChild(el);
  });

  // Птицы
  const birdsEl = document.getElementById('birds');
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('div');
    b.className = 'bird';
    b.style.top = (15 + Math.random() * 35) + '%';
    b.style.animationDuration = (25 + Math.random() * 20) + 's';
    b.style.animationDelay = (-Math.random() * 30) + 's';
    b.style.fontSize = (1 + Math.random() * 0.8) + 'rem';
    b.innerHTML = `<svg viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M2 10 Q 8 4, 14 10 Q 20 4, 26 10"/>
    </svg>`;
    birdsEl.appendChild(b);
  }

  // Частицы
  const particlesEl = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = Math.random() * 40 + '%';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    particlesEl.appendChild(p);
  }

  // Дата
  const now = new Date();
  const days = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const dateStr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
  document.getElementById('dateText').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
</script>
</body>
</html>
