<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Oris Review — Оцените пользователя">
<meta name="theme-color" content="#000000">
<title>Review · Oris</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
    --bg-body: #F5F5F7;
    --bg-card: #FFFFFF;
    --bg-elevated: #F5F5F7;
    --bg-subtle: #FAFAFA;
    --text-primary: #1D1D1F;
    --text-secondary: #6E6E73;
    --text-tertiary: #AEAEB2;
    --accent: #0071E3;
    --accent-hover: #0077ED;
    --accent-light: rgba(0, 113, 227, 0.1);
    --success: #34C759;
    --success-light: rgba(52, 199, 89, 0.12);
    --danger: #FF3B30;
    --danger-light: rgba(255, 59, 48, 0.12);
    --warning: #FF9F0A;
    --border: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    --header-h: 56px;
}

:root[data-theme="dark"] {
    --bg-body: #000000;
    --bg-card: #1C1C1E;
    --bg-elevated: #2C2C2E;
    --bg-subtle: #0A0A0A;
    --text-primary: #F5F5F7;
    --text-secondary: #86868B;
    --text-tertiary: #636366;
    --accent: #0A84FF;
    --accent-hover: #409CFF;
    --accent-light: rgba(10, 132, 255, 0.12);
    --success: #30D158;
    --success-light: rgba(48, 209, 88, 0.12);
    --danger: #FF453A;
    --danger-light: rgba(255, 69, 58, 0.12);
    --warning: #FF9F0A;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
        --bg-body: #000000;
        --bg-card: #1C1C1E;
        --bg-elevated: #2C2C2E;
        --bg-subtle: #0A0A0A;
        --text-primary: #F5F5F7;
        --text-secondary: #86868B;
        --text-tertiary: #636366;
        --accent: #0A84FF;
        --accent-hover: #409CFF;
        --accent-light: rgba(10, 132, 255, 0.12);
        --success: #30D158;
        --success-light: rgba(48, 209, 88, 0.12);
        --danger: #FF453A;
        --danger-light: rgba(255, 69, 58, 0.12);
        --warning: #FF9F0A;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.12);
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
    }
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
    background-color: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-stack);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* Header */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245, 245, 247, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    height: var(--header-h);
}
:root[data-theme="dark"] .header { background: rgba(0, 0, 0, 0.72); }
@media (prefers-color-scheme: dark) {
    :root:not([data-theme]) .header { background: rgba(0, 0, 0, 0.72); }
}
.header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
}
.logo:hover { opacity: 0.75; }
.logo-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--bg-card);
    padding: 4px;
    box-shadow: var(--shadow-sm);
}
.logo-text {
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-nav {
    display: flex;
    align-items: center;
    gap: 4px;
}
.header-nav a {
    padding: 7px 14px;
    border-radius: 99px;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    transition: all 0.2s ease;
}
.header-nav a:hover {
    color: var(--text-primary);
    background: var(--border);
}
.header-nav a.active {
    color: var(--text-primary);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
}
.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}
.auth-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--text-primary);
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.auth-btn:hover { background: var(--border-strong); }
.auth-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    object-fit: cover;
}

/* Main */
.main-container {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 24px 80px;
}

/* Page Views */
.page-view { display: none; }
.page-view.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Login Page */
.login-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 48px 32px;
    text-align: center;
    box-shadow: var(--shadow-md);
}
.login-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-icon svg {
    width: 40px;
    height: 40px;
    color: var(--accent);
}
.login-title {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
}
.login-subtitle {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-bottom: 32px;
    line-height: 1.6;
}
.login-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}
#googleSignInButton {
    min-height: 44px;
}

/* Review Card */
.review-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px;
    box-shadow: var(--shadow-md);
}
.review-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 32px;
}
.review-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--bg-card);
    box-shadow: var(--shadow-md);
    margin-bottom: 16px;
}
.review-avatar-placeholder {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: var(--text-secondary);
    border: 3px solid var(--bg-card);
    box-shadow: var(--shadow-md);
    margin-bottom: 16px;
}
.review-name {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
}
.review-username {
    font-size: 0.95rem;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    margin-bottom: 8px;
}
.review-joined {
    font-size: 0.82rem;
    color: var(--text-tertiary);
}

/* Rating Bar */
.rating-section {
    margin-bottom: 32px;
}
.rating-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 12px;
    text-align: center;
}
.rating-bar-container {
    position: relative;
    height: 12px;
    background: var(--danger-light);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 12px;
}
.rating-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--success);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.rating-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.88rem;
}
.rating-stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
}
.rating-stat.likes { color: var(--success); }
.rating-stat.dislikes { color: var(--danger); }
.rating-stat.total { color: var(--text-secondary); }
.rating-percent {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
}

/* Action Buttons */
.rating-actions {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
}
.rating-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px;
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-card);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-primary);
}
.rating-btn svg {
    width: 22px;
    height: 22px;
    transition: transform 0.2s ease;
}
.rating-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}
.rating-btn:active {
    transform: translateY(0);
}
.rating-btn.like-btn {
    border-color: var(--success);
    color: var(--success);
}
.rating-btn.like-btn:hover {
    background: var(--success-light);
}
.rating-btn.like-btn.active {
    background: var(--success);
    color: white;
    border-color: var(--success);
}
.rating-btn.like-btn.active svg {
    transform: scale(1.15);
}
.rating-btn.dislike-btn {
    border-color: var(--danger);
    color: var(--danger);
}
.rating-btn.dislike-btn:hover {
    background: var(--danger-light);
}
.rating-btn.dislike-btn.active {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
}
.rating-btn.dislike-btn.active svg {
    transform: scale(1.15);
}
.rating-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
}
.rating-btn.remove-btn {
    border-color: var(--text-tertiary);
    color: var(--text-secondary);
    font-size: 0.88rem;
    padding: 12px 20px;
}
.rating-btn.remove-btn:hover {
    background: var(--bg-elevated);
}

/* Own Profile Banner */
.own-profile-banner {
    background: var(--accent-light);
    border: 1px solid rgba(10, 132, 255, 0.2);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.92rem;
    color: var(--accent);
}
.own-profile-banner svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
}

/* Share Link */
.share-section {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
}
.share-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
}
.share-url {
    display: flex;
    gap: 8px;
    align-items: center;
}
.share-url-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.copy-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.copy-btn:hover {
    background: var(--accent-hover);
}
.copy-btn.copied {
    background: var(--success);
}

/* Error/Loading */
.loading, .error-state {
    text-align: center;
    padding: 60px 20px;
}
.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-state h3 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 8px;
}
.error-state p {
    color: var(--text-secondary);
    margin-bottom: 20px;
}

/* Toast */
.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    box-shadow: var(--shadow-lg);
    min-width: 240px;
    max-width: 360px;
    font-size: 0.88rem;
    animation: slideIn 0.3s ease;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* Responsive */
@media (max-width: 640px) {
    .main-container { padding: 24px 16px 60px; }
    .review-card { padding: 24px 20px; }
    .rating-actions { flex-direction: column; }
    .login-card { padding: 32px 20px; }
    .header-nav { display: none; }
}
</style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="/" class="logo">
            <img src="/favicon.svg" alt="Oris" class="logo-icon">
            <span class="logo-text">Oris</span>
        </a>
        <nav class="header-nav">
            <a href="/">Проекты</a>
            <a href="/news">Новости</a>
            <a href="/review" class="active">Review</a>
        </nav>
        <div class="header-actions" id="headerActions"></div>
    </div>
</header>

<main class="main-container">
    <!-- Страница входа -->
    <div id="loginPage" class="page-view">
        <div class="login-card">
            <div class="login-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h1 class="login-title">Вход в Oris Review</h1>
            <p class="login-subtitle">
                Войдите через Google, чтобы оценивать других пользователей и получить свою ссылку для оценок.
            </p>
            <div class="login-actions">
                <div id="googleSignInButton"></div>
            </div>
        </div>
    </div>

    <!-- Страница оценки -->
    <div id="reviewPage" class="page-view">
        <div id="reviewContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Загрузка профиля...</p>
            </div>
        </div>
    </div>

    <!-- Страница ошибки -->
    <div id="errorPage" class="page-view">
        <div class="error-state">
            <svg width="56" height="56" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: var(--text-tertiary); opacity: 0.5; margin-bottom: 16px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 id="errorTitle">Ошибка</h3>
            <p id="errorMessage">Что-то пошло не так</p>
            <button class="auth-btn" onclick="location.reload()">Попробовать снова</button>
        </div>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================
// STATE
// ============================================
const State = {
    user: null,
    token: null,
    targetUserId: null,
    reviewData: null,
    googleInitialized: false,
    googleInitPromise: null
};

// ============================================
// API CLIENT
// ============================================
const API = {
    baseUrl: '/api/review',
    
    async request(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (State.token) {
            headers['Authorization'] = `Bearer ${State.token}`;
        }
        try {
            const res = await fetch(`${this.baseUrl}${endpoint}`, { ...options, headers });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        } catch (err) {
            if (err.name === 'TypeError') throw new Error('Нет соединения с сервером');
            throw err;
        }
    },
    
    googleAuth: (credential) => API.request('/auth/google', { method: 'POST', body: JSON.stringify({ credential }) }),
    logout: () => API.request('/auth/logout', { method: 'POST' }),
    getMe: () => API.request('/auth/me'),
    getUser: (userId) => API.request(`/user/${userId}`),
    likeUser: (userId) => API.request(`/user/${userId}/like`, { method: 'POST' }),
    dislikeUser: (userId) => API.request(`/user/${userId}/dislike`, { method: 'POST' }),
    removeRating: (userId) => API.request(`/user/${userId}/remove`, { method: 'POST' }),
    getMyLink: () => API.request('/my-link')
};

// ============================================
// TOAST
// ============================================
function toast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

// ============================================
// GOOGLE AUTH
// ============================================
function initGoogleAuth() {
    if (State.googleInitialized) return Promise.resolve();
    if (State.googleInitPromise) return State.googleInitPromise;
    
    State.googleInitPromise = new Promise((resolve, reject) => {
        const tryInit = () => {
            if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
                setTimeout(tryInit, 200);
                return;
            }
            try {
                google.accounts.id.initialize({
                    client_id: '479666067128-24dbdtd6qnebskivt7h0lnfm7mi683iu.apps.googleusercontent.com',
                    callback: handleGoogleCredential,
                    auto_select: false,
                    cancel_on_tap_outside: true,
                    context: 'signin'
                });
                State.googleInitialized = true;
                resolve();
            } catch (err) {
                State.googleInitPromise = null;
                reject(err);
            }
        };
        tryInit();
    });
    return State.googleInitPromise;
}

async function handleGoogleCredential(response) {
    try {
        const result = await API.googleAuth(response.credential);
        State.user = result.user;
        State.token = result.token;
        localStorage.setItem('review_user', JSON.stringify(State.user));
        localStorage.setItem('review_token', State.token);
        updateHeaderAuth();
        toast(`Добро пожаловать, ${State.user.displayName}!`, 'success');
        
        // Если был targetUserId — показать review
        if (State.targetUserId) {
            loadReview(State.targetUserId);
        } else {
            // Показать свой профиль
            loadReview(State.user.id);
        }
    } catch (err) {
        console.error('Auth error:', err);
        toast('Ошибка входа: ' + err.message, 'error');
    }
}

async function logout() {
    try { await API.logout(); } catch (err) {}
    State.user = null;
    State.token = null;
    localStorage.removeItem('review_user');
    localStorage.removeItem('review_token');
    updateHeaderAuth();
    showLoginPage();
    toast('Вы вышли из аккаунта', 'info');
}

async function updateHeaderAuth() {
    const container = document.getElementById('headerActions');
    if (State.user) {
        container.innerHTML = `
            <button class="auth-btn" onclick="showOwnProfile()">
                <img src="${State.user.avatar || '/favicon.svg'}" class="auth-avatar" alt="">
                <span>${escapeHtml(State.user.displayName.split(' ')[0])}</span>
            </button>
            <button class="auth-btn" onclick="logout()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span>Выйти</span>
            </button>
        `;
    } else {
        container.innerHTML = `
            <button class="auth-btn" onclick="showLoginPage()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                <span>Войти</span>
            </button>
        `;
    }
}

// ============================================
// NAVIGATION
// ============================================
function showPage(pageId) {
    document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
}

function showLoginPage() {
    showPage('loginPage');
    setTimeout(() => {
        initGoogleAuth().then(() => {
            const btnContainer = document.getElementById('googleSignInButton');
            if (btnContainer && typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.renderButton(btnContainer, {
                    theme: 'filled_black',
                    size: 'large',
                    text: 'signin_with',
                    shape: 'pill',
                    width: 240
                });
            }
        });
    }, 100);
}

async function showOwnProfile() {
    if (!State.user) {
        showLoginPage();
        return;
    }
    loadReview(State.user.id);
}

// ============================================
// REVIEW
// ============================================
async function loadReview(userId) {
    State.targetUserId = userId;
    showPage('reviewPage');
    
    const content = document.getElementById('reviewContent');
    content.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <p>Загрузка профиля...</p>
        </div>
    `;
    
    try {
        const data = await API.getUser(userId);
        State.reviewData = data;
        renderReviewCard(data);
    } catch (err) {
        console.error('Failed to load review:', err);
        showPage('errorPage');
        document.getElementById('errorTitle').textContent = 'Ошибка загрузки';
        document.getElementById('errorMessage').textContent = err.message;
    }
}

function renderReviewCard(data) {
    const content = document.getElementById('reviewContent');
    const { user, ratings, userRating, isOwnProfile, isAuthenticated } = data;
    
    const avatarHtml = user.avatar 
        ? `<img src="${escapeHtml(user.avatar)}" class="review-avatar" alt="">`
        : `<div class="review-avatar-placeholder">${escapeHtml(user.displayName.charAt(0).toUpperCase())}</div>`;
    
    const joinedDate = user.createdAt 
        ? new Date(user.createdAt).toLocaleDateString('ru-RU', { year: 'numeric', month: 'long' })
        : '';
    
    let ownProfileBanner = '';
    if (isOwnProfile) {
        ownProfileBanner = `
            <div class="own-profile-banner">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>Это ваш профиль. Вы не можете оценивать себя.</span>
            </div>
        `;
    }
    
    let actionsHtml = '';
    if (isAuthenticated && !isOwnProfile) {
        const likeActive = userRating === 'like' ? 'active' : '';
        const dislikeActive = userRating === 'dislike' ? 'active' : '';
        const removeBtn = userRating ? `
            <button class="rating-btn remove-btn" onclick="removeRating()">
                Убрать оценку
            </button>
        ` : '';
        
        actionsHtml = `
            <div class="rating-actions">
                <button class="rating-btn like-btn ${likeActive}" onclick="likeUser()" ${userRating === 'like' ? '' : ''}>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/>
                    </svg>
                    <span>Лайк</span>
                </button>
                <button class="rating-btn dislike-btn ${dislikeActive}" onclick="dislikeUser()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.715.211-1.413.608-2.008L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"/>
                    </svg>
                    <span>Дизлайк</span>
                </button>
            </div>
            ${removeBtn}
        `;
    } else if (!isAuthenticated) {
        actionsHtml = `
            <div class="rating-actions">
                <button class="rating-btn like-btn" disabled>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/>
                    </svg>
                    <span>Войдите, чтобы оценить</span>
                </button>
            </div>
        `;
    }
    
    let shareSection = '';
    if (isOwnProfile) {
        const reviewUrl = `${window.location.origin}/review?account=${user.id}`;
        shareSection = `
            <div class="share-section">
                <div class="share-label">Ваша ссылка для оценок</div>
                <div class="share-url">
                    <input type="text" class="share-url-input" value="${escapeHtml(reviewUrl)}" readonly id="shareUrlInput">
                    <button class="copy-btn" onclick="copyShareLink()">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <span>Копировать</span>
                    </button>
                </div>
            </div>
        `;
    }
    
    content.innerHTML = `
        <div class="review-card">
            ${ownProfileBanner}
            <div class="review-header">
                ${avatarHtml}
                <h1 class="review-name">${escapeHtml(user.displayName)}</h1>
                <div class="review-username">@${escapeHtml(user.username)}</div>
                ${joinedDate ? `<div class="review-joined">С ${joinedDate}</div>` : ''}
            </div>
            
            <div class="rating-section">
                <div class="rating-label">Рейтинг</div>
                <div class="rating-bar-container">
                    <div class="rating-bar-fill" style="width: ${ratings.likePercent}%"></div>
                </div>
                <div class="rating-stats">
                    <div class="rating-stat likes">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/>
                        </svg>
                        <span>${ratings.likes}</span>
                    </div>
                    <div class="rating-percent">${ratings.likePercent}%</div>
                    <div class="rating-stat dislikes">
                        <span>${ratings.dislikes}</span>
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.715.211-1.413.608-2.008L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"/>
                        </svg>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 8px; font-size: 0.82rem; color: var(--text-tertiary);">
                    Всего голосов: ${ratings.total}
                </div>
            </div>
            
            ${actionsHtml}
            ${shareSection}
        </div>
    `;
}

// ============================================
// ACTIONS
// ============================================
async function likeUser() {
    if (!State.user || !State.targetUserId) return;
    try {
        const result = await API.likeUser(State.targetUserId);
        State.reviewData.ratings = result.ratings;
        State.reviewData.userRating = result.userRating;
        renderReviewCard(State.reviewData);
        toast(result.action === 'liked' ? 'Лайк поставлен' : 'Лайк убран', 'success');
    } catch (err) {
        toast(err.message, 'error');
    }
}

async function dislikeUser() {
    if (!State.user || !State.targetUserId) return;
    try {
        const result = await API.dislikeUser(State.targetUserId);
        State.reviewData.ratings = result.ratings;
        State.reviewData.userRating = result.userRating;
        renderReviewCard(State.reviewData);
        toast(result.action === 'disliked' ? 'Дизлайк поставлен' : 'Дизлайк убран', 'success');
    } catch (err) {
        toast(err.message, 'error');
    }
}

async function removeRating() {
    if (!State.user || !State.targetUserId) return;
    try {
        const result = await API.removeRating(State.targetUserId);
        State.reviewData.ratings = result.ratings;
        State.reviewData.userRating = result.userRating;
        renderReviewCard(State.reviewData);
        toast('Оценка убрана', 'success');
    } catch (err) {
        toast(err.message, 'error');
    }
}

async function copyShareLink() {
    const input = document.getElementById('shareUrlInput');
    if (!input) return;
    try {
        await navigator.clipboard.writeText(input.value);
        const btn = input.nextElementSibling;
        btn.classList.add('copied');
        btn.innerHTML = `
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span>Скопировано</span>
        `;
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = `
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                <span>Копировать</span>
            `;
        }, 2000);
        toast('Ссылка скопирована', 'success');
    } catch (err) {
        toast('Не удалось скопировать', 'error');
    }
}

// ============================================
// HELPERS
// ============================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
}

// ============================================
// INIT
// ============================================
async function init() {
    // Восстановление сессии
    const savedUser = localStorage.getItem('review_user');
    const savedToken = localStorage.getItem('review_token');
    
    if (savedUser && savedToken) {
        try {
            State.user = JSON.parse(savedUser);
            State.token = savedToken;
            
            try {
                const me = await API.getMe();
                State.user = me.user;
                localStorage.setItem('review_user', JSON.stringify(State.user));
            } catch (err) {
                State.user = null;
                State.token = null;
                localStorage.removeItem('review_user');
                localStorage.removeItem('review_token');
            }
        } catch (err) {
            State.user = null;
            State.token = null;
            localStorage.removeItem('review_user');
            localStorage.removeItem('review_token');
        }
    }
    
    await updateHeaderAuth();
    
    // Проверяем параметр account в URL
    const urlParams = new URLSearchParams(window.location.search);
    const accountId = urlParams.get('account');
    
    if (accountId) {
        State.targetUserId = accountId;
        if (State.user) {
            loadReview(accountId);
        } else {
            // Нужно войти — показываем login, но запоминаем target
            showLoginPage();
        }
    } else if (State.user) {
        // Нет account — показываем свой профиль
        loadReview(State.user.id);
    } else {
        showLoginPage();
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
