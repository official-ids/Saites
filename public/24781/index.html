<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YouTube канал @MRPakeleksis — видео, подписчики, последние публикации">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
    <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>@MRPakeleksis · YouTube</title>

    <style>
        :root {
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --bg-elevated: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #AEAEB2;
            --accent: #FF0000;
            --accent-hover: #CC0000;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.15);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0F0F0F;
                --bg-card: #1C1C1E;
                --bg-elevated: #272727;
                --text-primary: #F5F5F7;
                --text-secondary: #AAAAAA;
                --text-tertiary: #717171;
                --border: rgba(255, 255, 255, 0.1);
                --border-strong: rgba(255, 255, 255, 0.2);
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-stack);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(245, 245, 247, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
        }

        @media (prefers-color-scheme: dark) {
            .header { background: rgba(15, 15, 15, 0.72); }
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            color: var(--accent);
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            background: transparent;
            border: none;
            font-family: inherit;
        }

        .nav-link:hover {
            background: rgba(142, 142, 147, 0.12);
            color: var(--text-primary);
        }

        /* Channel Hero */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        .channel-hero {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            gap: 32px;
            align-items: flex-start;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.6s var(--transition);
        }

        @media (max-width: 640px) {
            .channel-hero {
                flex-direction: column;
                padding: 24px;
                gap: 20px;
                align-items: center;
                text-align: center;
            }
        }

        .channel-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 3px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-info {
            flex: 1;
            min-width: 0;
        }

        .channel-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .channel-name-row { justify-content: center; }
        }

        .channel-name {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .verified-badge {
            width: 22px;
            height: 22px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .channel-handle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .channel-stats {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .channel-stats { justify-content: center; }
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .channel-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
            max-height: 100px;
            overflow: hidden;
            position: relative;
        }

        .channel-description.expanded {
            max-height: none;
        }

        .channel-description:not(.expanded)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--bg-card));
            pointer-events: none;
        }

        .expand-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .channel-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .channel-actions { justify-content: center; width: 100%; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 99px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            user-select: none;
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(142, 142, 147, 0.12);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(142, 142, 147, 0.2);
        }

        /* Section Title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .refresh-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--border-strong);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .refresh-icon {
            width: 14px;
            height: 14px;
            transition: transform 0.5s ease;
        }

        .refresh-btn.spinning .refresh-icon {
            transform: rotate(360deg);
        }

        /* Videos Grid */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            min-height: 200px;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s var(--transition);
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeInUp 0.5s var(--transition) forwards;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-strong);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--bg-elevated);
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .video-card:hover .video-thumbnail img {
            transform: scale(1.05);
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font-stack);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0);
            transition: background 0.3s ease;
        }

        .video-card:hover .play-overlay {
            background: rgba(0, 0, 0, 0.25);
        }

        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .video-card:hover .play-btn {
            opacity: 1;
            transform: scale(1);
        }

        .video-info {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;    
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        .video-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: auto;
        }

        .meta-separator {
            color: var(--text-tertiary);
        }

        /* Loading & Empty States */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 60px auto;
        }

        .state-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
        }

        .state-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            color: var(--text-tertiary);
        }

        .state-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Hero Skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--border) 50%, var(--bg-elevated) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .page-footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }

        .page-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .page-footer a:hover {
            color: var(--accent);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 99px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s var(--transition);
            z-index: 300;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 90%;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { color: var(--accent); }
        .toast.success { color: #34C759; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span class="logo-text">Oris</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Projects</a>
                <a href="/news" class="nav-link">News</a>
                <a href="/changelog" class="nav-link">Changelog</a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Channel Hero -->
        <section class="channel-hero" id="channelHero">
            <div class="channel-avatar">
                <div class="skeleton" style="width:100%;height:100%;border-radius:50%;" id="avatarSkeleton"></div>
                <img id="channelAvatarImg" src="" alt="" style="display:none;">
            </div>
            <div class="channel-info">
                <div class="channel-name-row">
                    <h1 class="channel-name" id="channelName">
                        <span class="skeleton" style="display:inline-block;width:200px;height:2rem;"></span>
                    </h1>
                    <svg class="verified-badge" fill="currentColor" viewBox="0 0 24 24" style="display:none;" id="verifiedBadge">
                        <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="channel-handle" id="channelHandle">
                    <span class="skeleton" style="display:inline-block;width:120px;height:1rem;"></span>
                </div>
                <div class="channel-stats" id="channelStats">
                    <div class="stat-item">
                        <span class="stat-value" id="subscribersCount">—</span>
                        <span class="stat-label">Подписчиков</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="videosCount">—</span>
                        <span class="stat-label">Видео</span>
                    </div>
                </div>
                <p class="channel-description" id="channelDescription"></p>
                <button class="expand-btn" id="expandBtn" style="display:none;">Показать больше</button>
                <div class="channel-actions">
                    <a href="#" class="btn btn-primary" id="openChannelBtn" target="_blank" rel="noopener">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                        Открыть на YouTube
                    </a>
                    <button class="btn btn-secondary" id="refreshAllBtn">
                        <svg class="refresh-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Обновить
                    </button>
                </div>
            </div>
        </section>

        <!-- Videos Section -->
        <section>
            <div class="section-header">
                <h2 class="section-title">Последние видео</h2>
                <button class="refresh-btn" id="refreshVideosBtn">
                    <svg class="refresh-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Обновить
                </button>
            </div>
            <div class="videos-grid" id="videosGrid">
                <div class="spinner"></div>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <p>Данные получены из публичного YouTube RSS &middot; <a href="/">Oris</a></p>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            const State = {
                channel: null,
                videos: []
            };

            const UI = {
                toast(message, type = 'info') {
                    const toast = document.getElementById('toast');
                    toast.textContent = message;
                    toast.className = `toast ${type} visible`;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => toast.classList.remove('visible'), 3000);
                },
                formatViews(n) {
                    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + ' млн';
                    if (n >= 1_000) return (n / 1_000).toFixed(1) + ' тыс.';
                    return String(n);
                },
                formatDate(isoStr) {
                    const date = new Date(isoStr);
                    const now = new Date();
                    const diffSec = Math.floor((now - date) / 1000);
                    if (diffSec < 60) return 'только что';
                    if (diffSec < 3600) return Math.floor(diffSec / 60) + ' мин назад';
                    if (diffSec < 86400) return Math.floor(diffSec / 3600) + ' ч назад';
                    if (diffSec < 2592000) return Math.floor(diffSec / 86400) + ' дн назад';
                    if (diffSec < 31536000) return Math.floor(diffSec / 2592000) + ' мес назад';
                    return Math.floor(diffSec / 31536000) + ' г назад';
                },
                escapeHtml(str) {
                    if (!str) return '';
                    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
                    return String(str).replace(/[&<>"']/g, m => map[m]);
                }
            };

            async function loadChannel(force = false) {
                try {
                    const res = await fetch('/api/youtube/channel' + (force ? '?nocache=1' : ''));
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    State.channel = data;
                    renderChannel(data);
                } catch (err) {
                    console.error('Channel load error:', err);
                    UI.toast('Не удалось загрузить данные канала', 'error');
                    renderChannelError();
                }
            }

            function renderChannel(c) {
                // Avatar
                const img = document.getElementById('channelAvatarImg');
                const skeleton = document.getElementById('avatarSkeleton');
                img.src = c.avatar;
                img.alt = c.name;
                img.onload = () => {
                    img.style.display = 'block';
                    skeleton.style.display = 'none';
                };
                img.onerror = () => {
                    skeleton.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);color:var(--text-tertiary);font-size:3rem;font-weight:700;">' + UI.escapeHtml(c.name.charAt(0).toUpperCase()) + '</div>';
                };

                // Name
                document.getElementById('channelName').textContent = c.name;

                // Handle
                document.getElementById('channelHandle').textContent = c.handle;

                // Subscribers
                document.getElementById('subscribersCount').textContent = c.subscribers || '—';

                // Videos count — из списка видео
                document.getElementById('videosCount').textContent = State.videos.length || '—';

                // Description
                const descEl = document.getElementById('channelDescription');
                if (c.description) {
                    descEl.textContent = c.description;
                    // Показать кнопку "Показать больше" если описание длинное
                    setTimeout(() => {
                        if (descEl.scrollHeight > descEl.clientHeight + 5) {
                            document.getElementById('expandBtn').style.display = 'inline';
                        }
                    }, 100);
                } else {
                    descEl.style.display = 'none';
                }

                // Channel URL
                document.getElementById('openChannelBtn').href = c.url;
            }

            function renderChannelError() {
                document.getElementById('channelName').innerHTML = '<span style="color:var(--accent);">Ошибка загрузки</span>';
                document.getElementById('channelHandle').textContent = 'Проверьте соединение и попробуйте снова';
                document.getElementById('avatarSkeleton').innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);color:var(--text-tertiary);font-size:2rem;">!</div>';
            }

            async function loadVideos(force = false) {
                const grid = document.getElementById('videosGrid');
                grid.innerHTML = '<div class="spinner"></div>';
                try {
                    const res = await fetch('/api/youtube/videos' + (force ? '?nocache=1' : ''));
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    State.videos = data;
                    document.getElementById('videosCount').textContent = data.length;
                    renderVideos(data);
                } catch (err) {
                    console.error('Videos load error:', err);
                    grid.innerHTML = `
                        <div class="state-message">
                            <svg class="state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <div class="state-title">Не удалось загрузить видео</div>
                            <div>${UI.escapeHtml(err.message)}</div>
                        </div>
                    `;
                    UI.toast('Ошибка загрузки видео', 'error');
                }
            }

            function renderVideos(videos) {
                const grid = document.getElementById('videosGrid');
                if (!videos || videos.length === 0) {
                    grid.innerHTML = `
                        <div class="state-message">
                            <svg class="state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            <div class="state-title">Нет видео</div>
                            <div>На канале пока нет публикаций</div>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = videos.map((v, idx) => `
                    <a href="${UI.escapeHtml(v.url)}" target="_blank" rel="noopener" class="video-card" style="animation-delay:${idx * 0.04}s">
                        <div class="video-thumbnail">
                            <img src="${UI.escapeHtml(v.thumbnail)}" alt="${UI.escapeHtml(v.title)}" loading="lazy">
                            <div class="play-overlay">
                                <div class="play-btn">
                                    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${UI.escapeHtml(v.title)}</div>
                            <div class="video-meta">
                                <span>${UI.formatViews(v.views)} просмотров</span>
                                <span class="meta-separator">•</span>
                                <span>${UI.formatDate(v.published)}</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            }

            function bindEvents() {
                document.getElementById('refreshAllBtn').addEventListener('click', async (e) => {
                    const btn = e.currentTarget;
                    btn.disabled = true;
                    btn.classList.add('spinning');
                    await Promise.all([loadChannel(true), loadVideos(true)]);
                    btn.disabled = false;
                    btn.classList.remove('spinning');
                    UI.toast('Данные обновлены', 'success');
                });

                document.getElementById('refreshVideosBtn').addEventListener('click', async (e) => {
                    const btn = e.currentTarget;
                    btn.disabled = true;
                    btn.classList.add('spinning');
                    await loadVideos(true);
                    btn.disabled = false;
                    btn.classList.remove('spinning');
                    UI.toast('Список видео обновлён', 'success');
                });

                document.getElementById('expandBtn').addEventListener('click', (e) => {
                    const descEl = document.getElementById('channelDescription');
                    const isExpanded = descEl.classList.toggle('expanded');
                    e.target.textContent = isExpanded ? 'Свернуть' : 'Показать больше';
                });
            }

            async function init() {
                bindEvents();
                await Promise.all([loadChannel(), loadVideos()]);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
