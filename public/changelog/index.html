<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Changelog · Oris</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --accent: #0071E3;
            --border: rgba(0, 0, 0, 0.1);
            --line: #E5E5EA;
            --success: #34C759;
            --warning: #FF9F0A;
            --danger: #FF3B30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #000000;
                --bg-card: #1C1C1E;
                --text-primary: #F5F5F7;
                --text-secondary: #86868B;
                --border: rgba(255, 255, 255, 0.1);
                --line: #38383A;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }

        header { padding: 60px 0 40px; opacity: 0; animation: fadeIn 0.6s ease forwards; }
        h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; }

        .timeline { position: relative; padding-left: 32px; margin-top: 40px; min-height: 200px; }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .release { 
            position: relative; 
            margin-bottom: 48px; 
            opacity: 0; 
            transform: translateY(10px);
            animation: slideUp 0.5s ease forwards;
        }
        .release:last-child { margin-bottom: 0; }

        .dot {
            position: absolute;
            left: -32px;
            top: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg-body);
            border: 3px solid var(--accent);
            z-index: 1;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .release:first-child .dot { 
            background: var(--accent); 
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2); 
        }

        .version-tag {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(0, 113, 227, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .date { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px; display: block; }

        .changes ul { list-style: none; }
        .changes li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .changes li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--text-secondary);
        }

        .type-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 6px;
            margin-right: 8px;
            vertical-align: middle;
            line-height: 1.4;
        }
        .type-feat     { color: #248A3D; background: rgba(52, 199, 89, 0.15); }
        .type-fix      { color: #C60000; background: rgba(255, 59, 48, 0.15); }
        .type-breaking { color: #C27800; background: rgba(255, 159, 10, 0.18); }
        .type-perf     { color: #0051A8; background: rgba(10, 132, 255, 0.15); }
        .type-docs     { color: #7D3AB0; background: rgba(175, 82, 222, 0.15); }
        .type-refactor { color: #3E3DB0; background: rgba(94, 92, 230, 0.15); }
        .type-chore    { color: #6E6E73; background: rgba(152, 152, 157, 0.15); }
        .type-security { color: #C60000; background: rgba(255, 59, 48, 0.2); }
        .type-default  { color: #6E6E73; background: rgba(152, 152, 157, 0.12); }

        @media (prefers-color-scheme: dark) {
            .type-feat     { color: #30D158; }
            .type-fix      { color: #FF453A; }
            .type-breaking { color: #FF9F0A; }
            .type-perf     { color: #0A84FF; }
            .type-docs     { color: #BF5AF2; }
            .type-refactor { color: #5E5CE6; }
            .type-chore    { color: #98989D; }
            .type-security { color: #FF453A; }
            .type-default  { color: #98989D; }
        }

        .back-link {
            display: inline-block;
            margin-top: 60px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent); }

        footer { text-align: center; margin-top: 80px; font-size: 0.8rem; color: var(--text-secondary); }

        .status-message {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .status-message.error { color: var(--danger); }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Changelog</h1>
            <p class="subtitle">История развития платформы Oris и технические обновления.</p>
        </header>

        <div id="timeline" class="timeline">
            <div class="status-message">
                <div class="spinner"></div>
                Загрузка истории изменений...
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/" class="back-link">← Вернуться к проектам</a>
        </div>

        <footer>
            &copy; <span id="year"></span> Oris Development Team
        </footer>
    </div>

<script>
(function() {
    'use strict';

    // ============================================
    // Константы конфигурации
    // ============================================
    
    /**
     * Конфигурация приложения
     * @namespace
     */
    const CONFIG = {
        /** @type {string} API endpoint для загрузки changelog */
        API_ENDPOINT: '/api/changelog',
        
        /** @type {number} Задержка анимации между элементами (мс) */
        ANIMATION_DELAY_STEP: 0.08,
        
        /** @type {string} ID элемента для отображения года */
        YEAR_ELEMENT_ID: 'year',
        
        /** @type {string} ID контейнера timeline */
        TIMELINE_CONTAINER_ID: 'timeline',
        
        /** @type {string} CSS класс для сообщений статуса */
        STATUS_MESSAGE_CLASS: 'status-message',
        
        /** @type {string} CSS класс для сообщений об ошибках */
        ERROR_MESSAGE_CLASS: 'error'
    };

    /**
     * Карта типов изменений с метаданными
     * @constant {Object<string, {label: string, cls: string}>}
     */
    const CHANGE_TYPES = {
        feat: { label: 'Feature', cls: 'type-feat' },
        feature: { label: 'Feature', cls: 'type-feat' },
        fix: { label: 'Fix', cls: 'type-fix' },
        breaking: { label: 'Breaking', cls: 'type-breaking' },
        perf: { label: 'Perf', cls: 'type-perf' },
        docs: { label: 'Docs', cls: 'type-docs' },
        refactor: { label: 'Refactor', cls: 'type-refactor' },
        chore: { label: 'Chore', cls: 'type-chore' },
        security: { label: 'Security', cls: 'type-security' },
        sec: { label: 'Security', cls: 'type-security' }
    };

    /**
     * Значения по умолчанию для типов изменений
     * @constant {{label: string, cls: string}}
     */
    const DEFAULT_CHANGE_TYPE = {
        label: 'Update',
        cls: 'type-default'
    };

    /**
     * Сообщения для UI
     * @constant {Object<string, string>}
     */
    const MESSAGES = {
        empty: 'История изменений пуста',
        loadError: 'Не удалось загрузить историю изменений',
        unknownVersion: 'Unknown'
    };

// ============================================
// Утилиты безопасности
// ============================================
const Security = {
    /**
     * Экранирование HTML-сущностей
     * @param {string|number|null|undefined} str
     * @returns {string}
     */
    escapeHtml: function(str) {
        if (!str) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(str).replace(/[&<>"']/g, function(m) {
            return map[m];
        });
    },

    /**
     * Безопасное получение текста
     * @param {string|number|null|undefined} str
     * @returns {string}
     */
    safeText: function(str) {
        return this.escapeHtml(str || '');
    }
};

    // ============================================
    // Утилиты рендеринга
    // ============================================
    
    /**
     * Создание HTML бейджа для типа изменения
     * 
     * @param {string} type - Тип изменения (feat, fix, breaking и т.д.)
     * @returns {string} - HTML строка бейджа
     * 
     * @example
     * getTypeBadge('feat');
     * // returns '<span class="type-badge type-feat">Feature</span>'
     */
    function getTypeBadge(type) {
        const normalizedType = (type || 'default').toLowerCase();
        const meta = CHANGE_TYPES[normalizedType] || DEFAULT_CHANGE_TYPE;
        
        return `<span class="type-badge ${meta.cls}">${meta.label}</span>`;
    }

    /**
     * Создание HTML для списка изменений
     * 
     * @param {Array<Object>} changes - Массив изменений
     * @returns {string} - HTML строка списка изменений
     */
    function renderChangesList(changes) {
        if (!Array.isArray(changes) || changes.length === 0) {
            return '';
        }

        const listItems = changes.map(change => {
            const safeText = Security.escapeHtml(change.text || '');
            const badge = getTypeBadge(change.type);
            return `<li>${badge} ${safeText}</li>`;
        }).join('');

        return `<ul>${listItems}</ul>`;
    }

    /**
     * Создание HTML для одного релиза
     * 
     * @param {Object} release - Данные релиза
     * @param {number} index - Индекс релиза для анимации
     * @returns {string} - HTML строка релиза
     */
    function renderRelease(release, index) {
        const safeVersion = Security.escapeHtml(release.version || MESSAGES.unknownVersion);
        const safeDate = Security.escapeHtml(release.date || '');
        const changesHtml = renderChangesList(release.changes);
        const animationDelay = index * CONFIG.ANIMATION_DELAY_STEP;

        return `
            <div class="release" style="animation-delay: ${animationDelay}s">
                <div class="dot"></div>
                <span class="version-tag">${safeVersion}</span>
                ${safeDate ? `<span class="date">${safeDate}</span>` : ''}
                <div class="changes">
                    ${changesHtml}
                </div>
            </div>
        `;
    }

    /**
     * Отображение сообщения статуса
     * 
     * @param {HTMLElement} container - Контейнер для сообщения
     * @param {string} message - Текст сообщения
     * @param {boolean} isError - Является ли сообщение ошибкой
     */
    function showStatusMessage(container, message, isError = false) {
        const messageClass = isError 
            ? `${CONFIG.STATUS_MESSAGE_CLASS} ${CONFIG.ERROR_MESSAGE_CLASS}`
            : CONFIG.STATUS_MESSAGE_CLASS;
        
        container.innerHTML = `<div class="${messageClass}">${message}</div>`;
    }

    // ============================================
    // Загрузка и отображение данных
    // ============================================
    
    /**
     * Загрузка и отображение истории изменений
     * Получает данные из API и рендерит timeline
     * 
     * @returns {Promise<void>}
     */
    async function loadChangelog() {
        const container = document.getElementById(CONFIG.TIMELINE_CONTAINER_ID);
        
        if (!container) {
            console.error('[Changelog] Timeline container not found');
            return;
        }

        try {
            const response = await fetch(CONFIG.API_ENDPOINT);
            
            if (!response.ok) {
                throw new Error(`Server responded with status ${response.status}`);
            }

            const data = await response.json();

            // Валидация данных
            if (!Array.isArray(data)) {
                throw new Error('Invalid data format: expected array');
            }

            if (data.length === 0) {
                showStatusMessage(container, MESSAGES.empty);
                return;
            }

            // Рендеринг всех релизов
            const html = data.map((release, index) => renderRelease(release, index)).join('');
            container.innerHTML = html;

        } catch (err) {
            console.error('[Changelog] Failed to load:', err);
            showStatusMessage(container, MESSAGES.loadError, true);
        }
    }

    // ============================================
    // Инициализация
    // ============================================
    
    /**
     * Установка текущего года в footer
     */
    function setCurrentYear() {
        const yearElement = document.getElementById(CONFIG.YEAR_ELEMENT_ID);
        if (yearElement) {
            yearElement.textContent = new Date().getFullYear();
        }
    }

    /**
     * Инициализация приложения
     */
    function init() {
        setCurrentYear();
        loadChangelog();
    }

    // Запуск после загрузки DOM
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
