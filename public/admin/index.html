                    <svg class="theme-icon-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                </button>
                <button class="icon-btn" id="scrollTopBtn" aria-label="Наверх" style="margin-left:auto;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                    </svg>
                </button>
            </div>
            <div class="token-status" id="tokenStatus">
                <span class="token-dot" id="tokenDot"></span>
                <span id="tokenText">Токен не введён</span>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <div class="topbar-title" id="pageTitle" data-text=""></div>
            <div class="topbar-actions" id="topbarActions"></div>
        </div>

        <div class="content" id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>Загрузка...</div>
            </div>
        </div>
    </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalTitle">Подтверждение</h3>
        <p id="modalText">Вы уверены?</p>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="modalCancel">Отмена</button>
            <button class="btn btn-danger" id="modalConfirm">Подтвердить</button>
        </div>
    </div>
</div>

<!-- Command Palette -->
<div class="cmdk-overlay" id="cmdkOverlay">
    <div class="cmdk-dialog">
        <div class="cmdk-input-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" class="cmdk-input" id="cmdkInput" placeholder="Поиск по разделам, действиям..." autocomplete="off">
            <span class="cmdk-esc">ESC</span>
        </div>
        <div class="cmdk-results" id="cmdkResults"></div>
        <div class="cmdk-footer">
            <div class="cmdk-footer-item"><kbd>↑↓</kbd> навигация</div>
            <div class="cmdk-footer-item"><kbd>↵</kbd> открыть</div>
            <div class="cmdk-footer-item"><kbd>esc</kbd> закрыть</div>
        </div>
    </div>
</div>

<!-- Hotkey hints -->
<div class="hotkey-hints" aria-hidden="true">
    <div class="hotkey-hint"><kbd>⌘K</kbd> палитра</div>
    <div class="hotkey-hint"><kbd>T</kbd> тема</div>
    <div class="hotkey-hint"><kbd>S</kbd> сохранить</div>
    <div class="hotkey-hint"><kbd>1-7</kbd> разделы</div>
    <div class="hotkey-hint"><kbd>/</kbd> поиск</div>
    <div class="hotkey-hint"><kbd>?</kbd> помощь</div>
</div>

<script>
(function() {
    'use strict';

    // ============================================
    // State Management
    // ============================================
    const State = {
        token: localStorage.getItem('admin_token') || '',
        currentSection: 'sites',
        sites: [],
        changelog: '',
        statusConfig: null,
        apiConfig: null,
        faqConfig: null,
        rawContent: '',
        searchQuery: '',
        dirty: false,
        theme: 'dark',
        cmdkFocusedIndex: -1
    };

    const CATEGORIES = {
        tools: 'Инструменты',
        dev: 'Для разработчиков',
        design: 'Дизайн',
        education: 'Образование',
        games: 'Игры',
        media: 'Медиа',
        social: 'Соцсети',
        other: 'Другое'
    };

    const $ = (id) => document.getElementById(id);

    // ============================================
    // Security
    // ============================================
    const Security = {
        HTML_ESCAPE_MAP: { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' },
        escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>"']/g, (m) => this.HTML_ESCAPE_MAP[m]);
        }
    };

    // ============================================
    // Theme System
    // ============================================
    function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
        State.theme = theme;
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('oris-theme', theme); } catch (e) {}
    }

    function toggleTheme() {
        const newTheme = State.theme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
        showToast(`Тема изменена на ${newTheme === 'dark' ? 'тёмную' : 'светлую'}`, 'info', 2000);
    }

    function initTheme() {
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('oris-theme'); } catch (e) {}
        applyTheme(savedTheme || getSystemTheme());
        $('themeToggle').addEventListener('click', toggleTheme);
    }

    // ============================================
    // Toast Notifications
    // ============================================
    const ToastIcons = {
        success: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
        error: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
        info: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
        warning: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>'
    };

    function showToast(message, type = 'info', duration = 3000) {
        const container = $('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `${ToastIcons[type] || ToastIcons.info}<span>${Security.escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 250);
        }, duration);
    }

    // ============================================
    // Modal
    // ============================================
    let modalCallback = null;

    function showModal(title, text, onConfirm) {
        $('modalTitle').textContent = title;
        $('modalText').textContent = text;
        $('modalOverlay').classList.add('visible');
        modalCallback = onConfirm;
    }

    function closeModal() {
        $('modalOverlay').classList.remove('visible');
        modalCallback = null;
    }

    $('modalCancel').addEventListener('click', closeModal);
    $('modalConfirm').addEventListener('click', () => {
        if (modalCallback) modalCallback();
        closeModal();
    });
    $('modalOverlay').addEventListener('click', (e) => {
        if (e.target === $('modalOverlay')) closeModal();
    });

    // ============================================
    // Typewriter + Glitch
    // ============================================
    let typewriterInterval = null;
    function typewriter(element, text, speed = 40) {
        if (typewriterInterval) clearInterval(typewriterInterval);
        element.textContent = '';
        element.setAttribute('data-text', '');
        const cursor = document.createElement('span');
        cursor.className = 'typewriter-cursor';
        element.appendChild(cursor);
        let i = 0;
        typewriterInterval = setInterval(() => {
            if (i < text.length) {
                element.insertBefore(document.createTextNode(text[i]), cursor);
                element.setAttribute('data-text', text.substring(0, i + 1));
                i++;
            } else {
                clearInterval(typewriterInterval);
                typewriterInterval = null;
                setTimeout(() => {
                    if (cursor.parentNode) cursor.remove();
                }, 2000);
            }
        }, speed);
    }

    function triggerGlitch() {
        const el = $('pageTitle');
        el.classList.add('glitch');
        setTimeout(() => el.classList.remove('glitch'), 400);
    }

    function setPageTitle(text) {
        typewriter($('pageTitle'), text);
    }

    // ============================================
    // Scroll to top
    // ============================================
    function initScrollTop() {
        const content = $('content');
        const btn = $('scrollTopBtn');
        content.addEventListener('scroll', () => {
            if (content.scrollTop > 400) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }, { passive: true });
        btn.addEventListener('click', () => {
            content.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    // ============================================
    // Command Palette
    // ============================================
    function openCmdk() {
        $('cmdkOverlay').classList.add('active');
        $('cmdkOverlay').style.display = 'flex';
        $('cmdkInput').value = '';
        State.cmdkFocusedIndex = -1;
        setTimeout(() => $('cmdkInput').focus(), 50);
        renderCmdkResults('');
    }

    function closeCmdk() {
        $('cmdkOverlay').classList.remove('active');
        setTimeout(() => {
            $('cmdkOverlay').style.display = 'none';
        }, 200);
    }

    function renderCmdkResults(query) {
        const q = query.toLowerCase().trim();
        const sections = [
            { id: 'sites', title: 'Проекты', desc: 'Управление каталогом сайтов', kbd: '1', icon: 'M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z' },
            { id: 'changelog', title: 'Changelog', desc: 'История изменений версий', kbd: '2', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' },
            { id: 'downloader', title: 'Файлы', desc: 'Загрузка и управление файлами', kbd: '3', icon: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4' },
            { id: 'redirects', title: 'Редиректы', desc: 'Короткие ссылки и редиректы', kbd: '4', icon: 'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1' },
            { id: 'status', title: 'Status Config', desc: 'Конфигурация мониторинга статусов', kbd: '5', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z' },
            { id: 'api', title: 'API Config', desc: 'Конфигурация API endpoints', kbd: '6', icon: 'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4' },
            { id: 'faq', title: 'FAQ', desc: 'Конфигурация часто задаваемых вопросов', kbd: '7', icon: 'M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z' }
        ];
        const actions = [
            { type: 'action', title: 'Переключить тему', desc: 'Светлая/тёмная тема', kbd: 'T', action: () => { toggleTheme(); closeCmdk(); }, icon: 'M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z' },
            { type: 'action', title: 'Сохранить изменения', desc: 'Сохранить текущий раздел', kbd: 'S', action: () => { const btn = $('saveBtn'); if (btn && !btn.disabled) btn.click(); closeCmdk(); }, icon: 'M5 13l4 4L19 7' },
            { type: 'action', title: 'Обновить данные', desc: 'Перезагрузить текущий раздел', kbd: 'R', action: () => { const btn = $('reloadBtn'); if (btn) btn.click(); closeCmdk(); }, icon: 'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15' },
            { type: 'action', title: 'Ввести токен', desc: 'Изменить admin token', action: () => { promptToken(); closeCmdk(); }, icon: 'M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z' }
        ];
        let filteredSections = sections;
        let filteredActions = actions;
        if (q) {
            filteredSections = sections.filter(s =>
                s.title.toLowerCase().includes(q) ||
                s.desc.toLowerCase().includes(q)
            );
            filteredActions = actions.filter(a =>
                a.title.toLowerCase().includes(q) ||
                (a.desc && a.desc.toLowerCase().includes(q))
            );
        }
        const items = [];
        if (filteredSections.length > 0) items.push({ group: 'Разделы', entries: filteredSections.map(s => ({ ...s, type: 'section' })) });
        if (filteredActions.length > 0) items.push({ group: 'Действия', entries: filteredActions });
        if (items.length === 0) {
            $('cmdkResults').innerHTML = '<div class="cmdk-empty">Ничего не найдено</div>';
            return;
        }
        let html = '';
        let globalIndex = 0;
        items.forEach(group => {
            html += `<div class="cmdk-group-label">${group.group}</div>`;
            group.entries.forEach(entry => {
                const isFocused = globalIndex === State.cmdkFocusedIndex;
                html += `
                    <div class="cmdk-item${isFocused ? ' focused' : ''}" data-cmdk-idx="${globalIndex}">
                        <div class="cmdk-item-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${entry.icon}"/></svg>
                        </div>
                        <div class="cmdk-item-info">
                            <div class="cmdk-item-title">${Security.escapeHtml(entry.title)}</div>
                            <div class="cmdk-item-desc">${Security.escapeHtml(entry.desc || '')}</div>
                        </div>
                        ${entry.kbd ? `<span class="cmdk-item-kbd">${entry.kbd}</span>` : ''}
                    </div>
                `;
                globalIndex++;
            });
        });
        $('cmdkResults').innerHTML = html;
        $('cmdkResults').querySelectorAll('.cmdk-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.cmdkIdx);
                executeCmdkItem(idx, items);
            });
        });
    }

    function executeCmdkItem(idx, groups) {
        let currentIdx = 0;
        for (const group of groups) {
            for (const entry of group.entries) {
                if (currentIdx === idx) {
                    if (entry.type === 'action' && entry.action) {
                        entry.action();
                    } else if (entry.type === 'section') {
                        closeCmdk();
                        switchSection(entry.id);
                    }
                    return;
                }
                currentIdx++;
            }
        }
    }

    function updateCmdkFocus(items) {
        items.forEach((item, idx) => {
            item.classList.toggle('focused', idx === State.cmdkFocusedIndex);
        });
        if (State.cmdkFocusedIndex >= 0 && items[State.cmdkFocusedIndex]) {
            items[State.cmdkFocusedIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    function initCmdk() {
        $('cmdkBtn').addEventListener('click', openCmdk);
        $('cmdkOverlay').addEventListener('click', (e) => {
            if (e.target === $('cmdkOverlay')) closeCmdk();
        });
        $('cmdkInput').addEventListener('input', (e) => {
            State.cmdkFocusedIndex = -1;
            renderCmdkResults(e.target.value);
        });
        $('cmdkInput').addEventListener('keydown', (e) => {
            const items = $('cmdkResults').querySelectorAll('.cmdk-item');
            if (!items.length) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                State.cmdkFocusedIndex = Math.min(State.cmdkFocusedIndex + 1, items.length - 1);
                updateCmdkFocus(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                State.cmdkFocusedIndex = Math.max(State.cmdkFocusedIndex - 1, -1);
                updateCmdkFocus(items);
            } else if (e.key === 'Enter' && State.cmdkFocusedIndex >= 0) {
                e.preventDefault();
                items[State.cmdkFocusedIndex].click();
            }
        });
    }

    // ============================================
    // Hotkeys
    // ============================================
    function switchSection(sectionId) {
        const navItem = document.querySelector(`.nav-item[data-section="${sectionId}"]`);
        if (navItem) navItem.click();
    }

    function initHotkeys() {
        document.addEventListener('keydown', (e) => {
            const tag = e.target.tagName;
            const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable;
            if (isInput) {
                if (e.key === 'Escape') {
                    e.target.blur();
                    if ($('cmdkOverlay').classList.contains('active')) closeCmdk();
                    if ($('modalOverlay').classList.contains('visible')) closeModal();
                }
                return;
            }
            if (e.ctrlKey || e.metaKey) {
                if ((e.key === 'k' || e.key === 'K' || e.key === 'л' || e.key === 'Л') && !e.shiftKey) {
                    e.preventDefault();
                    if ($('cmdkOverlay').classList.contains('active')) closeCmdk();
                    else openCmdk();
                    return;
                }
                if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') {
                    e.preventDefault();
                    const btn = $('saveBtn');
                    if (btn && !btn.disabled) btn.click();
                    return;
                }
                return;
            }
            if (e.altKey) return;
            switch (e.key) {
                case '/':
                    e.preventDefault();
                    const searchInput = $('searchInput');
                    if (searchInput) searchInput.focus();
                    break;
                case 't': case 'T': case 'е': case 'Е':
                    toggleTheme();
                    break;
                case 'r': case 'R': case 'к': case 'К':
                    const reloadBtn = $('reloadBtn');
                    if (reloadBtn) reloadBtn.click();
                    break;
                case '1': switchSection('sites'); break;
                case '2': switchSection('changelog'); break;
                case '3': switchSection('downloader'); break;
                case '4': switchSection('redirects'); break;
                case '5': switchSection('status'); break;
                case '6': switchSection('api'); break;
                case '7': switchSection('faq'); break;
                case 'Escape':
                    if ($('cmdkOverlay').classList.contains('active')) closeCmdk();
                    else if ($('modalOverlay').classList.contains('visible')) closeModal();
                    break;
                case '?':
                    showToast('Горячие клавиши: ⌘K палитра · T тема · S сохранить · R обновить · 1-7 разделы · / поиск · ? помощь', 'info', 5000);
                    break;
            }
        });
    }

    // ============================================
    // DOWNLOADER MODULE
    // ============================================
    const DownloaderConfig = {
        PAGE_LIMIT: 20,
        SEARCH_DEBOUNCE_MS: 300,
        MAX_FILE_SIZE: 100 * 1024 * 1024,
        ENDPOINTS: {
            list: '/api/downloader/list',
            upload: '/api/downloader/',
            item: (hash) => `/api/downloader/${hash}`,
            public: (hash) => `${window.location.origin}/downloader/${hash}`
        }
    };

    const Icons = {
        lock: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>',
        upload: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>',
        refresh: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>',
        search: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>',
        close: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>',
        folder: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>',
        link: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>',
        download: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>',
        trash: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>',
        copy: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>'
    };

    function svgIcon(name, size = 16) {
        return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:${size}px;height:${size}px;">${Icons[name] || ''}</svg>`;
    }

    function debounce(fn, delay) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(null, args), delay);
        };
    }

    const DownloaderState = {
        files: [],
        total: 0,
        page: 1,
        totalPages: 1,
        search: '',
        isLoading: false,
        isUploading: false
    };

    async function loadFiles(page = 1) {
        if (DownloaderState.isLoading) return;
        DownloaderState.isLoading = true;
        $('content').innerHTML = `<div class="loading"><div class="spinner"></div><div>Загрузка файлов...</div></div>`;
        setPageTitle('Файлы');
        $('topbarActions').innerHTML = '';
        try {
            const data = await apiRequest(`${DownloaderConfig.ENDPOINTS.list}?page=${page}&limit=${DownloaderConfig.PAGE_LIMIT}`);
            Object.assign(DownloaderState, {
                files: data.files || [],
                total: data.total || 0,
                page: data.page || 1,
                totalPages: data.totalPages || 1,
                isLoading: false
            });
            renderFiles();
        } catch (err) {
            DownloaderState.isLoading = false;
            renderFilesError(err);
        }
    }

    function renderFilesError(err) {
        if (err.message === 'UNAUTHORIZED') {
            $('content').innerHTML = `<div class="empty-state">${svgIcon('lock', 48)}<h3>Требуется авторизация</h3><p>Неверный или отсутствует токен администратора.</p><button class="btn btn-primary" id="enterTokenBtn">Ввести токен</button></div>`;
            document.getElementById('enterTokenBtn')?.addEventListener('click', promptToken);
            return;
        }
        const isNetwork = !navigator.onLine || err.name === 'TypeError';
        $('content').innerHTML = `<div class="empty-state"><h3>${isNetwork ? 'Нет соединения' : 'Ошибка'}</h3><p>${isNetwork ? 'Проверьте подключение к сети и повторите попытку.' : Security.escapeHtml(err.message)}</p><button class="btn btn-primary" id="retryBtn">Повторить</button></div>`;
        document.getElementById('retryBtn')?.addEventListener('click', () => loadFiles(DownloaderState.page));
    }

    function renderFiles() {
        renderTopbar();
        renderContent();
        bindGlobalEvents();
    }

    function renderTopbar() {
        $('filesCount').textContent = DownloaderState.total;
        $('topbarActions').innerHTML = `
            <button class="btn btn-primary" id="uploadFileBtn" ${DownloaderState.isUploading ? 'disabled' : ''}>
                ${svgIcon('upload')} Загрузить файл
            </button>
            <button class="btn btn-secondary" id="refreshFilesBtn" ${DownloaderState.isLoading ? 'disabled' : ''}>
                ${svgIcon('refresh')} Обновить
            </button>
            <div class="search-box" style="margin-left:auto; position:relative;">
                ${svgIcon('search')}
                <input type="text" id="fileSearchInput" placeholder="Поиск по имени..."
                       value="${Security.escapeHtml(DownloaderState.search)}"
                       ${DownloaderState.isLoading ? 'disabled' : ''}>
                <span class="search-kbd">/</span>
                ${DownloaderState.search ? `<button class="btn btn-ghost btn-icon" id="clearFileSearchBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);" title="Очистить">${svgIcon('close')}</button>` : ''}
            </div>`;
    }

    function renderContent() {
        $('content').innerHTML = `<div class="drop-zone" id="dropZone"><div class="sites-grid" id="filesGrid"></div></div>${renderPagination()}`;
        renderFilesList();
    }

    function renderPagination() {
        if (DownloaderState.totalPages <= 1) return '';
        return `<div style="display:flex; justify-content:center; align-items:center; gap:16px; margin-top:24px;"><button class="btn btn-secondary" id="prevPageBtn" ${DownloaderState.page <= 1 ? 'disabled' : ''}>← Назад</button><span style="color:var(--text-secondary); font-size:0.9rem; font-family:var(--mono);">Страница ${DownloaderState.page} из ${DownloaderState.totalPages} (всего ${DownloaderState.total})</span><button class="btn btn-secondary" id="nextPageBtn" ${DownloaderState.page >= DownloaderState.totalPages ? 'disabled' : ''}>Вперёд →</button></div>`;
    }

    function renderFilesList() {
        const grid = document.getElementById('filesGrid');
        const filtered = filterFiles();
        if (filtered.length === 0) {
            grid.innerHTML = renderEmptyState();
            document.getElementById('uploadEmptyBtn')?.addEventListener('click', triggerFileUpload);
            return;
        }
        const fragment = document.createDocumentFragment();
        filtered.forEach(file => fragment.appendChild(createFileCard(file)));
        grid.appendChild(fragment);
    }

    function filterFiles() {
        if (!DownloaderState.search) return DownloaderState.files;
        const q = DownloaderState.search.toLowerCase();
        return DownloaderState.files.filter(f => (f.name || '').toLowerCase().includes(q));
    }

    function renderEmptyState() {
        const hasSearch = Boolean(DownloaderState.search);
        return `<div class="empty-state">${svgIcon('folder', 48)}<h3>Нет файлов</h3><p>${hasSearch ? 'Ничего не найдено по вашему запросу.' : 'Загрузите первый файл или перетащите его сюда.'}</p>${!hasSearch ? '<button class="btn btn-primary" id="uploadEmptyBtn">Загрузить файл</button>' : ''}</div>`;
    }

    function createFileCard(file) {
        const card = document.createElement('div');
        card.className = 'site-card';
        card.dataset.hash = file.hash;
        card.innerHTML = `
            <div class="site-card-header">
                <div class="site-card-title" style="flex:1;">
                    <input type="text" class="file-name-input" value="${Security.escapeHtml(file.name)}" data-hash="${file.hash}" data-original="${Security.escapeHtml(file.name)}" placeholder="Имя файла" maxlength="255">
                </div>
                <div class="site-card-actions">
                    <button class="btn btn-ghost btn-icon" data-action="copy-link" data-hash="${file.hash}" title="Копировать ссылку">${svgIcon('link')}</button>
                    <a href="/downloader/${file.hash}" class="btn btn-ghost btn-icon" title="Скачать" target="_blank" rel="noopener">${svgIcon('download')}</a>
                    <button class="btn btn-ghost btn-icon" data-action="delete" data-hash="${file.hash}" data-name="${Security.escapeHtml(file.name)}" title="Удалить">${svgIcon('trash')}</button>
                </div>
            </div>
            <div class="site-card-body">
                <div class="field-row">
                    <div class="field"><label>Размер</label><div style="color:var(--text-primary); font-size:0.9rem; font-family:var(--mono);">${Security.escapeHtml(file.sizeFormatted)}</div></div>
                    <div class="field"><label>Тип</label><div style="color:var(--text-primary); font-size:0.85rem;">${Security.escapeHtml(file.contentType)}</div></div>
                </div>
                <div class="field">
                    <label>Хеш (SHA-256)</label>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <code style="font-size:0.8rem; color:var(--text-secondary); word-break:break-all; font-family:var(--mono);">${Security.escapeHtml(file.hash)}</code>
                        <button class="btn btn-ghost btn-icon" data-action="copy-hash" data-hash="${file.hash}" title="Копировать хеш" style="flex-shrink:0;">${svgIcon('copy', 14)}</button>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field"><label>Загрузок</label><div style="color:var(--text-primary); font-family:var(--mono);">${file.downloads ?? 0}</div></div>
                    <div class="field"><label>Загружен</label><div style="color:var(--text-primary); font-size:0.85rem;">${new Date(file.uploadedAt).toLocaleString('ru-RU')}</div></div>
                </div>
            </div>`;
        return card;
    }

    function bindGlobalEvents() {
        document.getElementById('uploadFileBtn')?.addEventListener('click', triggerFileUpload);
        document.getElementById('refreshFilesBtn')?.addEventListener('click', () => loadFiles(DownloaderState.page));
        document.getElementById('prevPageBtn')?.addEventListener('click', () => { if (DownloaderState.page > 1) loadFiles(DownloaderState.page - 1); });
        document.getElementById('nextPageBtn')?.addEventListener('click', () => { if (DownloaderState.page < DownloaderState.totalPages) loadFiles(DownloaderState.page + 1); });
        bindSearch();
        bindGridDelegation();
        bindDropZone();
    }

    function bindSearch() {
        const input = document.getElementById('fileSearchInput');
        if (!input) return;
        const debouncedSearch = debounce((value) => {
            DownloaderState.search = value;
            renderFilesList();
            const current = document.getElementById('fileSearchInput');
            if (current) {
                current.focus();
                current.setSelectionRange(value.length, value.length);
            }
        }, DownloaderConfig.SEARCH_DEBOUNCE_MS);
        input.addEventListener('input', (e) => debouncedSearch(e.target.value));
        document.getElementById('clearFileSearchBtn')?.addEventListener('click', () => {
            DownloaderState.search = '';
            renderFiles();
        });
    }

    function bindGridDelegation() {
        const grid = document.getElementById('filesGrid');
        if (!grid) return;
        grid.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            const hash = btn.dataset.hash;
            if (action === 'copy-link') {
                copyToClipboard(DownloaderConfig.ENDPOINTS.public(hash));
                showToast('Ссылка скопирована', 'info', 1500);
            } else if (action === 'copy-hash') {
                copyToClipboard(hash);
                showToast('Хеш скопирован', 'info', 1500);
            } else if (action === 'delete') {
                const name = btn.dataset.name;
                confirmDelete(hash, name);
            }
        });
        grid.addEventListener('keydown', (e) => {
            if (e.target.classList.contains('file-name-input') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
            if (e.target.classList.contains('file-name-input') && e.key === 'Escape') { e.target.value = e.target.dataset.original; e.target.blur(); }
        });
        grid.addEventListener('blur', (e) => {
            if (!e.target.classList.contains('file-name-input')) return;
            const newName = e.target.value.trim();
            const original = e.target.dataset.original;
            const hash = e.target.dataset.hash;
            if (!newName) { e.target.value = original; return; }
            if (newName === original) return;
            handleRename(hash, newName, e.target);
        }, true);
    }

    async function handleRename(hash, newName, inputEl) {
        if (newName.length > 255) {
            showToast('Имя файла слишком длинное', 'error');
            inputEl.value = inputEl.dataset.original;
            return;
        }
        try {
            await renameFile(hash, newName);
            const file = DownloaderState.files.find(f => f.hash === hash);
            if (file) file.name = newName;
            inputEl.dataset.original = newName;
            showToast('Имя обновлено', 'success');
        } catch (err) {
            inputEl.value = inputEl.dataset.original;
            showToast(err.message || 'Не удалось переименовать', 'error');
        }
    }

    function confirmDelete(hash, name) {
        showModal('Удалить файл?', `Файл «${name}» будет удалён без возможности восстановления.`, async () => {
            try {
                await deleteFile(hash);
                showToast('Файл удалён', 'success');
                await loadFiles(DownloaderState.page);
            } catch (err) {
                showToast(err.message || 'Ошибка удаления', 'error');
            }
        });
    }

    function bindDropZone() {
        const zone = document.getElementById('dropZone');
        if (!zone) return;
        ['dragenter', 'dragover'].forEach(evt => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add('drop-zone-active'); }));
        ['dragleave', 'drop'].forEach(evt => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove('drop-zone-active'); }));
        zone.addEventListener('drop', (e) => {
            const files = e.dataTransfer?.files;
            if (files?.length) uploadFile(files[0]);
        });
    }

    function triggerFileUpload() {
        if (DownloaderState.isUploading) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = false;
        input.onchange = () => {
            const file = input.files?.[0];
            if (file) uploadFile(file);
        };
        input.click();
    }

    async function uploadFile(file) {
        if (DownloaderState.isUploading) return;
        if (file.size > DownloaderConfig.MAX_FILE_SIZE) {
            showToast('Файл слишком большой (макс. 100 МБ)', 'error');
            return;
        }
        DownloaderState.isUploading = true;
        renderTopbar();
        showToast(`Загрузка «${file.name}»...`, 'info', 0);
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/api/downloader-upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${State.token}` },
                body: formData
            });
            if (res.status === 401 || res.status === 403) throw new Error('UNAUTHORIZED');
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || `Ошибка ${res.status}`);
            }
            const data = await res.json();
            showToast(data.existed ? 'Файл уже существует' : `Файл «${file.name}» загружен`, 'success');
            await loadFiles(1);
        } catch (err) {
            if (err.message === 'UNAUTHORIZED') showToast('Ошибка доступа. Проверьте токен.', 'error');
            else showToast(err.message || 'Не удалось загрузить файл', 'error');
        } finally {
            DownloaderState.isUploading = false;
            renderTopbar();
        }
    }

    async function renameFile(hash, newName) {
        return apiRequest(DownloaderConfig.ENDPOINTS.item(hash), { method: 'PATCH', body: JSON.stringify({ name: newName }) });
    }

    async function deleteFile(hash) {
        return apiRequest(DownloaderConfig.ENDPOINTS.item(hash), { method: 'DELETE' });
    }

    function copyToClipboard(text) {
        if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
        function fallbackCopy(value) {
            const ta = document.createElement('textarea');
            ta.value = value;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (_) {}
            document.body.removeChild(ta);
        }
    }

    // ============================================
    // REDIRECTS MODULE
    // ============================================
    const RedirectsConfig = {
        SEARCH_DEBOUNCE_MS: 300,
        SLUG_PATTERN: /^[a-z0-9_-]{2,32}$/,
        SLUG_MAX_LENGTH: 32,
        DESC_MAX_LENGTH: 200,
        ENDPOINTS: {
            list: '/api/redirects/admin',
            item: (slug) => `/api/redirects/admin/${slug}`,
            short: (slug) => `${window.location.origin}/r/${slug}`
        },
        MESSAGES: {
            slugInvalid: 'Slug: 2-32 символов (a-z, 0-9, -, _)',
            urlInvalid: 'Некорректный URL',
            duplicate: (slug) => `Редирект "/${slug}" уже существует`,
            empty: 'Нет редиректов',
            notFound: 'Ничего не найдено',
            createHint: 'Создайте первый редирект'
        }
    };

    const RedirectsState = {
        list: [],
        search: '',
        isLoading: false,
        isCreating: false
    };

    async function loadRedirects() {
        if (RedirectsState.isLoading) return;
        RedirectsState.isLoading = true;
        $('content').innerHTML = `<div class="loading"><div class="spinner"></div><div>Загрузка редиректов...</div></div>`;
        setPageTitle('Редиректы');
        $('topbarActions').innerHTML = '';
        try {
            const data = await apiRequest(RedirectsConfig.ENDPOINTS.list);
            RedirectsState.list = data.redirects || [];
            $('redirectsCount').textContent = RedirectsState.list.length;
            RedirectsState.isLoading = false;
            renderRedirects();
        } catch (err) {
            RedirectsState.isLoading = false;
            renderRedirectsError(err);
        }
    }

    function renderRedirectsError(err) {
        if (err.message === 'UNAUTHORIZED') {
            $('content').innerHTML = `<div class="empty-state">${svgIcon('lock', 48)}<h3>Требуется авторизация</h3><p>Неверный или отсутствует токен администратора.</p><button class="btn btn-primary" id="enterTokenBtn">Ввести токен</button></div>`;
            document.getElementById('enterTokenBtn')?.addEventListener('click', promptToken);
            return;
        }
        const isNetwork = !navigator.onLine || err.name === 'TypeError';
        $('content').innerHTML = `<div class="empty-state"><h3>${isNetwork ? 'Нет соединения' : 'Ошибка'}</h3><p>${isNetwork ? 'Проверьте подключение к сети и повторите попытку.' : Security.escapeHtml(err.message)}</p><button class="btn btn-primary" id="retryBtn">Повторить</button></div>`;
        document.getElementById('retryBtn')?.addEventListener('click', loadRedirects);
    }

    function renderRedirects() {
        renderRedirectsTopbar();
        renderRedirectsContent();
        bindRedirectsGlobalEvents();
    }

    function renderRedirectsTopbar() {
        $('topbarActions').innerHTML = `
            <button class="btn btn-primary" id="addRedirectBtn" ${RedirectsState.isCreating ? 'disabled' : ''}>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Новый редирект
            </button>
            <button class="btn btn-secondary" id="refreshRedirectsBtn" ${RedirectsState.isLoading ? 'disabled' : ''}>
                ${svgIcon('refresh')} Обновить
            </button>
            <div class="search-box" style="margin-left:auto; position:relative;">
                ${svgIcon('search')}
                <input type="text" id="redirectSearchInput" placeholder="Поиск по slug или URL..." value="${Security.escapeHtml(RedirectsState.search)}" ${RedirectsState.isLoading ? 'disabled' : ''}>
                <span class="search-kbd">/</span>
                ${RedirectsState.search ? `<button class="btn btn-ghost btn-icon" id="clearRedirectSearchBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);" title="Очистить">${svgIcon('close')}</button>` : ''}
            </div>`;
    }

    function renderRedirectsContent() {
        $('content').innerHTML = `<div id="redirectsGrid" style="display:flex; flex-direction:column; gap:16px; margin-top:20px;"></div>`;
        const grid = document.getElementById('redirectsGrid');
        grid.appendChild(createRedirectFormCard());
        const filtered = filterRedirects();
        if (filtered.length === 0) {
            grid.appendChild(createRedirectsEmptyState());
            return;
        }
        const fragment = document.createDocumentFragment();
        filtered.forEach(redirect => fragment.appendChild(createRedirectCard(redirect)));
        grid.appendChild(fragment);
    }

    function filterRedirects() {
        if (!RedirectsState.search) return RedirectsState.list;
        const q = RedirectsState.search.toLowerCase();
        return RedirectsState.list.filter(r => (r.slug || '').toLowerCase().includes(q) || (r.url || '').toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q));
    }

    function createRedirectsEmptyState() {
        const wrapper = document.createElement('div');
        wrapper.className = 'empty-state';
        wrapper.style.padding = '40px 20px';
        const hasSearch = Boolean(RedirectsState.search);
        wrapper.innerHTML = `<h3>${RedirectsConfig.MESSAGES.empty}</h3><p>${hasSearch ? RedirectsConfig.MESSAGES.notFound : RedirectsConfig.MESSAGES.createHint}</p>`;
        return wrapper;
    }

    function createRedirectFormCard() {
        const card = document.createElement('div');
        card.className = 'site-card';
        card.style.opacity = '0.85';
        card.innerHTML = `
            <div class="site-card-header">
                <div class="site-card-title" style="flex:1;">
                    <input type="text" class="new-slug-input" placeholder="slug (например: my-link)" maxlength="${RedirectsConfig.SLUG_MAX_LENGTH}" pattern="[a-z0-9_-]+">
                </div>
            </div>
            <div class="site-card-body">
                <div class="field"><label>URL назначения</label><input type="url" class="new-url-input" placeholder="https://example.com"></div>
                <div class="field"><label>Описание (необязательно)</label><input type="text" class="new-desc-input" placeholder="Краткое описание" maxlength="${RedirectsConfig.DESC_MAX_LENGTH}"></div>
            </div>
            <div class="card-footer">
                <span style="font-size:0.8rem; color:var(--text-tertiary); font-family:var(--mono);">Новый редирект</span>
                <button class="btn btn-primary" data-action="create-redirect" style="padding:8px 16px; font-size:0.85rem;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:14px;height:14px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    Создать
                </button>
            </div>`;
        return card;
    }

    function createRedirectCard(redirect) {
        const card = document.createElement('div');
        card.className = 'site-card';
        card.dataset.slug = redirect.slug;
        const shortUrl = RedirectsConfig.ENDPOINTS.short(redirect.slug);
        card.innerHTML = `
            <div class="site-card-header">
                <div class="site-card-title" style="flex:1;">
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                        <code style="font-weight:600; font-size:1rem; font-family:var(--mono);">/${Security.escapeHtml(redirect.slug)}</code>
                        <a href="${shortUrl}" target="_blank" rel="noopener" class="url-preview" style="font-size:0.8rem; color:var(--accent);">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:12px;height:12px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                            ${Security.escapeHtml(shortUrl)}
                        </a>
                    </div>
                </div>
                <div class="site-card-actions">
                    <button class="btn btn-ghost btn-icon" data-action="copy-short-url" data-url="${Security.escapeHtml(shortUrl)}" title="Копировать короткую ссылку">${svgIcon('link')}</button>
                    <button class="btn btn-ghost btn-icon" data-action="delete-redirect" data-slug="${Security.escapeHtml(redirect.slug)}" title="Удалить">${svgIcon('trash')}</button>
                </div>
            </div>
            <div class="site-card-body">
                <div class="field">
                    <label>URL назначения</label>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="word-break:break-all; flex:1; font-family:var(--mono);">${Security.escapeHtml(redirect.url)}</span>
                        <button class="btn btn-ghost btn-icon" data-action="copy-url" data-url="${Security.escapeHtml(redirect.url)}" title="Копировать URL">${svgIcon('copy', 14)}</button>
                    </div>
                </div>
                ${redirect.description ? `<div class="field"><label>Описание</label><div style="color:var(--text-secondary);">${Security.escapeHtml(redirect.description)}</div></div>` : ''}
                <div class="field-row">
                    <div class="field"><label>Переходов</label><div style="color:var(--text-primary); font-weight:600; font-family:var(--mono);" class="redirect-clicks">${redirect.clicks ?? 0}</div></div>
                    <div class="field"><label>Последний переход</label><div style="font-size:0.85rem;">${redirect.lastClickedAt ? new Date(redirect.lastClickedAt).toLocaleString('ru-RU') : '—'}</div></div>
                </div>
                <div class="field-row">
                    <div class="field"><label>Создан</label><div style="font-size:0.85rem;">${new Date(redirect.createdAt).toLocaleString('ru-RU')}</div></div>
                    <div class="field"><label>Статус</label><div style="font-size:0.85rem; display:flex; align-items:center; gap:6px;"><span style="width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 6px var(--success);"></span>Активен</div></div>
                </div>
            </div>`;
        return card;
    }

    function bindRedirectsGlobalEvents() {
        document.getElementById('addRedirectBtn')?.addEventListener('click', () => { document.querySelector('.new-slug-input')?.focus(); });
        document.getElementById('refreshRedirectsBtn')?.addEventListener('click', loadRedirects);
        bindRedirectsSearch();
        bindRedirectsGridDelegation();
    }

    function bindRedirectsSearch() {
        const input = document.getElementById('redirectSearchInput');
        if (!input) return;
        const debouncedSearch = debounce((value) => {
            RedirectsState.search = value;
            renderRedirectsContent();
            const current = document.getElementById('redirectSearchInput');
            if (current) { current.focus(); current.setSelectionRange(value.length, value.length); }
        }, RedirectsConfig.SEARCH_DEBOUNCE_MS);
        input.addEventListener('input', (e) => debouncedSearch(e.target.value));
        document.getElementById('clearRedirectSearchBtn')?.addEventListener('click', () => { RedirectsState.search = ''; renderRedirects(); });
    }

    function bindRedirectsGridDelegation() {
        const grid = document.getElementById('redirectsGrid');
        if (!grid) return;
        grid.addEventListener('click', async (e) => {
            const actionBtn = e.target.closest('[data-action]');
            if (!actionBtn) return;
            const action = actionBtn.dataset.action;
            if (action === 'create-redirect') await handleCreateRedirect();
            else if (action === 'delete-redirect') confirmDeleteRedirect(actionBtn.dataset.slug);
            else if (action === 'copy-short-url' || action === 'copy-url') { copyToClipboard(actionBtn.dataset.url); showToast('Ссылка скопирована', 'info', 1500); }
        });
        grid.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const isInForm = e.target.closest('.new-slug-input, .new-url-input, .new-desc-input');
            if (!isInForm) return;
            e.preventDefault();
            handleCreateRedirect();
        });
    }

    async function handleCreateRedirect() {
        if (RedirectsState.isCreating) return;
        const slugInput = document.querySelector('.new-slug-input');
        const urlInput = document.querySelector('.new-url-input');
        const descInput = document.querySelector('.new-desc-input');
        if (!slugInput || !urlInput) return;
        const slug = slugInput.value.trim().toLowerCase();
        const url = urlInput.value.trim();
        const description = descInput?.value.trim() || '';
        if (!RedirectsConfig.SLUG_PATTERN.test(slug)) { showToast(RedirectsConfig.MESSAGES.slugInvalid, 'error'); slugInput.focus(); return; }
        if (!isValidUrl(url)) { showToast(RedirectsConfig.MESSAGES.urlInvalid, 'error'); urlInput.focus(); return; }
        if (RedirectsState.list.some(r => r.slug === slug)) { showToast(RedirectsConfig.MESSAGES.duplicate(slug), 'error'); slugInput.focus(); return; }
        RedirectsState.isCreating = true;
        try {
            await createRedirect(slug, url, description);
            slugInput.value = ''; urlInput.value = '';
            if (descInput) descInput.value = '';
            showToast(`Редирект "/${slug}" создан`, 'success');
            await loadRedirects();
        } catch (err) {
            showToast(err.message || 'Не удалось создать редирект', 'error');
        } finally {
            RedirectsState.isCreating = false;
        }
    }

    function confirmDeleteRedirect(slug) {
        showModal('Удалить редирект?', `Редирект "/${slug}" будет удалён безвозвратно.`, async () => {
            try { await deleteRedirect(slug); showToast('Редирект удалён', 'success'); await loadRedirects(); }
            catch (err) { showToast(err.message || 'Ошибка удаления', 'error'); }
        });
    }

    async function createRedirect(slug, url, description) {
        return apiRequest(RedirectsConfig.ENDPOINTS.list, { method: 'POST', body: JSON.stringify({ slug, url, description }) });
    }

    async function deleteRedirect(slug) {
        return apiRequest(RedirectsConfig.ENDPOINTS.item(slug), { method: 'DELETE' });
    }

    function isValidUrl(string) {
        try { const url = new URL(string); return url.protocol === 'http:' || url.protocol === 'https:'; }
        catch (_) { return false; }
    }

    // ============================================
    // API COMMUNICATION
    // ============================================
    async function apiRequest(url, options = {}) {
        if (!State.token || State.token === 'Токен не введён' || State.token.trim() === '') throw new Error('UNAUTHORIZED');
        if (/[^\x00-\x7F]/.test(State.token)) { console.error('Токен содержит недопустимые символы'); throw new Error('UNAUTHORIZED'); }
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        headers['Authorization'] = `Bearer ${State.token}`;
        try {
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401 || res.status === 403) throw new Error('UNAUTHORIZED');
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || `HTTP ${res.status}`);
            }
            return await res.json();
        } catch (err) {
            if (err.message === 'UNAUTHORIZED') throw err;
            if (err.message.includes('Failed to fetch')) throw new Error('Ошибка сети. Проверьте подключение.');
            throw err;
        }
    }

    // ============================================

    // ============================================
    function parseSaites(content) {
        if (!content || typeof content !== 'string') return [];
        const blocks = content.split('::').filter(b => b && b.trim());
        const sites = [];
        const VALID_CATEGORIES = ['tools', 'dev', 'design', 'education', 'games', 'media', 'social', 'other'];
        for (const block of blocks) {
            const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length < 3) continue;
            const clean = (str) => {
                let s = str.split('@:')[0].trim();
                if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) s = s.slice(1, -1);
                return s.trim();
            };
            const title = clean(lines[0]);
            let url = clean(lines[1]);
            const desc = clean(lines[2]);
            let category = 'other';
            if (lines.length >= 4) {
                const rawCat = clean(lines[3]).toLowerCase();
                if (VALID_CATEGORIES.includes(rawCat)) category = rawCat;
            }
            if (!/^https?:\/\//i.test(url)) url = `https://${url}`;
            if (title && url && desc) sites.push({ title, url, desc, category });
        }
        return sites;
    }

    function serializeSaites(sites) {
        return sites.map(s => {
            const url = s.url.replace(/^https?:\/\//i, '');
            const category = s.category || 'other';
            return `${s.title}\n${url}\n${s.desc}\n${category}`;
        }).join('\n::\n');
    }

    function exportCsv() {
        const rows = [['Название', 'URL', 'Описание', 'Категория']];
        State.sites.forEach(s => rows.push([s.title, s.url, s.desc, CATEGORIES[s.category] || s.category]));
        const csvContent = rows.map(r => r.map(f => `"${f.replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'sites.csv';
        link.click();
        showToast('Экспортировано в CSV', 'success');
    }

    function addSite() {
        State.sites.push({ title: 'Новый проект', url: 'https://', desc: 'Описание проекта...', category: 'other' });

        renderSites();
        setTimeout(() => { $('content').scrollTop = $('content').scrollHeight; }, 100);
        showToast('Добавлен новый проект', 'info');
    }

    function markDirty() {
        State.dirty = true;
        const saveBtn = $('saveBtn');
        if (saveBtn) saveBtn.disabled = false;
    }

    async function saveSites() {
        const invalid = State.sites.filter(s => !s.title.trim() || !s.url.trim() || !s.desc.trim());
        if (invalid.length > 0) {
            showToast(`Заполните все поля в ${invalid.length} проект(ах)`, 'error');
            return;
        }
        const content = serializeSaites(State.sites);
        try {
            await apiRequest('/api/admin/save', { method: 'POST', body: JSON.stringify({ content }) });
            State.dirty = false;
            State.rawContent = content;
            renderSites();
            showToast(`Сохранено ${State.sites.length} проектов`, 'success');
        } catch (err) {
            if (err.message === 'UNAUTHORIZED') { showToast('Ошибка доступа. Проверьте токен.', 'error'); promptToken(); }
            else showToast(err.message, 'error');
        }
    }

    function bindDragAndDrop() {
        const cards = document.querySelectorAll('.site-card');
        let dragIndex = null;
        cards.forEach(card => {
            card.addEventListener('dragstart', (e) => { dragIndex = parseInt(card.dataset.index); card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
            card.addEventListener('dragend', () => { card.classList.remove('dragging'); document.querySelectorAll('.site-card').forEach(c => c.classList.remove('drag-over')); });
            card.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; card.classList.add('drag-over'); });
            card.addEventListener('dragleave', () => { card.classList.remove('drag-over'); });
            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                const dropIndex = parseInt(card.dataset.index);
                if (dragIndex === null || dragIndex === dropIndex) return;
                const [moved] = State.sites.splice(dragIndex, 1);
                State.sites.splice(dropIndex, 0, moved);
                markDirty();
                renderSites();
                showToast('Порядок изменён', 'info', 1500);
            });
        });
    }
