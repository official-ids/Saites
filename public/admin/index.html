<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<script>try{var t=localStorage.getItem('oris-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Oris Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.0/index.css">
<style>
:root {
    --bg: #F5F5F7;
    --bg-sidebar: rgba(255, 255, 255, 0.8);
    --bg-card: rgba(255, 255, 255, 0.55);
    --bg-card-hover: rgba(255, 255, 255, 0.75);
    --bg-elevated: #FFFFFF;
    --bg-input: rgba(0, 0, 0, 0.04);
    --bg-subtle: #FAFAFA;
    --text-primary: #1D1D1F;
    --text-secondary: #6E6E73;
    --text-tertiary: #86868B;
    --accent: #0071E3;
    --accent-hover: #0077ED;
    --accent-soft: rgba(0, 113, 227, 0.12);
    --accent-glow: rgba(0, 113, 227, 0.25);
    --danger: #FF3B30;
    --danger-hover: #FF453A;
    --danger-soft: rgba(255, 59, 48, 0.12);
    --success: #34C759;
    --success-soft: rgba(52, 199, 89, 0.12);
    --warning: #FF9F0A;
    --warning-soft: rgba(255, 159, 10, 0.12);
    --purple: #AF52DE;
    --purple-soft: rgba(175, 82, 222, 0.12);
    --teal: #5AC8FA;
    --border: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.15);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12);
    --shadow-xl: 0 32px 64px rgba(0, 0, 0, 0.16);
    --radius-lg: 22px;
    --radius-md: 17px;
    --radius-sm: 12px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
    --transition: cubic-bezier(0.22, 0.61, 0.36, 1);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --grid-color: rgba(0, 0, 0, 0.04);
}

[data-theme="dark"] {
    --bg: #000000;
    --bg-sidebar: rgba(20, 20, 22, 0.8);
    --bg-card: rgba(40, 40, 42, 0.55);
    --bg-card-hover: rgba(55, 55, 57, 0.75);
    --bg-elevated: #2C2C2E;
    --bg-input: rgba(255, 255, 255, 0.06);
    --bg-subtle: #0D0D0D;
    --text-primary: #F5F5F7;
    --text-secondary: #A1A1A6;
    --text-tertiary: #6E6E73;
    --accent: #0A84FF;
    --accent-hover: #409CFF;
    --accent-soft: rgba(10, 132, 255, 0.18);
    --accent-glow: rgba(10, 132, 255, 0.4);
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
    --shadow-xl: 0 32px 64px rgba(0, 0, 0, 0.6);
    --grid-color: rgba(255, 255, 255, 0.03);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
    transition: background-color 0.4s ease, color 0.4s ease;
}

/* Background grid */
.bg-grid {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
    background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    animation: gridShift 30s linear infinite;
}
@keyframes gridShift {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 48px 48px, 48px 48px; }
}

/* Floating orbs */
.bg-orbs {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
    overflow: hidden;
}
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: orbFloat 20s ease-in-out infinite;
}
[data-theme="light"] .orb { opacity: 0.3; }
.orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    top: -150px; right: -150px;
    animation-duration: 25s;
}
.orb-2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--purple) 0%, transparent 70%);
    bottom: -200px; left: -200px;
    animation-duration: 30s;
    animation-delay: -5s;
}
.orb-3 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, var(--teal) 0%, transparent 70%);
    top: 50%; left: 30%;
    animation-duration: 22s;
    animation-delay: -10s;
}
@keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(60px, -40px) scale(1.1); }
    66% { transform: translate(-40px, 50px) scale(0.95); }
}

/* Layout */
.app {
    display: flex;
    height: 100vh;
    position: relative;
    z-index: 1;
}

/* Sidebar */
.sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
}

.sidebar-header {
    padding: 22px 20px;
    border-bottom: 1px solid var(--border);
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}

.sidebar-logo svg { width: 24px; height: 24px; color: var(--accent); }

.sidebar-logo-text {
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.sidebar-subtitle {
    font-size: 0.78rem;
    color: var(--text-tertiary);
    margin-top: 4px;
    font-family: var(--mono);
}

.sidebar-nav {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
}

.sidebar-nav::-webkit-scrollbar { width: 6px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.nav-section-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    padding: 14px 12px 8px;
    font-family: var(--mono);
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s var(--transition);
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 2px;
    position: relative;
}

.nav-item:hover {
    background: rgba(142, 142, 147, 0.1);
    color: var(--text-primary);
    transform: translateX(2px);
}

.nav-item.active {
    background: var(--accent);
    color: white;
    font-weight: 600;
    box-shadow: 0 4px 12px var(--accent-glow);
}

.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

.nav-item .badge {
    margin-left: auto;
    background: rgba(142, 142, 147, 0.15);
    color: var(--text-secondary);
    padding: 2px 10px;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 600;
    font-family: var(--mono);
}

.nav-item.active .badge {
    background: rgba(255, 255, 255, 0.25);
    color: white;
}

.nav-item .nav-kbd {
    font-family: var(--mono);
    font-size: 0.62rem;
    padding: 1px 5px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    font-weight: 600;
    margin-left: auto;
}

.nav-item:not(.active) .nav-kbd {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-tertiary);
}

.sidebar-footer {
    padding: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.sidebar-footer-actions {
    display: flex;
    gap: 6px;
}

.icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    box-shadow: var(--shadow-sm);
}
.icon-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-strong);
    transform: rotate(15deg);
}
.icon-btn svg { width: 16px; height: 16px; }

.theme-icon-dark { display: none; }
[data-theme="dark"] .theme-icon-light { display: none; }
[data-theme="dark"] .theme-icon-dark { display: block; }

.token-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    padding: 10px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--mono);
}

.token-status:hover {
    background: var(--bg-card);
    border-color: var(--border-strong);
}

.token-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 8px var(--success); }
    50% { box-shadow: 0 0 12px var(--success), 0 0 0 4px rgba(52, 199, 89, 0.2); }
}

.token-dot.error {
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
    animation: none;
}

/* === ИСПРАВЛЕНИЕ ПЕРЕКРЫТИЯ ПАЛИТРЫ === */

/* Палитра команд всегда поверх ВСЕХ элементов на странице */
.cmdk-overlay {
    z-index: 9999 !important;
}

/* Подсказки горячих клавиш внизу слева */
.hotkey-hints {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 10 !important; /* Заведомо ниже палитры и модальных окон */
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text-tertiary);
    font-family: var(--mono);
    pointer-events: none !important; /* Гарантирует, что клики проходят сквозь подсказки */
    opacity: 0.7;
    transition: opacity 0.2s ease;
}

.hotkey-hints:hover {
    opacity: 1;
}

.hotkey-hint {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Автоматически скрывать подсказки, когда открыта палитра или модальное окно (для чистоты интерфейса) */
body:has(.cmdk-overlay.active) .hotkey-hints,
body:has(.modal-overlay.visible) .hotkey-hints {
    opacity: 0 !important;
}

/* На мобильных устройствах скрываем подсказки полностью, чтобы не мешали */
@media (max-width: 768px) {
    .hotkey-hints {
        display: none !important;
    }
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    position: relative;
}

.topbar {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--bg-sidebar);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    position: relative;
    z-index: 2;
}

.topbar-title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    min-height: 1.3em;
    display: inline-block;
    cursor: default;
    position: relative;
}
.topbar-title.glitch::before,
.topbar-title.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    pointer-events: none;
}
.topbar-title.glitch::before {
    animation: glitch1 0.4s ease;
    -webkit-text-fill-color: var(--danger);
}
.topbar-title.glitch::after {
    animation: glitch2 0.4s ease;
    -webkit-text-fill-color: var(--accent);
}
@keyframes glitch1 {
    0%, 100% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 0.8; transform: translate(-3px, 1px); }
    40% { opacity: 0.6; transform: translate(2px, -1px); }
    60% { opacity: 0.4; transform: translate(-1px, 2px); }
    80% { opacity: 0; transform: translate(0, 0); }
}
@keyframes glitch2 {
    0%, 100% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 0.6; transform: translate(3px, -1px); }
    40% { opacity: 0.4; transform: translate(-2px, 1px); }
    60% { opacity: 0.3; transform: translate(1px, -2px); }
    80% { opacity: 0; transform: translate(0, 0); }
}
.typewriter-cursor {
    display: inline-block;
    width: 2px;
    height: 0.85em;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
    -webkit-text-fill-color: var(--accent);
}
@keyframes blink {
    50% { opacity: 0; }
}

.topbar-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.content {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    position: relative;
}

.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* Buttons */
.btn {
    padding: 10px 18px;
    border-radius: 99px;
    border: none;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    white-space: nowrap;
}

.btn svg { width: 16px; height: 16px; }

.btn-primary {
    background: var(--accent);
    color: white;
    box-shadow: 0 2px 8px var(--accent-glow);
}

.btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px var(--accent-glow);
}

.btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

.btn-secondary:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-1px);
}

.btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(255, 69, 58, 0.3);
}

.btn-danger:hover:not(:disabled) {
    background: var(--danger-soft);
    border-color: var(--danger);
    transform: translateY(-1px);
}

.btn-ghost {
    background: transparent;
    color: var(--text-secondary);
}

.btn-ghost:hover:not(:disabled) {
    background: rgba(142, 142, 147, 0.1);
    color: var(--text-primary);
}

.btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-icon {
    width: 38px;
    height: 38px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
}

/* Toolbar */
.toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
}

.search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
}

.search-box input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 11px 16px 11px 42px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.2s var(--transition);
}

.search-box input::placeholder { color: var(--text-tertiary); }

.search-box input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--bg-elevated);
}

.search-box svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--text-tertiary);
    pointer-events: none;
    transition: color 0.2s ease;
}

.search-box input:focus ~ svg { color: var(--accent); }

.search-kbd {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 2px 6px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-tertiary);
    pointer-events: none;
    transition: opacity 0.2s ease;
    font-weight: 600;
}

.search-box input:focus ~ .search-kbd { opacity: 0; }

/* Sites Grid */
.sites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
}

.site-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px;
    transition: all 0.25s var(--transition);
    position: relative;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    overflow: hidden;
}

.site-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.site-card:hover::before { opacity: 1; }

.site-card:hover {
    border-color: var(--border-strong);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.site-card.dragging {
    opacity: 0.4;
    transform: scale(0.98);
}

.site-card.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.site-card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
}

.drag-handle {
    cursor: grab;
    color: var(--text-tertiary);
    padding: 4px;
    border-radius: 6px;
    transition: all 0.15s;
    flex-shrink: 0;
    margin-top: 2px;
}

.drag-handle:hover { color: var(--text-primary); background: rgba(142, 142, 147, 0.15); }
.drag-handle:active { cursor: grabbing; }
.drag-handle svg { width: 16px; height: 16px; display: block; }

.site-card-title {
    flex: 1;
    min-width: 0;
}

.site-card-title input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    padding: 2px 0;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s;
}

.site-card-title input:focus {
    outline: none;
    border-bottom-color: var(--accent);
}

.site-card-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
}

.site-card-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.field label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    font-family: var(--mono);
}

.field input, .field select, .field textarea {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.88rem;
    transition: all 0.2s var(--transition);
    width: 100%;
}

.field input::placeholder, .field textarea::placeholder { color: var(--text-tertiary); }

.field input:focus, .field select:focus, .field textarea:focus {

.field textarea {

}

    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
}

.field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.url-preview {
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
    font-family: var(--mono);
}

.url-preview:hover { text-decoration: underline; }
.url-preview svg { width: 14px; height: 14px; flex-shrink: 0; }

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}

.card-index {
    font-size: 0.8rem;
    color: var(--text-tertiary);
    font-weight: 500;
    font-family: var(--mono);
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-tertiary);
}

.empty-state svg { width: 56px; height: 56px; margin-bottom: 20px; opacity: 0.4; }
.empty-state h3 {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
}
.empty-state p { font-size: 0.92rem; margin-bottom: 24px; }

/* JSON Editor */
.json-editor-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    backdrop-filter: blur(10px);
}

.json-editor-toolbar {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-input);
    gap: 12px;
    flex-wrap: wrap;
}

.json-editor-toolbar .info {
    font-size: 0.84rem;
    color: var(--text-secondary);
    font-family: var(--mono);
}

.json-editor {
    width: 100%;
    min-height: 420px;
    background: var(--bg-subtle);
    color: var(--text-primary);
    border: none;
    padding: 18px;
    font-family: var(--mono);
    font-size: 0.88rem;
    line-height: 1.6;
    resize: vertical;
}

.json-editor:focus {
    outline: none;
    background: var(--bg);
}

/* Changelog */
.changelog-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.changelog-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
    backdrop-filter: blur(15px);
    transition: all 0.25s var(--transition);
    position: relative;
    overflow: hidden;
}

.changelog-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.changelog-card:hover::before { opacity: 1; }

.changelog-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
}

.changelog-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
}

.changelog-version {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 2px 0;
    font-family: inherit;
    min-width: 120px;
}

.changelog-version:focus { outline: none; border-bottom-color: var(--accent); }

.changelog-date {
    font-size: 0.84rem;
    color: var(--text-tertiary);
    margin-left: auto;
    background: transparent;
    border: none;
    text-align: right;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    padding: 2px 0;
}

.changelog-date:focus { outline: none; border-bottom-color: var(--accent); }

.changelog-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    align-items: flex-start;
}

.changelog-item + .changelog-item {
    border-top: 1px solid var(--border);
}

.type-badge {
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
    margin-top: 2px;
    font-family: var(--mono);
}

.type-badge.feat { background: var(--success-soft); color: var(--success); }
.type-badge.fix { background: var(--danger-soft); color: var(--danger); }
.type-badge.default { background: var(--bg-input); color: var(--text-secondary); }

.changelog-text {
    flex: 1;
    font-size: 0.9rem;
    color: var(--text-primary);
    line-height: 1.5;
}

.changelog-text input {
    width: 100%;
    background: transparent;
    border: none;
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    padding: 2px 0;
    border-bottom: 2px solid transparent;
}

.changelog-text input:focus {
    outline: none;
    border-bottom-color: var(--accent);
}

/* Toast */
.toast-container {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 1200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
}

.toast {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    padding: 14px 20px;
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    font-size: 0.92rem;
    font-weight: 500;
    pointer-events: auto;
    animation: toastIn 0.3s var(--bounce);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 260px;
    max-width: 380px;
    color: var(--text-primary);
}

.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--accent); }

.toast svg { width: 20px; height: 20px; flex-shrink: 0; }
.toast.success > svg:first-child { color: var(--success); }
.toast.error > svg:first-child { color: var(--danger); }
.toast.info > svg:first-child { color: var(--accent); }

.toast.removing {
    animation: toastOut 0.25s ease forwards;
}

@keyframes toastIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastOut {
    to { opacity: 0; transform: translateX(100%); }
}

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    z-index: 900;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.modal-overlay.visible {
    display: flex;
    opacity: 1;
}

.modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 26px;
    max-width: 460px;
    width: 100%;
    box-shadow: var(--shadow-xl);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.3s var(--bounce);
    position: relative;
    overflow: hidden;
}

.modal-overlay.visible .modal {
    transform: scale(1) translateY(0);
}

.modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
}

.modal h3 {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.02em;
}

.modal p {
    color: var(--text-secondary);
    font-size: 0.92rem;
    margin-bottom: 24px;
    line-height: 1.5;
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

/* Loading */
.loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--text-secondary);
    gap: 14px;
}

.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Scroll to top */
.scroll-top {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-md);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s var(--transition);
    pointer-events: none;
    z-index: 50;
}
.scroll-top.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}
.scroll-top:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    transform: translateY(-2px);
}
.scroll-top svg { width: 18px; height: 18px; }

/* Command Palette */
.cmdk-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    z-index: 1100;
    display: none;
    justify-content: center;
    align-items: flex-start;
    padding-top: 15vh;
    opacity: 0;
    transition: opacity 0.2s ease;
}
.cmdk-overlay.active {
    display: flex;
    opacity: 1;
}
.cmdk-dialog {
    background: var(--bg-elevated);
    width: 100%;
    max-width: 560px;
    border-radius: 20px;
    box-shadow: var(--shadow-xl);
    border: 1px solid var(--border-strong);
    overflow: hidden;
    transform: scale(0.95) translateY(-10px);
    transition: transform 0.25s var(--bounce);
}
.cmdk-overlay.active .cmdk-dialog {
    transform: scale(1) translateY(0);
}
.cmdk-input-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}
.cmdk-input-wrap svg {
    width: 18px;
    height: 18px;
    color: var(--text-tertiary);
    flex-shrink: 0;
}
.cmdk-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 1rem;
    color: var(--text-primary);
}
.cmdk-input::placeholder { color: var(--text-tertiary); }
.cmdk-esc {
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 2px 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-tertiary);
    font-weight: 600;
}
.cmdk-results {
    max-height: 400px;
    overflow-y: auto;
    padding: 8px;
}
.cmdk-group-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    padding: 8px 12px 6px;
    font-family: var(--mono);
}
.cmdk-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
    text-decoration: none;
    color: inherit;
}
.cmdk-item:hover,
.cmdk-item.focused {
    background: var(--bg-input);
}
.cmdk-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--accent-soft);
    color: var(--accent);
}
.cmdk-item-icon svg { width: 16px; height: 16px; }
.cmdk-item-info { flex: 1; min-width: 0; }
.cmdk-item-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cmdk-item-desc {
    font-size: 0.78rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--mono);
}
.cmdk-item-kbd {
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 2px 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-tertiary);
    font-weight: 600;
}
.cmdk-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 0.9rem;
}
.cmdk-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    font-size: 0.72rem;
    color: var(--text-tertiary);
    font-family: var(--mono);
    flex-wrap: wrap;
}
.cmdk-footer-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Hotkey hints */
.hotkey-hints {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text-tertiary);
    font-family: var(--mono);
}
.hotkey-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.7;
    transition: opacity 0.2s ease;
}
.hotkey-hint:hover { opacity: 1; }
kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-primary);
    box-shadow: 0 1px 0 var(--border-strong);
}

/* Drop zone */
.drop-zone {
    position: relative;
    min-height: 200px;
}
.drop-zone-active {
    outline: 2px dashed var(--accent);
    outline-offset: -8px;
    border-radius: var(--radius-md);
    background: var(--accent-soft);
}

/* Responsive */
@media (max-width: 768px) {
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.35s var(--transition);

    .sidebar.open { transform: translateX(0); }
    .sites-grid { grid-template-columns: 1fr; }
    .field-row { grid-template-columns: 1fr; }
    .hotkey-hints { display: none; }
    .toast-container { bottom: 16px; right: 16px; left: 16px; }
    .toast { min-width: 0; max-width: 100%; }
    .scroll-top { bottom: 16px; right: 16px; }
}

.hidden { display: none !important; }

.changelog-card.collapsed .changelog-items,
.changelog-card.collapsed [data-action="add-item"] {
    display: none;
}

.changelog-card.collapsed .changelog-header [data-action="collapse"] svg {

}

.changelog-card.collapsed .changelog-version,
.changelog-card.collapsed .changelog-date {
    pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
