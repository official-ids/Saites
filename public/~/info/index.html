<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информация о сервисах</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Фоновое свечение в стиле Apple Pro */
        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(60, 60, 80, 0.3) 0%, transparent 40%);
            animation: rotateGlow 30s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Контейнеры */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero секция */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 24px 80px;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            font-weight: 400;
            color: var(--text-secondary);
            max-width: 650px;
            letter-spacing: -0.01em;
        }

        /* Сетка сервисов */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding-bottom: 120px;
        }

        .service-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .service-card:hover {
            background: var(--card-hover);
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-index {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
        }

        .service-title {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .service-desc {
            font-size: 1.0625rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Анимации появления при скролле */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Задержки для карточек */
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }

        /* Адаптив */
        @media (max-width: 768px) {
            .hero {
                min-height: 60vh;
                padding: 80px 24px 60px;
            }
            .services-grid {
                grid-template-columns: 1fr;
            }
            .service-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <main>
        <section class="hero">
            <h1 class="reveal">Информация о сервисах</h1>
            <p class="reveal reveal-delay-1">Здесь вы можете найти подробную информацию о популярных сервисах.</p>
        </section>
    </main>

    <script>
        // Плавное появление элементов при скролле
        const observerOptions = {
            threshold: 0.15,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
