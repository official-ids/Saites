<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Информация о доменах</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 720px;
            text-align: center;
        }

        .label {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 24px;
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        .description {
            font-size: 17px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 40px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #1a1a1a;
            margin: 0 auto 40px;
        }

        .hint {
            font-size: 14px;
            color: #999;
            font-family: "SF Mono", "Consolas", monospace;
        }

        .hint code {
            background: #f2f2f2;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="label">Домены</span>
        <h1>На этом домене вы можете узнавать информацию про домена</h1>
        <div class="divider"></div>
        <p class="description">
            Всё о структуре, символах и правилах доменных имён и URL-путей.
        </p>
        <p class="hint">Oris corp</p>
    </div>
</body>
</html>
