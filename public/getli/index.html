<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="GetLi — защищённые короткие ссылки с капчей. Создавайте ссылки и защищайте их паролем и Google reCAPTCHA.">
<meta name="theme-color" content="#000000">
<title>GetLi — Защищённые короткие ссылки · Oris</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
<style>
:root {
    --bg-body: #000000;
    --bg-card: #1C1C1E;
    --bg-elevated: #2C2C2E;
    --bg-subtle: #0A0A0A;
    --text-primary: #F5F5F7;
    --text-secondary: #86868B;
    --text-tertiary: #636366;
    --accent: #0A84FF;
    --accent-hover: #409CFF;
    --accent-light: rgba(10, 132, 255, 0.12);
    --danger: #FF453A;
    --success: #30D158;
    --warning: #FF9F0A;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.15);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    --header-h: 56px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    background: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-stack);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

.header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    height: var(--header-h);
}
.header-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 24px;
    height: 100%; display: flex; align-items: center;
    justify-content: space-between; gap: 16px;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); font-weight: 600; letter-spacing: -0.02em; cursor: pointer; }
.logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #0A84FF 0%, #5AC8FA 100%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 13px;
    font-family: var(--font-mono);
}
.nav-links { display: flex; gap: 8px; align-items: center; }
.nav-link { padding: 8px 14px; border-radius: 99px; font-size: 0.88rem; font-weight: 500; color: var(--text-secondary); text-decoration: none; transition: all 0.2s; cursor: pointer; }
.nav-link:hover { background: rgba(142,142,147,0.12); color: var(--text-primary); }
.nav-link.active { background: var(--accent); color: white; }

.auth-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--text-primary);
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}
.auth-btn:hover { background: #3A3A3C; border-color: var(--border-strong); }
.auth-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    object-fit: cover;
}

.hero {
    padding: 80px 0 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: '';
    position: absolute;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(10, 132, 255, 0.12) 0%, transparent 70%);
    pointer-events: none;
}
.hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    background: var(--accent-light);
    border: 1px solid rgba(10, 132, 255, 0.25);
    border-radius: 99px;
    font-size: 0.78rem; font-weight: 600;
    color: var(--accent-hover);
    margin-bottom: 24px;
}
.hero-title {
    font-size: 4rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #F5F5F7 0%, #86868B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.hero-title .accent {
    background: linear-gradient(135deg, #0A84FF 0%, #5AC8FA 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.hero-subtitle {
    font-size: 1.25rem;
    color: var(--text-secondary);
    max-width: 640px;
    margin: 0 auto 40px;
    line-height: 1.6;
}
.hero-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
}
.btn {
    padding: 14px 28px;
    border-radius: 99px;
    border: none;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    user-select: none;
}
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: #3A3A3C; border-color: var(--border-strong); transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text-primary); border-color: var(--border-strong); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #FF6961; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.section { padding: 60px 0; border-top: 1px solid var(--border); }
.section-header { margin-bottom: 40px; }
.section-label {
    font-size: 0.78rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent-hover); margin-bottom: 8px;
}
.section-title {
    font-size: 2.25rem; font-weight: 700;
    letter-spacing: -0.03em; margin-bottom: 12px;
}
.section-subtitle {
    font-size: 1.05rem; color: var(--text-secondary);
    max-width: 640px;
}

.features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}
.feature-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 24px;
    transition: all 0.2s;
}
.feature-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.feature-icon {
    width: 40px; height: 40px;
    background: var(--bg-elevated);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    color: var(--accent-hover);
}
.feature-icon svg { width: 20px; height: 20px; }
.feature-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
.feature-desc { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; }

.app-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
}
.app-title {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
}
.app-subtitle {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-bottom: 32px;
}

.form-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px;
    margin-bottom: 24px;
}
.form-group { margin-bottom: 20px; }
.form-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-family: var(--font-stack);
    font-size: 0.95rem;
    transition: all 0.2s;
}
.form-textarea {
    font-family: var(--font-stack);
    resize: vertical;
    min-height: 70px;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg-elevated);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-tertiary); }
.form-hint {
    font-size: 0.78rem;
    color: var(--text-tertiary);
    margin-top: 6px;
}
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
@media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
}

.tags-input {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    min-height: 48px;
    align-items: center;
    cursor: text;
    transition: all 0.2s;
}
.tags-input:focus-within {
    border-color: var(--accent);
    background: var(--bg-elevated);
}
.tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: var(--accent-light);
    border: 1px solid rgba(10, 132, 255, 0.3);
    border-radius: 99px;
    font-size: 0.82rem;
    color: var(--accent-hover);
    font-weight: 500;
}
.tag-remove {
    cursor: pointer;
    opacity: 0.7;
    font-size: 1rem;
    line-height: 1;
}
.tag-remove:hover { opacity: 1; }
.tags-input input {
    flex: 1;
    min-width: 100px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 0.9rem;
    padding: 4px;
}

.result-card {
    background: linear-gradient(135deg, rgba(10, 132, 255, 0.08) 0%, var(--bg-card) 100%);
    border: 1px solid var(--accent);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-top: 24px;
    display: none;
}
.result-card.show { display: block; animation: slideUp 0.3s ease; }
@keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.result-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-hover);
    margin-bottom: 8px;
}
.result-url {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    color: var(--text-primary);
    word-break: break-all;
    padding: 12px;
    background: var(--bg-subtle);
    border-radius: var(--radius-md);
    margin-bottom: 12px;
}
.result-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.links-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
}
.search-box input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 0.9rem;
}
.search-box input:focus {
    outline: none;
    border-color: var(--accent);
}
.search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
}
.toolbar-actions { display: flex; gap: 6px; }

.links-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.link-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    transition: all 0.2s;
    cursor: pointer;
}
.link-item:hover { border-color: var(--border-strong); }
.link-item.selected {
    border-color: var(--accent);
    background: var(--accent-light);
}
.link-item-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}
.link-checkbox {
    width: 18px; height: 18px;
    cursor: pointer;
    accent-color: var(--accent);
}
.link-alias {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    color: var(--accent-hover);
    font-weight: 600;
}
.link-target {
    font-size: 0.82rem;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
    margin-bottom: 6px;
}
.link-description {
    font-size: 0.82rem;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    font-style: italic;
}
.link-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
}
.link-tag {
    padding: 2px 8px;
    background: var(--bg-elevated);
    border-radius: 99px;
    font-size: 0.72rem;
    color: var(--text-secondary);
}
.link-meta {
    display: flex;
    gap: 12px;
    font-size: 0.72rem;
    color: var(--text-tertiary);
    flex-wrap: wrap;
}
.link-meta span { display: flex; align-items: center; gap: 4px; }
.link-meta .expired { color: var(--danger); }
.link-actions { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.icon-btn {
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
    font-size: 0.78rem;
    transition: all 0.2s;
}
.icon-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.icon-btn.danger:hover { background: rgba(255, 69, 58, 0.15); color: var(--danger); border-color: var(--danger); }
.icon-btn svg { width: 14px; height: 14px; }

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
}
.pagination button {
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.85rem;
}
.pagination button:hover:not(:disabled) { background: var(--bg-elevated); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination button.active { background: var(--accent); border-color: var(--accent); }

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state h3 { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px; }

.captcha-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at center, rgba(10, 132, 255, 0.08) 0%, var(--bg-body) 70%);
}
.captcha-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-lg);
}
.captcha-logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #0A84FF 0%, #5AC8FA 100%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    color: white; font-weight: 800; font-size: 24px;
    font-family: var(--font-mono);
}
.captcha-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
}
.captcha-desc {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-bottom: 24px;
    line-height: 1.5;
}
.captcha-alias {
    font-family: var(--font-mono);
    font-size: 0.88rem;
    color: var(--accent-hover);
    background: var(--bg-subtle);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 24px;
    word-break: break-all;
}
.captcha-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.captcha-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.captcha-btn:hover { background: var(--accent-hover); }
.captcha-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.captcha-loader {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    color: var(--text-secondary);
    font-size: 0.9rem;
}
.captcha-loader.show { display: flex; }
.spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
}
.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
}
.stat-value {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
}
.stat-label {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
}

.device-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}
.device-bar {
    flex: 1;
    padding: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    text-align: center;
}
.device-bar-value {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
}
.device-bar-label {
    font-size: 0.72rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
}

.qr-container {
    text-align: center;
    padding: 20px;
}
.qr-container img {
    max-width: 300px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    margin: 16px 0;
}

.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    box-shadow: var(--shadow-lg);
    min-width: 240px;
    max-width: 360px;
    font-size: 0.88rem;
    animation: slideIn 0.3s ease;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

.footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--text-tertiary);
    font-size: 0.82rem;
}
.footer a { color: var(--accent-hover); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

@media (max-width: 640px) {
    .hero-title { font-size: 2.25rem; }
    .hero-subtitle { font-size: 1rem; }
    .section-title { font-size: 1.75rem; }
    .app-container { padding: 24px 16px; }
    .form-card { padding: 24px; }
    .captcha-card { padding: 28px 20px; }
}
</style>
</head>
<body>

<script>
// ============================================
// STATE
// ============================================
const State = {
    user: null,
    token: null,
    links: [],
    currentView: 'home',
    captchaAlias: null,
    currentPage: 1,
    totalPages: 1,
    searchQuery: '',
    selectedLinks: new Set(),
    lastResultUrl: null,
    recaptchaToken: null
};

// ============================================
// API CLIENT
// ============================================
const API = {
    baseUrl: '/api/getli',
    
    async request(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (State.token) {
            headers['Authorization'] = `Bearer ${State.token}`;
        }
        try {
            const res = await fetch(`${this.baseUrl}${endpoint}`, { ...options, headers });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        } catch (err) {
            if (err.name === 'TypeError') throw new Error('Нет соединения с сервером');
            throw err;
        }
    },
    
    // Авторизация
    googleAuth: (credential) => API.request('/auth/google', { 
        method: 'POST', 
        body: JSON.stringify({ credential }) 
    }),
    logout: () => API.request('/auth/logout', { method: 'POST' }),
    getMe: () => API.request('/auth/me'),
    
    // Ссылки
    createLink: (data) => API.request('/create', { 
        method: 'POST', 
        body: JSON.stringify(data) 
    }),
    getMyLinks: (params = {}) => {
        const qs = new URLSearchParams();
        if (params.page) qs.set('page', params.page);
        if (params.limit) qs.set('limit', params.limit);
        if (params.q) qs.set('q', params.q);
        if (params.tag) qs.set('tag', params.tag);
        const qsStr = qs.toString();
        return API.request('/my-links' + (qsStr ? `?${qsStr}` : ''));
    },
    updateLink: (alias, data) => API.request(`/${alias}`, { 
        method: 'PUT', 
        body: JSON.stringify(data) 
    }),
    deleteLink: (alias) => API.request(`/${alias}`, { method: 'DELETE' }),
    cloneLink: (alias, newAlias) => API.request(`/clone/${alias}`, { 
        method: 'POST', 
        body: JSON.stringify({ newAlias }) 
    }),
    bulkDelete: (aliases) => API.request('/bulk-delete', { 
        method: 'POST', 
        body: JSON.stringify({ aliases }) 
    }),
    exportLinks: () => API.request('/export'),
    getStats: (alias) => API.request(`/stats/${alias}`),
    getQr: (alias) => API.request(`/qr/${alias}`),
    
    // Капча и пароль
    verifyCaptcha: (data) => API.request('/verify-captcha', { 
        method: 'POST', 
        body: JSON.stringify(data) 
    }),
    getLinkInfo: (alias) => API.request(`/info/${alias}`)
};

// ============================================
// TOAST
// ============================================
function toast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3500);
}

// ============================================
// NAVIGATION
// ============================================
function navigate(view, params = {}) {
    State.currentView = view;
    
    if (view === 'captcha' && params.alias) {
        renderCaptchaPage(params.alias);
        return;
    }
    
    if (view === 'app' && !State.user) {
        renderLoginPage();
        return;
    }
    
    if (view === 'home') renderHomePage();
    else if (view === 'app') renderAppPage();
    else if (view === 'docs') renderDocsPage();
    else if (view === 'login') renderLoginPage();
    else if (view === 'stats' && params.alias) renderStatsPage(params.alias);
    else if (view === 'qr' && params.alias) renderQrPage(params.alias);
    
    window.scrollTo(0, 0);
}

// ============================================
// AUTH
// ============================================
function initGoogleAuth() {
    if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleAuth, 200);
        return;
    }
    
    google.accounts.id.initialize({
        client_id: '479666067128-24dbdtd6qnebskivt7h0lnfm7mi683iu.apps.googleusercontent.com',
        callback: handleGoogleCredential
    });
}

async function handleGoogleCredential(response) {
    try {
        const result = await API.googleAuth(response.credential);
        
        State.user = result.user;
        State.token = result.token;
        
        localStorage.setItem('getli_user', JSON.stringify(State.user));
        localStorage.setItem('getli_token', State.token);
        
        renderAuthButton();
        toast(`Добро пожаловать, ${State.user.name}!`, 'success');
        
        if (State.currentView === 'login') {
            navigate('app');
        }
    } catch (err) {
        console.error('Auth error:', err);
        toast('Ошибка входа: ' + err.message, 'error');
    }
}

async function logout() {
    try {
        if (State.token) {
            await API.logout();
        }
    } catch (err) {
        console.error('Logout error:', err);
    } finally {
        State.user = null;
        State.token = null;
        State.links = [];
        localStorage.removeItem('getli_user');
        localStorage.removeItem('getli_token');
        renderAuthButton();
        navigate('home');
        toast('Вы вышли из аккаунта', 'info');
    }
}

function renderAuthButton() {
    const container = document.getElementById('authContainer');
    if (State.user) {
        container.innerHTML = `
            <button class="auth-btn" onclick="logout()">
                <img src="${State.user.picture}" class="auth-avatar" alt="">
                <span>${State.user.name.split(' ')[0]}</span>
            </button>
        `;
    } else {
        container.innerHTML = `
            <button class="auth-btn" onclick="navigate('login')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                <span>Войти</span>
            </button>
        `;
    }
}

// ============================================
// TAGS INPUT
// ============================================
function initTagsInput() {
    const input = document.getElementById('tagInput');
    if (!input) return;
    
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            const value = input.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 20);
            if (value && !hasTag(value)) {
                addTag(value);
            }
            input.value = '';
        } else if (e.key === 'Backspace' && !input.value) {
            removeLastTag();
        }
    });
}

function hasTag(value) {
    return State.selectedTags && State.selectedTags.includes(value);
}

function addTag(value) {
    if (!State.selectedTags) State.selectedTags = [];
    if (State.selectedTags.length >= 5) {
        toast('Максимум 5 тегов', 'warning');
        return;
    }
    State.selectedTags.push(value);
    renderTags();
}

function removeTag(value) {
    State.selectedTags = State.selectedTags.filter(t => t !== value);
    renderTags();
}

function removeLastTag() {
    if (State.selectedTags && State.selectedTags.length > 0) {
        State.selectedTags.pop();
        renderTags();
    }
}

function renderTags() {
    const container = document.getElementById('tagsContainer');
    const input = document.getElementById('tagInput');
    if (!container || !input) return;
    
    // Удаляем старые теги
    container.querySelectorAll('.tag').forEach(t => t.remove());
    
    // Добавляем теги перед инпутом
    State.selectedTags.forEach(tag => {
        const el = document.createElement('span');
        el.className = 'tag';
        el.innerHTML = `${tag}<span class="tag-remove" onclick="removeTag('${tag}')">×</span>`;
        container.insertBefore(el, input);
    });
}

function getExpiresAt(value) {
    if (!value) return null;
    const map = {
        '1h': 60 * 60 * 1000,
        '24h': 24 * 60 * 60 * 1000,
        '7d': 7 * 24 * 60 * 60 * 1000,
        '30d': 30 * 24 * 60 * 60 * 1000,
        '90d': 90 * 24 * 60 * 60 * 1000
    };
    return new Date(Date.now() + (map[value] || 0)).toISOString();
}

    const targetUrl = document.getElementById('targetUrl').value.trim();
    const customAlias = document.getElementById('customAlias').value.trim();
    const password = document.getElementById('linkPassword').value;
    const description = document.getElementById('linkDescription').value.trim();
    const expiresSelect = document.getElementById('linkExpires').value;
    const expiresAt = getExpiresAt(expiresSelect);
    const btn = document.getElementById('createBtn');
    const btnText = btn.querySelector('span');
    const btnSvg = btn.querySelector('svg');

    if (!targetUrl) {
        toast('Укажите целевой URL', 'error');
        return;
    }

    if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        toast('URL должен начинаться с http:// или https://', 'error');
        return;
    }

    if (customAlias && !/^[a-zA-Z0-9_-]{3,50}$/.test(customAlias)) {
        toast('Алиас должен содержать 3-50 символов: a-z, A-Z, 0-9, -, _', 'error');
        return;
    }

    btn.disabled = true;
    btnSvg.style.display = 'none';
    btnText.textContent = 'Создание...';

    try {
        const result = await API.createLink({
            targetUrl,
            customAlias: customAlias || null,
            password: password || null,
            description: description || null,
            tags: State.selectedTags || [],
            expiresAt
        });

        const fullUrl = `${window.location.origin}/getli/${result.alias}`;
        document.getElementById('resultUrl').textContent = fullUrl;
        document.getElementById('resultCard').classList.add('show');
        State.lastResultUrl = fullUrl;
        State.lastResultAlias = result.alias;

        toast('Ссылка создана!', 'success');
        loadMyLinks();

        // Очистка формы
        document.getElementById('targetUrl').value = '';
        document.getElementById('customAlias').value = '';
        document.getElementById('linkPassword').value = '';
        document.getElementById('linkDescription').value = '';
        document.getElementById('linkExpires').value = '';
        State.selectedTags = [];
        renderTags();
        
        document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) {
        toast(err.message, 'error');
    } finally {
        btn.disabled = false;
        btnSvg.style.display = '';
        btnText.textContent = 'Создать ссылку';
    }
}

function copyResult() {
    const url = State.lastResultUrl || document.getElementById('resultUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {

function openResult() {

async function loadMyLinks(page = 1) {
    try {
        const result = await API.getMyLinks({
            page,
            limit: 20,
            q: State.searchQuery || undefined
        });
        State.links = result.links || [];
        State.currentPage = page;
        State.totalPages = result.totalPages || 1;
        renderLinksList();
        renderPagination();
    } catch (err) {
        console.error('Failed to load links:', err);
    }
}

function onSearchChange() {
    const input = document.getElementById('searchInput');
    if (!input) return;
    State.searchQuery = input.value.trim();
    State.selectedLinks.clear();
    updateBulkDeleteButton();
    loadMyLinks(1);
}

function renderPagination() {
    const container = document.getElementById('pagination');
    if (!container || State.totalPages <= 1) {
        if (container) container.innerHTML = '';
        return;
    }
    
    let html = `
        <button onclick="loadMyLinks(1)" ${State.currentPage === 1 ? 'disabled' : ''}>«</button>
        <button onclick="loadMyLinks(${State.currentPage - 1})" ${State.currentPage === 1 ? 'disabled' : ''}>‹</button>
    `;
    
    for (let i = 1; i <= State.totalPages; i++) {
        if (i === 1 || i === State.totalPages || Math.abs(i - State.currentPage) <= 1) {
            html += `<button onclick="loadMyLinks(${i})" class="${i === State.currentPage ? 'active' : ''}">${i}</button>`;
        } else if (Math.abs(i - State.currentPage) === 2) {
            html += `<button disabled>…</button>`;
        }
    }
    
    html += `
        <button onclick="loadMyLinks(${State.currentPage + 1})" ${State.currentPage === State.totalPages ? 'disabled' : ''}>›</button>
        <button onclick="loadMyLinks(${State.totalPages})" ${State.currentPage === State.totalPages ? 'disabled' : ''}>»</button>
    `;
    
    container.innerHTML = html;
}

// ============================================
// BULK OPERATIONS
// ============================================
function toggleSelect(alias) {
    if (State.selectedLinks.has(alias)) {
        State.selectedLinks.delete(alias);
    } else {
        State.selectedLinks.add(alias);
    }
    updateBulkDeleteButton();
    renderLinksList();
}

function updateBulkDeleteButton() {
    const btn = document.getElementById('bulkDeleteBtn');
    const count = document.getElementById('bulkCount');
    if (!btn || !count) return;
    
    const size = State.selectedLinks.size;
    count.textContent = size;
    btn.style.display = size > 0 ? 'inline-flex' : 'none';
}

async function bulkDelete() {
    const aliases = Array.from(State.selectedLinks);
    if (aliases.length === 0) return;
    
    if (!confirm(`Удалить ${aliases.length} ссылок?`)) return;
    
    try {
        await API.bulkDelete(aliases);
        toast(`Удалено: ${aliases.length}`, 'success');
        State.selectedLinks.clear();
        loadMyLinks(State.currentPage);
    } catch (err) {
        toast(err.message, 'error');
    }
}

async function exportLinks() {
    try {
        const result = await API.exportLinks();
        const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `getli-export-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('Экспорт завершён', 'success');
    } catch (err) {
        toast(err.message, 'error');
    }
}

// ============================================
// LINK OPERATIONS
// ============================================
function copyLink(alias) {
    const url = `${window.location.origin}/getli/${alias}`;
    navigator.clipboard.writeText(url).then(() => {
        toast('Ссылка скопирована', 'success');
    });
}

async function deleteLink(alias) {
    if (!confirm(`Удалить ссылку /getli/${alias}?`)) return;
    
    try {
        await API.deleteLink(alias);
        toast('Ссылка удалена', 'success');
        loadMyLinks(State.currentPage);
    } catch (err) {
        toast(err.message, 'error');
    }
}

async function cloneLink(alias) {
    const newAlias = prompt('Новый алиас (оставьте пустым для автогенерации):');
    if (newAlias === null) return;
    
    try {
        const result = await API.cloneLink(alias, newAlias || null);
        toast('Ссылка клонирована', 'success');
        loadMyLinks(State.currentPage);
    } catch (err) {
        toast(err.message, 'error');
    }
}

                </div>
            </div>
        </div>
    `;
    
    setTimeout(initRecaptcha, 500);
}

function initRecaptcha() {
    if (typeof grecaptcha === 'undefined') {
        setTimeout(initRecaptcha, 200);
        return;
    }
    
    try {
        grecaptcha.render('recaptcha-container', {
            sitekey: '6LdY7EYtAAAAALdiv-16rew4zxb7pPygFLJHW98a',
            callback: onRecaptchaSuccess,
            theme: 'dark'
        });
    } catch (err) {
        console.error('reCAPTCHA init error:', err);
    }
}

function onRecaptchaSuccess(token) {
    State.recaptchaToken = token;
}

async function verifyCaptcha() {
    if (!State.recaptchaToken) {
        toast('Пройдите капчу', 'error');
        return;
    }
    
    const password = document.getElementById('captchaPassword').value;
    const btn = document.getElementById('captchaBtn');
    const loader = document.getElementById('captchaLoader');
    
    btn.disabled = true;
    btn.style.display = 'none';
    loader.classList.add('show');
    
    try {
        const result = await API.verifyCaptcha({
            alias: State.captchaAlias,
            password: password || null,
            recaptchaToken: State.recaptchaToken
        });
        
        if (result.redirectUrl) {
            toast('Переход...', 'success');
            setTimeout(() => {
                window.location.href = result.redirectUrl;
            }, 500);
        }
    } catch (err) {
        btn.disabled = false;
        btn.style.display = 'block';
        loader.classList.remove('show');
        toast(err.message, 'error');
        
        if (typeof grecaptcha !== 'undefined') {
            grecaptcha.reset();
        }
        State.recaptchaToken = null;
    }
}

function updateActiveNav(view) {

        link.classList.remove('active');

// ============================================
// INIT
// ============================================
async function init() {
    State.selectedTags = [];
    
    const savedUser = localStorage.getItem('getli_user');
    const savedToken = localStorage.getItem('getli_token');
    
    if (savedUser && savedToken) {
        try {
            State.user = JSON.parse(savedUser);
            State.token = savedToken;
            
            try {
                const me = await API.getMe();
                State.user = me.user;
                localStorage.setItem('getli_user', JSON.stringify(State.user));
            } catch (err) {
                console.warn('Session invalid:', err.message);
                State.user = null;
                State.token = null;
                localStorage.removeItem('getli_user');
                localStorage.removeItem('getli_token');
            }
        } catch (err) {
            console.error('Failed to restore session:', err);
            State.user = null;
            State.token = null;
            localStorage.removeItem('getli_user');
            localStorage.removeItem('getli_token');
        }
    }
    
    renderAuthButton();
    
    const path = window.location.pathname;
    
    if (path.startsWith('/getli/') && path !== '/getli/' && path !== '/getli/app' && path !== '/getli/docs') {
        const alias = path.replace('/getli/', '');
        if (alias && !['app', 'docs', 'login', 'index.html'].includes(alias)) {
            navigate('captcha', { alias });
            return;
        }
    }
    
    if (path === '/getli/app') {
        navigate('app');
    } else if (path === '/getli/docs') {
        navigate('docs');
    } else {
        navigate('home');
    }
    
    initGoogleAuth();
}

document.addEventListener('DOMContentLoaded', init);
</script>
